 ["KÖLCSÖNHATÁSOK. AZ ENERGIA", "Szélerőműpark a Kisalföldön", "Az erdő életközössége"], ["A mechanikai kölcsönhatás A mozgás A környezetünkben talán leggyakrabban megfigyelhető jelenség a mozgás. Megfigyelhetjük emberek, állatok vagy járművek mozgását. A lehulló esőcseppek és a szállingózó hópelyhek is mozognak. Mozog a folyóban a víz; a levegő mozgását pedig érzékelhetjük, ha fúj a szél.", "Milyen jellegzetes mozgást láthatsz a képen?", "Milyen mozgásokat figyelhetsz meg egy séta alkalmával?", "Figyeld meg a képeket!", "A1", "A2", "B1", "B2", "Az A jelű képeken azt láthatod, hogy a földgömb az egyik helyről (a polcról) egy másik helyre (az asztalra) került. Megváltozott tehát a földgömb helye az osztályteremben. A B jelű képeken azt láthatod, hogy a földgömböt elfordítottuk a tengelye körül. Bár ugyanazon a helyen (az asztalon) maradt, a helyzete megváltozott. A mozgás során tehát megváltozhat egy test helye és helyzete is. 46", "Kölcsönhatások. Az energia"], ["Az erőhatás Ha egy test elindul vagy megáll, ha gyorsabban vagy lassabban halad, ha megváltoztatja mozgásának irányát, azt mondjuk: megváltozik a mozgásállapota. Mi szükséges a mozgásállapot megváltoztatásához? Kísérletezzünk! 1. Tegyünk egy sima papírlapra egy ötforintost, majd lökjünk neki egy másikat! Figyeljük meg, hogy az ütközés következtében mindkét test mozgásállapota megváltozik!", "FORINT FORINT BP. BP.", "1.", "FORINT FORINT BP. BP. FORINT FORINT BP. BP. FORINT FORINT BP. BP. FORINT FORINT BP. BP.", "2.", "Miért mondjuk azt, hogy a kísérlet során mindkét ötforintos mozgásállapota megváltozik?", "2. Tegyünk le az udvaron egy labdát, és rúgjuk el! A rúgás pillanatában érezzük, hogy nemcsak a lábunk hat a labdára, hanem a labda is a lábunkra! A testek mozgásállapotát megváltoztató hatást erőhatásnak nevezzük. Élőlények és élettelen testek is fejthetnek ki egymásra erőhatást. Első kísérletünkben az egyik ötforintos megállt, a másik elindult. A labda elrúgásakor lábunk lelassult, miközben a labda felgyorsult. A testek között jelentkező hatás tehát kölcsönös hatás – röviden: kölcsönhatás. A mozgásállapot-változással járó kölcsönhatásokat összefoglaló néven mechanikai kölcsönhatásnak nevezzük.", "A gravitációs kölcsönhatás Mindennapi tapasztalatunk, hogy az elengedett vagy elhajított testek a Föld felé esnek. Vajon honnan ered a mozgásállapotukat megváltoztató erőhatás? Az erőhatás a test és a Föld közötti gravitációs kölcsön hatásból származik. Ez a Föld környezetében lévő testekre mindig vonzóhatást jelent, és független a test anyagi minőségétől. A gravitációs kölcsönhatás mindig vonzásban nyilvánul meg. Pontosabban azt mondhatjuk, hogy a Földet gravitációs mező veszi körül. Ezt maga a Föld hozza létre. A gravitációs mező kölcsönhatásba lép minden olyan testtel, amely benne van. A kölcsönhatás a testre nézve a Föld felé irányuló erőt eredményez. Ez az oka annak, hogy az elengedett vagy elhajított testek lefelé esnek.", "Az elengedett vagy eldobott testek mozgása mindig a Föld felé irányul", "Kölcsönhatások. Az energia", "47"], ["A Naprendszert a Nap vonzása tartja össze (a Naprendszerről részletesen a következő fejezetben lesz szó). A gravitációs kölcsönhatás tartja Föld körüli pályán a mesterséges holdakat is.", "A Naprendszer (a rajz nem méretarányos) Milyen bolygókat ismersz fel a képen?", "A Föld körül keringő mesterséges holdak", "A gravitációs kölcsönhatás természetesen nemcsak az égitestek, hanem a „hétköznapi” testek között is hat, mértéke azonban igen kicsi.", "Eötvös Loránd (1848–1919)", "A gravitációs kölcsönhatás ismeretében megkereshetők azok a helyek, ahol a Föld felszíne alatt vasérctelepek, kőolaj- vagy földgázlelőhelyek vannak. Ezek kisebb vagy nagyobb vonzást idéznek elő, mint a környezetük. Ez egy különleges műszerrel, az Eötvös-ingával kimutatható. Így a Föld felszínén végzett mérések segítségével megtalálták a felszín alatti lelőhelyeket. A műszert Eötvös Loránd, minden idők egyik legnagyobb magyar fizikusa fejlesztette ki.", "Ellenőrizd tudásodat!", "Eötvös-inga", "1. Mikor mondhatjuk azt, hogy megváltozik egy test mozgásállapota? 2. Mi szükséges egy test mozgásállapotának megváltoztatásához? 3. Legalább hány „résztvevő” kell a mozgásállapot-változáshoz? Válaszodat indokold meg! 4. Miért esnek lefelé az elengedett testek? 5. Keressetek példákat a mechanikai (és a gravitációs) kölcsönhatásra!", "48", "Kölcsönhatások. Az energia"], ["A termikus kölcsönhatás Már az 5. évfolyamon is tanultunk arról, hogy a hőmérséklet a testek egyik fontos fizikai tulajdonsága. Tudjuk, hogy mérésére hőmérőt használunk. Ismerjük a mindennapi életben használatos Celsius-féle hőmérsékleti skálát is. Ha kb. azonos mennyiségű hideg és meleg vizet összeöntünk, az eredmény langyos víz lesz. Az alacsonyabb hőmérsékletű víz felmelegszik, a magasabb hőmérsékletű pedig lehűl. A változás tehát kölcsönös, és a közös hőmérséklet eléréséig tart.", "hideg", "meleg", "langyos", "A testek között különböző hőmérsékletük miatt fellépő kölcsönhatást termikus köl csönhatásnak nevezzük. Kísérletezzünk! A termikus kölcsönhatásban részt vevő anyagok hőmérséklet-változását külön-külön is nyomon követhetjük, ha térben elkülönítjük őket egymástól. Ezt egyszerűen megvalósíthatjuk az ábra szerint. 1. Egy nagyobb üvegedénybe egy kisebb főzőpoharat állítunk. Ebbe öntjük a meleg vizet. 2. A nagyobb edénybe hideg vizet öntünk. A két folyadék nem keveredik egymással. A vékony falú üvegedény így is lehetővé teszi a két anyag közötti termikus kölcsönhatást.", "Kölcsönhatások. Az energia", "49"], ["Kövessük nyomon a változásokat! Percenként olvassuk le, hogy milyen értékeket mutatnak a hőmérők!", "hőmérséklet (C°)", "a meleg víz hőmérsékletének változása", "A leolvasott adatokat táblázatba foglaljuk. Idő [perc]", "A meleg víz hőmérséklete [°C]", "A hideg víz hőmérséklete [°C]", "0", "42", "24", "1", "38", "30,5", "2", "35", "33", "3", "34", "34", "4", "34", "34", "0 hőmérséklet (C°)", "idő (perc)", "a hideg víz hőmérsékletének változása", "A táblázat adatai alapján grafikont is készíthetünk. A grafikon megmutatja, hogy – a termikus kölcsönhatás kezdetétől számítva – hogyan változik a melegebb, és hogyan a hidegebb víz hőmérséklete.", "0 hőmérséklet (C°)", "közös hőmérséklet", "Megfigyelhetjük, hogy a közös hőmér séklet elérése után a változás megszűnik. A termikus kölcsönhatás addig tart, amíg a testek közötti hőmérsékleti kü lönbség kiegyenlítődik.", "Ellenőrizd tudásodat!", "idő (perc)", "0", "1. Mi a feltétele annak, hogy a testek között termikus kölcsönhatás lépjen fel? 2. Hogyan változik a kölcsönhatás közben a testek hőmérséklete? 3. Meddig tart a termikus kölcsönhatás? 4. Keressetek példákat a termikus kölcsönhatásra!", "50", "Kölcsönhatások. Az energia", "idő (perc)"], ["Kísérletek, megfigyelések 1. Hogyan terjed a hő? a) Figyeld meg, hogy a forró teába tett kanálnak az a része is felmelegszik, amelyik nem is érintkezik a teával! Modellezzük ezt a jelenséget egy kísérlettel! Cseppentsetek égő gyertyából néhány cseppet egy arasznyi hosszúságú vasszegre! Melegítsétek a szeg egyik végét! Megfigyelhetitek, hogy a viaszcseppek sorban egymás után „leolvadnak” róla. Ezt úgy magyarázhatjuk, hogy a vasszeg a lángtól távolabbi helyekre is elevezeti a hőt. A jelenséget hő vezetésnek nevezzük. A vas szilárd anyag. Szilárd anyagokban a hő vezetéssel terjed.", "Kísérlet a hővezetés kimutatására", "b) Tanári segítséggel melegítsetek egy gömblombikban vizet! Közvetlenül a melegítés megkezdése előtt dobjatok bele néhány hipermangánkristályt! A hipermangán megfesti a vizet, ami megkönnyíti a megfigyelést. Először a lombik alján melegszik fel a víz. A felmelegedett víz a lombikban felfelé mozog. Ezt az egyirányú mozgást áramlásnak nevezzük. A meleg víz helyére rögtön hideg víz kerül, amely felmelegszik, és szintén felfelé áramlik.", "Kísérlet a hőáramlás kimutatására", "Készítsetek papírkígyót! Ha működő fűtőtestre helyezitek, forgásba jön. A papírkígyót a felszálló me leg levegő hozza forgásba. A fűtőtesttel érintkező levegő ugyanis felmelegszik, és felfelé áramlik. Áramlással folyadékokban és gázokban terjed a hő.", "Papírkígyó", "Kölcsönhatások. Az energia", "51"], ["c) Tapasztalatból tudjuk, hogy a napsugarak melegítenek (saját bőrünkön is érezhetjük). Pedig a Nap nagyon messze van tőlünk: 150 millió kilométerre. Ez óriási távolság, amelyen 12 000 Föld is elférne egymás mellett! A Föld és a Nap között, a világűrben nincs olyan anyag, ami a Nap melegét közvetíthetné. A Nap által termelt hő sugárzással terjed. A su gárzás a világűrön és a légkörön át érkezik hoz zánk.", "150 000 000 km-en 12 000 Föld „férne el.” Nap", "Föld", "Ilyen nagy a Föld–Nap-távolság", "2. Hűtőszekrény és klíma Hogyan működik a hűtőszekrény? Nagyon egyszerűen – mondhatná bárki. Csak betesszük az ételt a nála hidegebb hűtőtérbe, és az étel lehűl. Igen ám, de a termikus kölcsönhatásról tanultak szerint a hűtőtérnek fel kellene melegednie! Mégsem ez történik. Miért? A választ egy egyszerű kísérlet adja meg. Tanárunk egy kevés etil-alkoholt cseppent a kézfejünkre. Fújjunk rá! Érezzük, hogy miközben az alkohol elpárolog, kezünk lehűl. A párolgó anyag tehát hőt von el a környezetétől. Ezt teszi a hűtőszekrény hűtőfolyadéka is, ezáltal alacsony hőmérsékleten tartja a hűtőteret. Az elpárolgott folyadékot a hűtőszekrény egy másik szerkezete (a kompresszor) újra cseppfolyósítja, és a folyamat mehet tovább. Persze ez a folyamat sem megy magától: a hűtőszekrény elektromos árammal működik. meleg levegő", "BELTÉRI EGYSÉG meleg levegő", "hideg levegő", "kompresszor A hűtő működési elve", "kompresszor", "KÜLTÉRI EGYSÉG", "A klímaberendezés működése", "Ehhez hasonlóan működik a klímaberendezés is. A szoba levegőjét egy ventilátor „áthajtja” a klímaberendezés egyik részén, ahol a csővezetékben hűtőfolyadék található. A klímából a lehűtött levegő távozik. Ennek a működtetéséhez is elektromos áram szükséges.", "52", "Kölcsönhatások. Az energia"], ["Az elektromos és a mágneses kölcsönhatás Az elektromos kölcsönhatás Kísérletezzünk! Figyeljük meg, hogy a selyempapírral megdörzsölt lufi az asztalra tett apró papírcsíkokat magához vonzza, majd egy idő után eltaszítja. Sok más test is rendelkezik hasonló tulajdonsággal: ha megdörzsöljük, megváltozik a fizikai állapota. A dörzsölés következtében a léggömb – és a dörzsölő papír is – elektromos állapot ba került. Folytassuk a kísérletezést! Vizsgáljuk meg az elektromos állapotú testek közötti kölcsönhatást!", "Az ábra szerint felfüggesztett műanyag rudat (vagy vonalzót) megdörzsöljük. Ezután egy másik, ugyanígy megdörzsölt műanyag rúddal (vagy vonalzóval) közelítünk hozzá. Taszítóhatást tapasztalunk. Ha ezután a rúdhoz egy bőrrel dörzsölt üvegrúddal közelítünk, vonzani fogják egymást.", "A selyempapírral megdörzsölt lufik taszítják egymást Végezd el te is a kísérletet!", "A kísérlet során az üveg és a műanyag különböző elektromos állapotba került. A bőrrel dörzsölt üveg elektromos állapotát pozitív (+), a papírral dörzsölt műanyag elektromos állapotát negatív (–) elektromos állapotnak nevezzük. Kölcsönhatások. Az energia", "53"], ["Ha egy test nem mutat elektromos tulajdonságokat, akkor azt mondjuk, hogy elektromosan semleges. Az azonos elektromos állapotú testek között taszító-, a különböző elektromos álla potú testek között vonzóhatást tapasztalunk. Ez a hatás anélkül lép fel, hogy a két testet egymáshoz érintenénk. Az elektromos állapotú testeket sajátságos környezet veszi körül, amely képes más testekre erőhatást kifejteni. A térnek ezt a részét elektromos mezőnek nevezzük. Az elektromos kölcsönhatás során megfigyelhető vonzó- vagy taszítóhatást az elektromos mező fejti ki. Azokra a testekre is képes erőhatást gyakorolni, amelyek eredetileg semlegesek voltak (lásd az első kísérletünket).", "Az olajba szórt búzadara szemcséi kirajzolják az elektromos mező „képét”", "A mágneses kölcsönhatás Már az 5. évfolyamon megvizsgáltuk a mágnesek tulajdonságait. Megtanultuk, hogy minden mágnesnek két pólusa van. Tudjuk, hogy az azonos mágneses pólusok között taszító-, az ellentétes mágneses pólusok között vonzóhatás működik. Megfigyeltük, hogy az egymás közelében elhelyezett mágnesek kölcsönösen hatnak egymásra. A mágnes vonzza a közelében elhelyezett, vasból vagy acélból készült tárgyakat. Ugyanakkor ezek a tárgyak is vonzóhatást fejtenek ki a mágnesre: ez a hatás is kölcsönös.", "A vasszeg vonzza a mágnest Milyen változás következik be a mágnesrúd állapotában?", "54", "Kölcsönhatások. Az energia"], ["Kísérletezzünk! Tegyünk egy rúdmágnes fölé üveglapot! Szórjunk rá vasreszeléket! A vasreszelék szemcséi sajátos elhelyezkedést mutatnak. Ezeket a kis vasdarabokat a mágnest körülvevő, de szemmel nem látható mágneses mező rendezi el. A mágneseket mágneses mező veszi körül. Az üveglapra szórt vasreszelék szemcséi kirajzolják a mágneses mező „képét”", "A Föld mint égitest is rendelkezik mágneses tulajdonságokkal. A Földet mágneses mező veszi körül. A jól ismert iránytű nem más, mint egy kicsi, könnyen elfordulni tudó mágnes. Kölcsönhatásba lép a Föld mágneses mezejével, így tudja kijelölni számunkra az észak–déli irányt.", "Iránytű", "Ellenőrizd tudásodat!", "1. Hányféle elektromos állapotot ismertünk meg? Hogyan jelöljük ezeket? 2. Miben nyilvánulhat meg a testek közötti elektromos kölcsönhatás? 3. Az óra elején dörzsöléssel változtattuk meg a testek elektromos állapotát. Mit gondoltok? Vajon a dörzsölő testek is elektromos állapotba kerültek? Milyen kísérlettel lehetne ezt eldönteni? 4. Mit jelent az elektromos mező kifejezés? 5. Hogyan viselkednek a mágnesek „egymás között”? 6. Egy mágnessel felemelünk egy vasszeget. Fel tudjuk-e emelni a szeggel a mágnest? 7. Hogyan szerezhetünk tudomást a mágneses mező jelenlétéről?", "Kölcsönhatások. Az energia", "55"], ["Kísérletek, megfigyelések 1. A gravitációs kölcsönhatás Felfedezése egy híres angol tudós, Isaac Newton (ejtsd: ájszek nyúton) nevéhez fűződik. (Newton a 17–18. században élt. Későbbi tanulmányaid során még sokszor lesz róla szó.) Úgy tartják, hogy Newtont egy fáról leeső alma vezette rá a gravitáció felismerésére. Figyeld meg egy leeső test (például egy radír, egy kavics vagy egy kislabda) mozgását! a) Mivel és milyen kölcsönhatásban van a test esés közben? b) Mit mondhatsz el a test mozgásállapotáról?", "2. Kísérletezzünk! A falnak dobott vagy rúgott labda különböző nagyságú nyomokat hagy a falra rögzített papíron. A nyomok azt mutatják, hogy megváltozik a falnak ütköző labda alakja is. Figyeld meg, hogyan függ össze a labda alakváltozása és a mozgásállapot-változás!", "Newton", "3. Hogyan terjed a hő? Kísérletezzünk! Vizsgáljuk meg különböző fémek hővezetését! Csavarjatok össze szorosan két, körülbelül azonos vastagságú, de különböző anyagú fémhuzalt! Az összecsavart véget tartsátok gyertya lángjába az ábra szerint! Figyeljétek meg, melyik kezetek érzi előbb a felmelegedést! Jegyezzétek le a füzetbe, hogy az általatok használt anyagok közül melyik a jobb hővezető!", "56", "Kölcsönhatások. Az energia"], ["4. Tudtad-e? Azokat az anyagokat, amelyek rosszul vezetik a hőt, hőszigetelő anyagoknak nevezzük. A gázok – így a levegő is – jó hőszigetelők. Ruhánk szövete apró szálakból áll. A szálak között sok a levegő. A réteges öltözködéssel tovább vastagítjuk a testünket körülvevő „levegőburkot”. Nézd meg figyelmesen a két rajzot! Miért borzolják fel tollukat télen a madarak?", "5. Még egyszer az elektromos állapotról A testek elektromos állapotát okozó anyagot elektromos töltésnek nevezzük. Kétféle elektromos töltés létezik: pozitív (+) és negatív (–). A semleges testek azonos számban tartalmaznak pozitív és negatív töltéseket. A dörzsölés megszünteti ezt az állapotot. A papírral dörzsölt műanyag rúdon a negatív, a dörzsölő papíron pedig a pozitív töltésekből lesz „több”.", "6. Készítsünk elektroszkópot! A képen látható egyszerű eszköz – egy elektroszkóp – az elektromos állapot kimutatására szolgál. Főbb részei egy üres konzervdoboz és egy vékony selyempapírból készült mutató, melyet cellux ragasztóval szorosan a dobozhoz rögzítettünk. Alátétnek egy felfordított műanyag tányért használtunk. Készíts te is egy hasonló eszközt! Dörzsölj meg papírral egy műanyag vonalzót, majd húzd végig a doboz peremén! Aztán újra dörzsöld meg a vonalzót, és újra húzd végig a doboz peremén! Figyeld meg – és magyarázd meg – a papírszalag „viselkedését”!", "konzervdoboz ragasztó", "műanyag tányér", "papírszalag", "Kölcsönhatások. Az energia", "57"], ["7. Hogyan keletkezik a villám? Kísérletezzünk! Dörzsölj meg száraz papírral egy műanyag vonalzót! A megdörzsölt vonalzót közelítsd óvatosan valamelyik ujjad hegyéhez! Figyeld meg, hogy egy bizonyos távolság elérésekor halk „pattanást” hallhatsz. Elektromos kisülés következik be (hasonlóan a villámláshoz és az azt követő mennydörgéshez). Viharok idején a szél általában nagy sebességgel sodorja a felhőket. A felhőkben található nedvesség parányi cseppekké porlad szét, és a dörzsöléshez hasonló jelenség következtében a felhő elektromos állapotba kerül. A villámláskor elektromos töltések ugranak át a felhőről a földre, vagy egyik felhőről a másikra. Ez a villám.", "8. Kísérletezzünk – ezúttal mágnessel!", "mágnes", "vasdarab", "Kölcsönhatások. Az energia", "Töltött felhők és villámlások", "Elektromos kisüléseket nem csak fizikai kísérlettel kelthetünk. A műszálas ruha levételekor gyakran hallhatsz pattogást, sötétben apró felvillanásokat is láthatsz, és ha nem vigyázol, az orrod hegyét meg is csípheti egy „miniatűr villám”!", "58", "A villámban igen magas a hőmérséklet. A felmelegedő levegő pillanatszerű gyorsasággal kitágul – innen ered a dörgés.", "Végezzétek el az ábrán látható kísérletet, és válaszoljatok szóban az alábbi kérdésekre! a) Mi „tartja” a gemkapcsot a mágnes közelében? b) Próbáljátok meg elmozdítani a gemkapcsot egy a közelébe tartott vasdarabbal! Mit tapasztaltok? Miért?"], ["Az energia I. A mindennapi életben sokszor hallhatod ezt a szót: energia. Igaz, gyakran szóösszetételekben szerepel: beszélünk energiaforrásokról, energiafelhasználásról, energiatakarékosságról. Tudod, hogy van napenergia, szél- és vízenergia. A tevékeny, fáradhatatlan emberre pedig azt mondják: energikus. Mit is jelent valójában az energia? Milyen fizikai tartalom van mögötte?", "A mechanikai energia Kísérletezzünk! 1. Az összenyomott rugó hatására az elengedett kiskocsi mozgásba jön. Vajon „fordítva” is igaz ez? 2. Lökjük neki a kiskocsit a rugónak! Megfigyelhetjük, hogy a rugó összenyomódik!", "1.", "A kiskocsi elindítása", "2.", "Az összenyomódó rugó megállítja a kocsit", "3. a) Egy vékony fonál segítségével kössük össze a kiskocsit egy felemelt testtel! b) Ha a felemelt testet elengedjük, az a Föld felé mozog, miközben a kocsi is mozgásba jön.", "3. a Így indul a kísérlet", "3. b Melyik kölcsönhatás „működteti” a kísérletet?", "Kölcsönhatások. Az energia", "59"], ["Az összenyomott rugó, a mozgó kocsi és a felemelt test egyaránt képes arra, hogy meg változtassa a vele kapcsolatban lévő más testek fizikai állapotát. Más szóval ezt úgy is mondhatnánk, hogy energiával rendelkeznek. Energiának nevezzük a testeknek azt a képességét, amely lehetővé teszi más, velük kölcsönhatásban lévő testek fizikai állapotának megváltoztatását. Az összenyomott rugó rugalmas energiával, a mozgó kocsi mozgási energiával, a felemelt test pedig helyzeti energiával rendelkezik. Ezt a három energiát összefoglaló néven mechanikai energiának nevezzük. A megfigyelt kölcsönhatások során az egyik test energiája csökkent, a másiké növekedett: energiaváltozás történt. Az energiaváltozás mindig kölcsönös. A mechanikai energiák átalakítását évezredek óta ismeri és alkalmazza az emberiség. Az áramló víz mozgási energiáját a vízikerék, az áramló levegő (vagyis a szél) energiáját pedig a szélkerék segítségével hasznosíthatjuk. A vízikerék és a szélkerék különböző gépek, berendezések (például szivattyúk) közvetlen működtetésére is alkalmas.", "Felülcsapott vízikerék", "Alulcsapott vízikerék", "60", "Kölcsönhatások. Az energia", "Szélkerék"], ["A vízerőművekben és a szélerőművek ben a víz és a szél mozgási energiájával generátorokat hajtanak meg. A generátor segítségével a mozgási energia elektromos energiává alakítható. Az elektromos energiát távvezetékeken továbbítják a felhasználókhoz: háztartásokhoz, gyárakhoz, üzemekhez stb. (Az elektromos energia előállításáról, továbbításáról részletesen később fogunk tanulni.) Tudnunk kell, hogy a vízerőművek és a szélerőművek működése közben nem keletkeznek környezetet károsító anyagok – ezek környezetbarát erőművek.", "Szélerőmű", "Ellenőrizd tudásodat!", "1. Mit nevezünk energiának? 2. Sorold fel a mechanikai energia most megismert fajtáit! 3. Nézd meg figyelmesen az 59. oldalon az 1. ábrát! „Hová lesz” a rugó rugalmas energiája? 4. Sorolj fel néhány, a mechanikai energiafajták átalakítására szolgáló eszközt! 5. Miért mondjuk azt, hogy a szél- és vízerőművek környezetbarát erőművek? A tiszalöki vízerőmű", "Kölcsönhatások. Az energia", "61"], ["Az energia II. Az előző órán a mechanikai energiáról beszéltünk. Szó volt arról is, hogy a víz- és szélerőművek a természet mechanikai energiáit hasznosítják. Létezik-e vajon másfajta energia is? Figyeld meg a tanári kísérletet! Ha egy felhevített vasszeget hideg vízbe merítünk, a víz felmelegszik, a vasszeg pedig lehűl. Termikus kölcsönhatás játszódik le, mely a közös hőmérséklet eléréséig tart.", "A vasszeg hevítése borszeszégővel", "A vasszeg lehűtése", "Vajon hogy viselkednek eközben a vas és a víz részecskéi? Az 5. évfolyamon már tanultunk arról, hogy minden anyag szemmel nem látható, parányi részecskékből áll. Tudjuk azt is, hogy ezek a részecskék állandóan mozognak. A melegebb test részecskéinek rendezetlen mozgása intenzívebb – azaz nagyobb a részecskék mozgási energiája.", "A termikus kölcsönhatás során a melegebb test részecskéi a hidegebb test részecskéit élénkebb mozgásra kényszerítik. 62", "Kölcsönhatások. Az energia"], ["A testek belső szerkezetével, a részecskék rendezetlen mozgásával összefüggő ener giát belső energiának nevezzük. A termikus kölcsönhatás tehát belsőenergia-változással jár. A kölcsönhatásban részt vevő testek között energiaátadás történik. Az átadott vagy átvett energiát hőmennyiség nek, vagy röviden csak hőnek nevezzük. Kísérletünkben a borszeszégő lángja hőenergiát adott át a vasszegnek. Vajon honnan származik a láng energiája? Ha sokáig ég a láng, a borszesz elfogy az égőből, a lánggal pedig különböző testeket melegíthetünk fel. A borszesz égése során más anyagokká (szén-dioxiddá és vízzé) alakul át, miközben hő szabadul fel. Hasonló folyamatok játszódnak le a jól ismert tüzelőanyagok (vagy fűtőanyagok), például a szén és a fa elégetésekor is. Az égés során felszabaduló hő az égő anyag környezetében lévő vagy azzal érintkező testek belső energiáját növeli, miközben az égő anyag belső energiája csökken. A hőerőművekben a természetben található fűtőanyagokat égetik el. Ilyen anyag a fa, a szén, a kőolaj és a földgáz. Fűtőanyagként használhatók a mezőgazdasági hulladékok (például a szalma) vagy a külön erre a célra termesztett növények (például az energiafű) is. Az erőmű berendezései az égés közben felszabaduló hőt elektromos energiává alakítják át. (A hőerőművek működéséről később tanulunk részletesen.) Az égés során különböző égéstermékek keletkeznek. Ezek kikerülnek a környezetbe, és ott környezetszennyező anyagként jelennek meg.", "Kölcsönhatások. Az energia", "63"], ["A természetben található anyagok között vannak olyanok is, melynek részecskéi (atomjai) külső beavatkozás nélkül, önmaguktól más anyagokká alakulnak át, miközben különböző sugárzásokat bocsátanak ki. Ezek a radioaktív anyagok. A radioaktív anyagok (például az urán) bomlása során hő fejlődik, melyet az atomerőművekben hasznosítanak. Az atomerőművek tehát lényegében olyan „hőerőművek”, ahol az atomenergiát elektromos energiává alakítják át. Sajnos a folyamat végtermékeként veszélyes sugárzó anyagok maradnak vissza, amelyek biztonságos elhelyezése nehéz és költséges.", "hűtő", "hűtő", "Ellenőrizd tudásodat!", "1. Megismerkedtünk a belső energia fogalmával. Miért mondjuk erre az energiára azt, hogy „belső”? 2. Miért lehet a tüzelőanyagokkal fűteni? 3. Milyen változások történnek az égés során? 4. Miért mondjuk azt, hogy a hőerőmű nem környezetbarát erőmű? 5. Mi jellemzi a radioaktív anyagokat? Miért lehet velük erőművet működtetni?", "64", "Kölcsönhatások. Az energia"], ["A Nap és a napenergia A Nap a hozzánk legközelebbi csil lag. Hatalmas méretei mellett eltörpülnek a bolygók. Ha gondolatban a Naprendszer összes tömegét 1000 részre osztjuk, akkor 998 rész jut a Napra, és mindössze 2 rész marad az összes többi égitestre. A Naprendszer minden égiteste a Nap körül mozog; a Nap fényt és hőt sugároz.", "Ha a Földet gondolatban egy borsószem méretére kicsinyítjük, a Napnak egy kb. 1 m átmérőjű gömb felel meg", "Vajon milyen folyamatok játszódnak le a Napban? Hogyan keletkezik a fény és a hő? A Nap átmérője 109-szer, tömege 333 000-szer nagyobb, mint a Földé. Ez a hatalmas tömeg főleg gázokból – hidrogénből és héliumból – áll. Belsejében számunkra elképzelhetetlenül magas a hőmérséklet: 15-20 millió °C. Itt a hidrogén héliummá alakul át, miközben energia szabadul fel. Ez a folyamat biztosítja a Nap „működését”, és így a Föld „energiaellátását” is. Gyakran mondják azt, hogy a földi életet a Nap táplálja. Vajon miért? 1. A napsugárzás nélkül boly gónk felszínén –270 °C körüli hőmérséklet uralkodna. Életnek, élőlénynek nyoma sem lehetne.", "A Nap fénye olyan „erős”, hogy súlyos szemsérülést, sőt vakságot is okozhat! Csak külön erre a célra készült védőszemüveggel szabad a Napba nézni!", "2. A növények a napfény segít ségével építik fel testüket. (Ez a folyamat a fotoszintézis, amelyről a biológiaórákon tanulunk részletesen.)", "Kölcsönhatások. Az energia", "65"], ["3. Mai tudásunk szerint a Nap 4,5 milliárd (4 500 000 000) éve változatlan erősséggel sugároz. Ugyanígy sugárzott a földtörténeti múltban is, amikor a kontinensek nagy részét hatalmas őserdők borították. Egy idő után az ősi erdők elpusztultak. A fák és más növények a felszín alá kerültek, ahol anyaguk szénné, földgázzá és kőolajjá alakult át. Amikor ma ezekkel a tüzelőanyagokkal fűtünk, igazából a Napból származó energi át használjuk fel. Ugyanez történik akkor is, amikor fával vagy energiafűvel fűtjük a kazánokat. Közlekedési eszközeink nagy része olyan üzemanyagot használ, amelyet a kőolaj feldolgozásával állítanak elő. Ilyen kőolajszármazék a benzin, a dízelolaj és a repülők üzemanyaga, a kerozin is. Közvetve tehát járműveink is a Nap energiájával működnek.", "Több mint 300 millió évvel ezelőtt élt növényekből keletkezett a kőszén, a kőolaj és a földgáz", "66", "Kölcsönhatások. Az energia"], ["4. A felszíni vizeket a Nap sugárzása párologtatja el. A felszálló vízpára a légkör magasabb, hidegebb részein lecsapódik. A felhőkből aztán ismét lehullik a csapadék – ez táplálja a patakok és a folyók vizét. Így nyugodtan mondhatjuk azt, hogy az áramló víz energiája is a Naptól származik. Napsugárzás nélkül elapadnának a források, kiszáradnának a patakok és a folyók.", "5. Tudjuk, hogy a napsugárzás egy része a légkör felmelegítésére fordítódik. A felszálló meleg légtömegek helyére hideg levegő áramlik: így keletkezik a szél. A levegő mozgását is a Nap teszi lehetővé.", "Ellenőrizd tudásodat!", "1. Azt mondtuk, hogy a Naprendszerben minden égitest a Nap körül mozog. Igaz-e ez a megállapítás a Holdra is? 2. Hány °C lenne a Föld hőmérséklete a napsugárzás nélkül? 3. Miért fontos a növények számára a napfény? 4. Mondd el saját szavaiddal: hogyan keletkezett a szén, a kőolaj és a földgáz? 5. Kövesd nyomon az energiaváltozásokat a vízenergia és a szélenergia esetében!", "Kölcsönhatások. Az energia", "67"], ["Energiafelhasználás, energiatakarékosság A napsugárzás közvetlen felhasználása Az előző órán már tanultuk, hogy ha szénnel vagy fával fűtünk, közvetve a Nap energiáját használjuk fel. Ugyanez a helyzet akkor is, ha erőműveinket, járműveinket földgázzal, kőolajjal vagy a kőolaj származékaival működtetjük. A napenergiát azonban közvetlenül is felhasználhatjuk. Ennek két legismertebb eszköze a napkollektor és a napelem. A napkollektor csőrendszere folyadékot tartalmaz, amely a napsugárzás hatására felmelegszik. A napelemek a Nap sugárzó energiáját elektromos energiává alakítják át. napfény napkollektor", "radiátor", "kazán víztartály Napkollektor elhelyezése a háztetőn", "A napkollektor működése", "A napkollektorok és napelemek működése köz ben nem keletkezik semmilyen melléktermék. A napenergia tiszta és környezetbarát energia.", "Napelemmel működő utastájékoztató", "68", "Kölcsönhatások. Az energia", "A napelem működése"], ["Nem megújuló energiaforrások A szén, a kőolaj és a földgáz csak egy meghatározott mennyiségben van jelen a Földön. Ha kibányásszuk, kitermeljük őket, előbb-utóbb elfogynak – és nem újulnak meg. Ezért a szénre, a kőolajra és a földgázra azt mondjuk: nem megújuló energiaforrások.", "Megújuló energiaforrások A kivágott fák helyére újakat ültethetünk. A levágott energiafű is újra nő. Igaz, nem azonnal, de egy bizonyos idő után az új növények is megnőnek. Az erdő, az ültetvény megújul. Ezért a fára és az energiafűre azt mondjuk: megújuló energiaforrások.", "Az energiafüvet Magyarországon is termesztik", "A szárított energiafüvet összepréselve használják fűtésre. Ez a pellet", "Ne feledkezzünk el a Napról, a szélről és a vízről sem! A Nap este lenyugszik, de reggel újra felkel. A szél ugyan eláll, de nemsokára újra fújni kezd; a patakok, folyók vize is mindennap rendelkezésünkre áll. Újra és újra felhasználhatjuk a napsugárzást, az áramló levegő és az áramló víz energiáját. Ezért azt mondjuk, hogy a napenergia, a szél- és vízenergia is megújuló energiaforrások.", "Takarékoskodjunk! A világ energiaellátásában a nem megújuló energiaforrásoké a főszerep. A felhasznált energia kb. 80%-a szén, kőolaj és földgáz elégetéséből származik – pedig jól tudjuk, hogy ezek előbb-utóbb elfogynak. A legnagyobb energiafelhasználó az ipar, de jelentős a háztartások „fogyasztása” is. Egy átlagos magyar háztartás energiafelhasználását az ábra mutatja. Láthatjuk, hogy a legtöbb energiát fűtésre és vízmelegítésre használjuk. Kevesebb, de nem jelentéktelen a sütés-főzés, a világítás és az elektromos eszközök energiaigénye sem. Jelentős megtakarítást érhetünk el, ha ezeket csak a szükséges mértékben használjuk!", "sütés-főzés 9%", "fűtés 66%", "Kölcsönhatások. Az energia", "69"], ["Ez bizony pazarlás! Mit kellene tenni, és miért?", "Ellenőrizd tudásodat!", "1. Milyen eszközökkel használhatjuk fel közvetlenül a napenergiát? 2. Sorolj fel megújuló és nem megújuló energiaforrásokat! 3. Mi szerint különböztetjük meg őket? 4. Hogyan tudunk takarékoskodni a fűtéssel és a világítással? Miért fontos ez?", "70", "Kölcsönhatások. Az energia"], ["Kísérletek, megfigyelések 1. Figyeld meg! Nézd meg figyelmesen a képeket! Milyen energiaváltozással jár az „építőanyag” felemelése?", "2. A mechanikai energia Az itt látható kép azt mutatja, mennyire benyomódik a focilabda, miközben a játékos fejének ütközik. Hogyan változik fejelés közben a labda mechanikai energiája?", "Kölcsönhatások. Az energia", "71"], ["3. Kísérletezzünk! A napkollektorokban elhelyezett csöveket matt feketére festik. Hogy miért, arra a következő kísérlet segítségével adhattok választ. Tanárotok segítségével csavarjatok egy tanulókísérleti hőmérő folyadéktartályára vékony, matt fekete papírt! Egy másik hőmérő higanytartályát burkoljátok be fényes alumíniumfóliával! Ügyeljetek rá, hogy a papír és a fólia is szorosan illeszkedjen a hőmérőhöz! Tegyétek ki a két hőmérőt a napra (vagy ha nem süt a nap, akkor egy közönséges izzólámpa mellé)! Olvassátok le a hőmérőket! Mire következtettek a kísérlet alapján?", "4. A napkollektor A napsugárzás és a hőmérséklet kapcsolatáról már 5. évfolyamon is tanultunk. (Ha elfelejtetted, nézd meg az 5.-es Természettudomány tankönyv 106–108. oldalán!) a) Képzeld el, hogy egy lapos tetejű ház tetejére kell napkollektorokat (vagy napelemeket) elhelyezni. Me lően a Földet 24 időzónára osztották. A kezdő időzóna a 0° kezdő hosszúsági körtől keletre és nyugatra 7,5°-7,5° szélességű. Egy időzónán belül a középső délkör helyi idejét tekintik mérvadónak. Amikor az időzóna középső délkörén delel a Nap, a zóna teljes terjedelmében akkor van dél. Hazánk a közép-európai időzónában (KözEI = CET) található. Annak érdekében, hogy egy-egy országon belül egységes legyen az idő, figyelembe veszik az országhatárokat. A nagy területű országokon belül – például Amerikai Egyesült Államok, Oroszország – több időzóna is keresztülhúzódik. Ha kelet felé haladva átlépünk egy időzónát, egy órával előre kell állítani az óránkat. Nyugat felé éppen fordított a helyzet: ha átlépünk egy időzónát, akkor egy órával vissza kell állítani az óránkat. Tanulmányozd az időzónatérképet!", "Ellenőrizd tudásodat!", "A kezdő időzóna", "1. Mit jelent az, hogy a Nap látszólagos mozgást végez? Mi ennek az oka? 2. Minek köszönhető a napszakok változása? 3. Mi körül forog a Föld? Milyen irányban? 4. Mi az időmérés alapja? Mi az egysége?", "84", "A Föld bolygó"], ["Időzónák a Földön", "A Föld bolygó", "85"], ["A Föld keringése a Nap körül A Föld, miközben forog képzeletbeli tengelye körül, nyugat–keleti irányban kering a Nap körül. Másodpercenként 30 kilométer utat tesz meg a pályáján, amelyet 1 év, vagyis 365 és 1/4 nap alatt (365 nap, 5 óra, 48 perc, 46 másodperc) jár körbe. Az évi időszámítás alapja is az az időszak, ami alatt a Föld egyszer körbejárja a Nap körüli pályáját. Az alapegysége az év. A Föld keringésének időtartama kerekítve 365 és 1/4 nap. A naptári év viszont csak egész napokból állhat, ezért 365 napos. A fennmaradó negyed napokból származó különbség kiegyenlítéseként minden negyedik évben plusz egy napot hozzáadunk az év 365 napjához. Ennek köszönhetően minden negyedik év 366 napos, úgynevezett szökőév. Ilyenkor az egyébként 28 napos februárhoz adjuk hozzá az említett plusznapot, így négyévente a február 29 napos lesz. Mindig azok az évek a szökőéve égével! Grönland partjainak jégvilága Keresd meg a térképen Grönlandot!", "A Föld bolygó", "91"], ["A Föld éghajlatát alakító tényezők Ismételd át, amit az elmúlt tanévben az időjárásról és az éghajlatról tanultunk!", "NAPSUGARAK", "23,5°", "0°", "66,5° Egyenlítő", "90° 66,5°", "23,5°", "0° A napsugarak eltérő szögben érik a Föld különböző részeit", "A legmeghatározóbb éghajlat-alakító té nyező a földrajzi szélesség, vagyis az, hogy egy terület milyen távol van az Egyenlítőtől. Ettől függ, hogy milyen éghajlati övezetben található. Hogyan alakul az évi középhőmérséklet az Egyenlítő és a sarkok között? Használd az atlasz A Föld évi középhőmérséklete című térképét!", "Az egyes övezeteken belül nagymértékben befolyásolja a hőmérsékleti viszonyokat, hogy az Egyenlítőhöz közelebbi vagy távolabbi részen vagyunk-e. Földünk felszínét hatalmas óceánok, tengerek és szárazföldek teszik változatossá. A szárazföldeken síkvidékek, dombvidékek és különböző magasságú hegyvidékek váltakoznak. E változatos felszín éghajlatát – a földrajzi szélesség mellett – több tényező is alakítja. Ezért az egyes övezeteken belül többféle éghajlattal találkozunk. Fontos éghajlat-alakító tényező az óceánoktól való távolság. Figyeld meg Európa csapadéktérképén, hogyan változik a csapadék mennyisége az Atlanti-óceán partvidékétől a szárazföld belseje felé haladva! Az óceánok hatalmas vízfelülete állandóan párolog, így az onnan fújó szelek folyamatosan párás légtömegeket hoznak a part menti területekre, melyekből a szárazföld fölé érve bőséges csapadék hullik. A legtöbb csapadék az óceánok és tengerek közvetlen közelé ben lévő területeken esik. A partvidékektől távolodva fokozatosan csökken a mennyisége. A földrészek belső területei sokkal szárazabbak. Olvasd le a hőmérsékleti térképekről, hogyan változik a júliusi és a januári középhőmérséklet, ha a szárazföld belseje felé haladunk!", "92", "A Föld bolygó"], ["A mérsékelt övezetben a száraz földek hőmérsékletére is hatással van az óceán közelsége. Az yzet", "Fudzsi"], ["4. Geocaching (ejtsd: „geokesing”) játékra invitálunk! Mielőtt nekiindulsz az első igazi kincsvadászatnak, nézz utána az interneten, mit is rejt magában ez az izgalmas, természetbarát hobbi! Mire a geoládához érsz, alaposan kifáradsz, de megéri, mert a kincs közelében van egy kilátó, ahonnan csodálatos panoráma tárul eléd. Ne hagyd otthon a GPS-készüléket, mert a segítségedre lesz! A geoláda helyének földrajzi koordinátái: é. sz. 47,4°, k. h. 16,5°", "5. Milyen sorrendben kel fel a Nap a felsorolt városokban? A városokat az atlaszod keresőhálózata segítségével keresd meg! Moszkva – Los Angeles – Párizs – Budapest – Fokváros – Sydney – New York", "6. Készülhettek-e a fotók ugyanarról a folyóról? Indokold meg a válaszodat szóban!", "A Föld bolygó", "101"], ["7. Készítsetek összehasonlító bemutatást az Északi- és a Déli-sarkvidék élővilágáról! Hívjátok segítségül az internetet!", "8. A „Magyarok a világ nyolcezresein” csapatának expedícióvezetője a mintegy 4800 méteren lévő alaptáborában a következőkkel kezdi a bejegyzését: „Vasárnap 13 óra körül megérkeztünk az alaptáborba, közel 1300 méter szintet jöttünk felfelé.”", "a) Hány méter magasról indultak neki az alaptábornak? b) Hány fok várta itt a hegymászókat, ha az induláskor –3 °C-ot mutatott az expedíció vezetőjének az órája? Alaptábor a Himalájában", "102", "A Föld bolygó"], ["Rendszerezzük ismereteinket! Együtt a Nap rendszerben", "A Föld a Naprendszerben található. A Naprendszer a világegyetem része. A Naprendszer részei: a Nap, a bolygók és a holdjaik, a kisbolygók, az üstökösök, a meteorok, a bolygók közötti gáz- és porfelhők. A Naprendszer középpontjában a Nap található. A Nap egy csillag, fényt és meleget sugároz a Földre. A csillagok magas hőmérsékletű égitestek, saját fénnyel rendelkeznek. A bolygók nagy méretű égitestek, nincs saját fényük. A Nap fényét verik vissza. A Naprendszer bolygói a Naptól távolodó sorrendben: a Merkúr, a Vénusz, a Föld, a Mars, a Jupiter, a Szaturnusz, az Uránusz és a Neptunusz. Földünk gömb alakú égitest. Az óceánok a legnagyobb kiterjedésű állóvizek. Bolygónk óceánjai: a Csendes-óceán, az Atlanti-óceán és az Indiai-óceán. A földrészek (kontinensek) nagy kiterjedésű szárazföldek. A hat földrész: Ázsia, Amerika, Afrika, Antarktisz, Európa, Ausztrália.", "Tájékozódás a gömb alakú Földön", "Földrajzi fokhálózat: szélességi és hosszúsági körök alkotják. A földrajzi szélesség megmutatja, hogy egy hely milyen irányban és hány fok távolságra található az Egyenlítőtől. Az Egyenlítő a Földet két egyforma részre, az északi és a déli félgömbre osztja. Az északi félgömbön az északi, a déli félgömbön a déli szélességek találhatók 0–90°-ig. Nevezetes szélességi körök: az Egyenlítő, a Ráktérítő, a Baktérítő, az északi és a déli sarkkör, az Északi- és a Déli-sark. A földrajzi hosszúság a kezdő hosszúsági körhöz viszonyított távolság fokokban kifejezve. A greenwichi kezdő hosszúsági kör két egyenlő részre, a nyugati és a keleti félgömbre osztja a Földet. A nyugati félgömbön találhatók a nyugati hosszúságok (ny. h.), míg a keletin a keleti hosszúságok (k. h.) 0–180°-ig.", "A Föld forgása", "A Föld nyugat–keleti irányban 24 óra alatt fordul körbe a tengelye körül. Következménye a nappalok és éjszakák váltakozása. Az időmérés egysége egy nap. Egy nap a Nap két egymást követő delelése között eltelt idő.", "A Föld keringése a Nap körül", "A Föld nyugat–keleti irányban ellipszis alakú pályán kering a Nap körül, ideje: 365 és 1/4 nap. Az évi időszámítás alapegysége egy év. Az év az az időszak, amely alatt a Föld egyszer körbejárja a Nap körüli pályáját. A Nap körüli keringés és a forgástengely ferdeségének következménye: a nappalok és éjszakák hosszának változása és az évszakok váltakozása.", "A Föld bolygó", "103"], ["Az éghajlati öve zetek", "A gömb alakú Föld egyes részein más-más a felmelegedés mértéke. Ennek megfelelően alakult ki a forró (trópusi), a mérsékelt és a hideg éghajlati övezet. Az éghajlati övezetek a Földet csaknem megszakítás nélkül fogják körbe. Határaik hozzávetőlegesen megegyeznek a nevezetes szélességi körökkel.", "A Föld éghajlatát alakító tényezők", "Az éghajlati övezetek kialakulásában döntő szerepe van a földrajzi szélességnek. Az éghajlati övezeteken belül az óceánoktól való távolság és a domborzat módosítja az egyes éghajlatokat. A legtöbb csapadék az óceánok közvetlen közelében lévő területekre hullik, ettől távolodva csökken a csapadék mennyisége. Az óceánok hatással vannak a szárazföldek hőmérsékletére is. Nyáron hűtő, míg télen fűtő hatást gyakorolnak. Minél magasabban helyezkedik el egy terület, annál hűvösebb és csapadékosabb. A széllel szemközti hegyoldal mindig csapadékosabb, míg a szélárnyékos szárazabb.", "Európa és Magyarország földrajzi helyzete", "A tényleges földrajzi helyzet azt mutatja, hogy egy adott hely hol helyezkedik el a Földön, és mi jellemzi a tengerszint feletti magasságát. A viszonylagos földrajzi helyzet a más területekhez való viszonyt jelenti. Európa az északi félgömb kontinense, területének kis része a nyugati, a legnagyobb része a keleti félgömbön található. Felszíne változatos, minden felszínforma megtalálható rajta. Északról a Jeges-tenger, keletről Ázsia, délről a Földközi-tenger, nyugatról az Atlanti-óceán határolja. Magyarország az északi és a keleti félgömb országa. Európa belsejében fekvő, tengerparttal nem rendelkező, szárazföldi ország. A Kárpát-medence központi részét foglalja el. A környező területekhez képest alacsonyabban fekvő ország. A Duna, az Ipoly, a Mura és a Dráva a természetes határunk. Határoló országok: Szlovákia, Ukrajna, Románia, Szerbia, Horvátország, Szlovénia, Ausztria. A Királyi Obszervatórium távcsöve Greenwichben", "104", "A Föld bolygó"], ["A TERMÉSZET ERŐI", "A Föld bolygó"], ["A vulkánok és a földrengések A földfelszín állandó változásban van. A Föld külső képét formáló folyamatok többsége olyan lassan működik, hogy észre sem vesszük. Csupán műszeres vizsgálatok mérései adnak róluk adatokat. Ezek a számunkra észrevehetetlen változások viszont az évmilliók során komoly átalakulást jelentenek egy táj domborzatán. Kevés nagyon gyors, szemmel látható változást okozó folyamat van. Ilyenek például a vulkánkitörések és a földrengések. Ezek olyan hevesen zajlanak le, hogy megdöbbenünk annak láttán, milyen hatalmas belső erők formálják, alakítják a körülöttünk lévő világot! A belső erők a Föld belsejéből ható erők. A Föld belsejében, nagy mélységben olyan magas a hőmérséklet, hogy a kőzetanyag olvadt állapotban van. Elképzelheted, milyen magas lehet itt a hőmérséklet, ha a kőzetek megolvadásához 800–1300 °C szükséges. Az izzó kőzetolvadék, a magma a szilárd kőzetrétegeken keletkező töréseken keresztül tör utat magának. Szicília közelében, a Földközi-tengerben található egy kis sziget, Vulcano (ejtsd: vulkánó). Gőz- és füstoszlopok szállnak fel belőle, izzó kőzetolvadékot szór ki magából. A vulkánok erről a szigetről kapták a nevüket. Az ókori rómaiak hiedelme szerint ez a kis sziget adott otthont Vulcanusnak (ejtsd: vulkánusz), a tűz sánta istenének. A monda szerint ennek gyomrában képzelték el a műhelyét.", "Vulcano szigete", "Keresd meg az Európa domborzata című térképen a Földközi-tengert és Szicíliát! A világatlasz keresőhálózata segítségével Vulcano szigetét is megkeresheted!", "A vulkánkitörés végtelenül félelmetes természeti jelenség. Kitörése többnyire nagyon mélyről hallatszó morgással, heves robbanásokkal, esetleg földrengéssel kezdődik. Ezeket forró gőz- és gázkilövellések követik, amelyek hatalmas erővel robbantják ki a szilárd kőzetdarabokat, de finomabb vulkáni törmeléket és port is szétszórnak. Ezt követően talál magának utat az izzó kőzetolvadék. A kiömlő olvadt kőzet 100300 kilométer mélységből, a magmakamrá ból tör a felszínre. Mivel a kőzetolvadék nagyon magas hőmérsékletű, útja során további kőzeteket olvaszt meg, így tör magának utat a felszínig. 106", "A természet erői", "Van olyan vulkánkitörés, ami után napokig nem látható a Nap a levegőbe került vulkáni hamu miatt"], ["A felszínre került izzó kőzetolvadék a láva, amely a tűzhányó kráterén keresztül ömlik a felszínre. Mint egy tüzes folyam, hömpölyögve halad a lejtők irányába. Mindent felperzsel, ami csak az útjába kerül. Nézz utána! Hogyan lehet a láva ellen védekezni? Izzó lávafolyam az Etna oldalán Keresd meg az Etnát Dél-Európa térképén! Használd a keresőhálózatot!", "Az ábra alapján kövesd végig az olvadt kőzetanyag útját a magmakamrától a kráterig! A vulkánkitörés többszöri megismétlő dése során az egymást váltó lávaömlések és törmelékszórások anyagából alakulnak ki a rétegvulkánok. Figyeld meg az ábrán a vulkán részeit! Figyeld meg, mit jelent a réteges felépítés!", "kráter vulkáni kőzet kürtő vulkáni törmelék", "olvadt kőzetanyag magmakamra A rétegvulkán felépítése", "A kihűlő láva kőzetté szilárdul. Nagyon kemény, tömör szerkezetű vulkáni kőzetek ala kulnak ki belőle. Ilyen például az andezit és a bazalt. A vulkáni kőzeteket építkezéseken, útburkolásra és vasúti töltések építésénél hasznosítják.", "A Vezúv krátere Miért szokták a krátert a vulkán torkaként is emlegetni?", "A Japánban található Fudzsi jellegzetes rétegvulkán", "A természet erői", "107"], ["A vulkáni törmelékből is kőzet alakul, de ez sokkal puhább, úgynevezett vulkáni tufa, például: andezittufa, bazalttufa. A tufák jól faraghatók, ezért pincéket vájnak bele. A tűzhányók néha évekig, sőt előfordul, hogy évszázadokig szunnyadnak, majd ismét működésbe lépnek. Vannak olyanok, amelyek többé már nem törnek ki, ezeket „kialudt” vulkánoknak nevezzük.", "Börzsöny", "Évmilliókkal ezelőtt hazánk mai területén is több tűzhányó működött. Ezek már mind „kialudt” vulkánok. Múltbeli kitöréseikről csak a formájuk és az őket felépítő közetek árulkodnak. A legtöbb az Északi-középhegység területén található. Vulkáni eredetű a Visegrádi-hegység, a Bör zsöny, a Cserhát, a Mátra és a Zempléni-hegység. Legnagyobb részüket andezit építi fel. Több olyan vulkáni hegyünk is van, amely bazaltból épül fel, ilyen például a Badacsony. Keresd meg a felsorolt vulkáni vonulatokat és a Badacsonyt a Magyarország domborzata című térképen!", "Badacsony", "A földrengés iszonyatos pusztításokkal járó jelenség. Percek alatt hatalmas épületek dőlhetnek romba, emberek ezrei eshetnek áldozatául vagy válhatnak földönfutóvá. A földfelszín alatt nagy mélységben uralkodó óriási belső erők hatására a merev kőzetrétegek elpattannak, és hatalmas energiával lökik meg a szomszédos rétegeket. Ez a váratlan lökés terjed minden irányban. Nagy föld alatti üregek beszakadása, vulkánok kitörése is előidézhet földrengést.", "A 2011-es Japán földrengés hatalmas károkat okozott", "Nézz utána az interneten, melyek voltak a legnagyobb földrengések Magyarországon!", "Ellenőrizd tudásodat!", "1. Miért nem szembetűnő a földfelszín állandó változása? 2. Mi a magma és a láva közötti különbség? 3. Mely kőzetek alakulnak ki a vulkánkitörés során? 4. Mi jellemzi hazánk egykori vulkánjait? 5. Hogyan pattanhat ki a földrengés? 6. Miért nagyon veszélyesek a földrengések?", "108", "A természet erői"], ["Hogyan keletkeztek a hegységek? Földünk hegységei különbözőképpen keletkeznek. Már volt szó a vulkáni működés során kialakult hegységekről. Vizsgáljuk meg, hogyan alakulhatnak még ki ezek a felszínformák!", "A képlékennyé vált, jól formálható kőzetrétegek", "A gyűrődés folyamata", "A Föld mélyén, ahol nagyon magas a hőmérséklet, és hatalmas nyomás uralkodik, kép lékennyé válnak a kőzetek. Ha a kőzetrétegeket oldalirányból tartósan magas nyomás éri, ezek a jól formálható rétegek meggyűrődnek. Figyeld meg az ábrán a gyűrődés folyamatát!", "A felszínre emelkedett, felgyűrődött kőzetrétegek", "Az összegyűrődött rétegek több millió év alatt kiemelkednek, létrehozva ezzel a lánc hegységeket. Ezeket a hegységeket a kialakulásuk módja miatt gyűrthegységeknek is nevezik. Ilyen hegység például az Alpok.", "Keresd meg az Alpokat az Európa domborzata térképen! A lánchegységekben a gyűrődés következtében kialakuló formakincs a jellemző. Itt párhuzamos hegyvonulatokkal és hos� szanti völgyekkel találkozunk, amelyek láncszerűen kapcsolódnak egymáshoz. A lánchegységeket párhuzamos vonulatok jellemzik, hosszanti völgyekkel", "A természet erői", "109"], ["Amikor az egymásra rakódott kőzetrétegek a belső erők hatására megpattannak, törésvonalak alakulnak ki. A törésvonalak mentén a kőzetrétegek egyes részei ki emelkednek, míg mások lesüllyednek. Ez a folyamat a vetődés. Figyeld meg az ábrákon, hogyan megy végbe a vetődés folyamata!", "Kőzetrétegek törése a Kőszegi-hegységben lépcsős felszín", "kiemelt rög", "árok", "A vetődés folyamata", "Vetődéssel kialakult tájunk: a Mecsek", "Figyeld meg az ábrán, milyen formák jöhetnek létre vetődéssel!", "Figyeld meg az ábrán, hogyan megy végbe ez a folyamat!", "Vetődés során alakulnak ki a röghegy ségek, melyeknél a vetődés következtében tágas medencék, lesüllyedt árkok, lépcsős vidékek váltakoznak, felszínüket széles völ gyek tagolják. Vetődés megy végbe akkor is, amikor a belső erők hatására a lánchegységek felgyűrődött rétegei megpattannak. Vetődés közben a gyűrthegységek rögökre darabolódnak. 110", "A természet erői", "A gyűrthegység rögökre darabolódik"], ["Hazánk területén több röghegység is található, például a Bükk, a Mecsek vagy a Bakony. Keresd meg az említett hegységeket a Magyarország domborzata térképen! A gyűrődés és a vetődés folyamata létrehozza a hegységeket. Külső képüket, formakincsüket viszont nagymértékben befo lyásolja, hogy mennyire magasak, milyen kőzetek építik fel és milyen külső hatások érik őket. A külső erők – a hőmérséklet ingadozása, a szél, a víz és a jég – folyamatosan, minden pillanatban pusztítják és építik környezetünket.", "A hegységképző természeti erők munkájából sokat megtudhatunk a kőbányákban", "Ellenőrizd tudásodat!", "1. Hogyan alakultak ki az általad ismert hegységek? 2. Ismertesd a gyűrődés folyamatát! 3. Milyen típusú hegységek alakulnak ki gyűrődéssel? Jellemezd a létrejöttük közben kialakuló formákat! 4. Mit nevezünk vetődésnek? 5. Sorold fel azokat a formákat, amelyek csak a röghegységekre jellemzők! 6. Milyen külső folyamatok alakítják a hegységek felszínét?", "A Júliai-Alpok", "A természet erői", "111"], ["A külső erők felszínformáló munkája A felszín formálásában jelentős szerep jut a külső erőknek: a hőingásnak, a szélnek, a víznek, a jégnek, valamint az élővilágnak. A nagy napi hőingás komoly próbára teszi a kőzeteket. Még a legkeményebbek sem képesek huzamosabb időn keresztül ellenállni ennek az állandó hőmérsékletváltozásnak. Szép lassan felaprózódnak, homok- vagy porszem nagyságúra is széteshetnek.", "Ha nappal felforrósodnak a kőzetek, éjjel pedig lehűlnek, előbb-utóbb felaprózódnak", "Az is aprózódáshoz vezet, ha a kőzetek repedéseibe beszivárgó víz megfagy. Már tudod, hogy a megfagyott víz térfogata nő, ezáltal feszíti, tágítja a kőzetekben lévő repedéseket. Ennek eredményeként idővel a kőzetek darabokra esnek szét. Ez a folyamat a fagyaprózódás. Előfordulhat-e hazánkban az aprózódásnak ez a formája?", "A fagyaprózódás folyamata", "Az aprózódás nagyon fontos folyamat, mert a szél, a víz és a jég csak a felaprózódott kőzeteket képes el szállítani. A szél munkája a száraz vidékeken érvényesül a legjobban. Felkapja a kemény és éles homokszemeket, amelyek csiszolják a kőzeteket, ezáltal pusztítják a felszínt. Amint csökken a szél ereje, a magával sodort törme léket lerakja, buckákat épít belőle. A szél által szállí tott, görgetett homokot futóhomoknak nevezzük.", "szél", "A fagy hatására felaprózódott kőzettörmelék lefolyik a lejtőn", "112", "A természet erői", "A homok mozgása a szél hatására"], ["A hegyvidékeken a meredek lejtők vízfolyásai nagyon gyorsak és nagy esésűek. Lehordják a magasabban fekvő területek anyagát. A víz által szállított kisebb-nagyobb kődarabok állandóan koptatják a folyók medrét. Hosszú idő alatt hatalmas V alakú völgyeket vájnak ki. Az ilyen folyók munkavégző képessége nagy.", "A meredek lejtők siettetik a víz mozgását, amely sziklákat görgetve maga előtt mélyen beváj a medrébe", "A hegyekből kiérve a folyó lerakja a hordalékát Figyeld meg a képen, hol található a lerakott hordalék!", "Amint a folyó elhagyja a lejtős vidékeket, csökken az esése, lelassul, medre kiszélesedik, tovább már nem képes magával vinni a hordalékát. Először a nagyobb, nehezebb kőzettörmeléket, majd az egyre kisebb méretű hordalékát rakja le. A sík területeken a folyók nagyon lelassulnak. Itt már a legapróbb szemű hordalékuktól is megszabadulnak. A medrüket szépen feltöltögetik, először zátonyt, majd szigetet építenek. Figyeld meg az ábrán, mi a különbség a zátony és a sziget között!", "folyásirány zátony", "hordalék", "folyásirány sziget", "A zátony és a sziget kialakulása", "Amint a folyó a tengerhez közeledik, folyása teljesen lelassul. Itt már lerakja a legfinomabb szemcséjű hordalékát is. Ezt kerülgetve több ágra szakadva éri el a tengert, kialakítva ezzel a deltatorkola tot. Ilyen torkolata van például a Dunának. Figyeld meg az ábrán a deltatorkolat alakját! Keress még ehhez hasonló torkolatokat az atlaszodban! A deltatorkolat az alakjáról kapta a nevét, a görög ábécé delta betűjének háromszögére hasonlít", "A természet erői", "113"], ["A hegységek magasabb részein, ahol állandó fagy uralkodik, a legfontosabb felszínformáló erő a jég. A lehullott hó hosszú évek során ös�szetömörödik, és az állandó hidegben jéggé fagy. A felgyűlt jégtömeg nagyon lassan lefelé halad a hegyoldalon. Ez a lassan mozgó jégtömeg a gleccser. Az útja során a beléje fagyott, felaprózódott kőzettörmelékkel csiszolja, koptatja a felszínt. A jég kicsipkézi a hegygerinceket, és U alakú völgyekkel teszi változatosabbá a tájat. A hegyek anyagát a gleccser az alacsonyabb területekre szállítja, ahol a jég elolvadása után felhalmozódik.", "Az Alpok leghosszabb gleccsere az Aletsch-gleccser", "Az elmúlt órákon már számtalan példát láttál arra, hogy a belső erők által kiemelt területek felszínét, a hegységek kőzetanyagát a külső erők folyamatosan pusztítják. Ezzel rom boló munkát végeznek. A lepusztított kőzetanyagot elszállítják és felhalmozzák az alacsonyabb területeken, például a hegylábaknál és az alföldeken vagy a tavak, tengerek medencéjében. A hordalék lerakásával építő munkát végeznek. lepusztulás szállítás felhalmozódás", "Figyeld meg az ábrán, mit jelent a külső erők romboló, anyagszállító és felhalmozó munkája!", "A külső erők romboló, szállító és felhalmozó munkát végeznek", "A változó földfelszín a belső és külső erők egyidejű, de ellentétesen ható folyamatos munkájának az eredménye.", "Ellenőrizd tudásodat!", "1. Miért fontos az aprózódás a többi külső erő munkájához? 2. Milyen területeken végeznek a folyók romboló és hol építő munkát? 3. Hol és miért alakul ki a deltatorkolat? 4. Ellentétben a folyókkal, a gleccserek U alakú völgyet vájnak. Miért? 5. Mit jelent az, hogy a földfelszín a külső és a belső erők egyidejű, de ellentétesen ható tevékenységének az eredménye?", "114", "A természet erői"], ["A kőzetek és a felszín formakincse Földünk felszínét különféle kőzetek alkotják. Kialakulásuk szerint magmás, üledékes és átalakult kőzeteket különböztetünk meg. A magmás kőzetek az olvadt kőzetanyag kihűlésével keletkeztek. Igen kemény kőzetek tartoznak ebbe a csoportba. A vulkáni hegyek kialakulásánál már tanultál az andezitről és a bazaltról. Ezek a felszínre került kőzetolvadék megszilárdulásával keletkeztek. Kivételt képeznek a vul káni tufák, amelyek a törmelékekből alakultak ki a vulkáni működés során. Vannak olyan kőzetek, amelyek a nagy mélységben kihűlő magma megszilárdulásával keletkeztek, mint pl. a gránit. Az üledékes kőzetek más, lepusztuló kőzetek törmelékeiből, valamint élőlé nyek maradványaiból épülnek fel. A törmelék méret szerint lehet kavics, homok vagy agyag. Szállíthatja a szél, a vízfolyások, de a gleccserek is. Az üledékes kőzetek kialakulhatnak a szárazföldek belsejében is, mint például a lösz, melynek anyagát a szél halmozta fel. A szénféleségek is üledékes eredetűek, növényi maradványokból képződtek. A leggyakoribb üledékes kőzet a mész kő. Hatalmas hegységek alkotója. Legtöbbször a tengerek és a tavak medencéjében alakult ki, ahol az üledékek az elpusztult élőlények mészvázaival cementálódnak össze. Az átalakult kőzetek magmás vagy üledékes kőzetekből jönnek létre. Ezek a kőzetek a vetődés során a mélybe kerülnek, ahol a nagy nyomás és magas hőmérséklet hatására átalakulnak. Így alakult át például a mészkő márvánnyá.", "Gránit Keress érdekességeket az interneten erről a nagyon szép kőzetről!", "Tőzeg. A szénné válás első állomása. Még jól kivehetők a növényi alkotórészek", "Milliónyi mészváz egy mészkődarabban Miről árulkodnak ezek a maradványok?", "A természet erői", "115"], ["Látványos sziklagombák Gondolkozz! Mi játszott szerepet a kialakulásuknál?", "Azt, hogy a felszín mennyire képes ellenállni a külső erőknek, nagymértékben befolyásolják a felépítő kőzetek tulajdonságai. Már te is tapasztaltad, hogy vannak keményebb és puhább kőzetek. A keményebb kőzetek sokkal tovább ellenállnak a természet erőinek. A külső erők ezeket is lekoptatják, de belőlük egészen más formákat hoznak létre, és ehhez sokkal hos�szabb időre van szükség. A felépítő kőzet te hát jelentősen befolyásolja a táj képét.", "Az üledékes kőzetek a legpuhábbak, mivel kialakulásuknál a magas hőmérséklet nem játszott szerepet. Azért, hogy ezt egyszerűbben megértsd, hasonlítsunk össze két cserépedényt! Az egyiket korongozás után csak megszárították, míg a másikat alaposan ki is égették. Vajon melyik edény lesz az ellenállóbb?", "Az ilyen puhább kőzetekből csodálatos formákat varázsolnak az időjárás jelenségei, a folyóvizek, a jég, de maga az élővilág is. Jó példa erre a mészkő.", "Cseppents ecetet egy mészkődarabra! Figyeld meg a kőzet felületét a kísérlet előtt és után! Mit tapasztalsz? Vigyázz, hogy ne kerüljön a szemedbe ecet, mert maró anyag! Ha mégis belekerülne, azonnal mosd ki bő vízzel!", "dolina kopár mészkőfennsík", "víznyelő", "barlang", "karsztforrás barlangi patak Felszíni és felszín alatti karsztjelenségek", "116", "A természet erői", "cseppkövek", "A kőzetrétegek repedésein keresztülszivárgó csapadékvíz különleges formákat hoz létre mind a felszínen, mind a hegy belsejében. Miközben a beszivárgó csapadékvíz keresztüljut a növényzettel borított talajon, savassá válik. Ez a víz pedig ugyanúgy feloldja a mészkövet, amint azt a kőzetvizsgálat során tapasztaltad. A természetben viszont sokkal lassabban zajlik le a folyamat, mivel ez a víz kevésbé savas, mint az ecet."], ["A mélybe szivárgó víz a réseket tölcsér alakú víznye lőkké és tál alakú dolinákká formálja. A víz nemcsak feloldja, hanem a magával sodort kőzettörmelékkel koptatja is a mészkövet. Hosszú idő alatt hatalmas bar langokat alakít ki a hegy gyomrában. A vastag mészkőrétegen áthaladó savas csapadékvízből a barlang men�nyezetén és alján lerakódik a mész, cseppkő jön létre. A mészkőhegységekben a csapadékvíz oldó hatásá ra lezajló folyamatokat karsztosodásnak, az így kiala kult formákat karsztformáknak nevezzük. Cseppkőképződmény az Aggteleki-cseppkőbarlangban", "A leggyakoribb építőanyag a mészkő és a márvány. Sok műemlék – templom, palota – készült belőlük. A történelem során és ma is hegyeket bontanak szét értük. Az út- és vasútépítésnél a nagy keménységű, ellenálló andezitet és bazaltot használják. Napjainkban ismét egyre több természetes anyaggal díszítjük környezetünket. Michelangelo márványból faragta ki a Pietà című csodálatos szobrát Nézz utána, hol található!", "Ha többet szeretnél tudni a kőzetek világáról, lapozgasd a Mi micsoda? és a Szemtanú sorozat Kőzetek című köteteit!", "Ellenőrizd tudásodat!", "1. Csoportosítsd a kőzeteket kialakulásuk szerint! 2. Miért ellenállóbbak a magmás kőzetek? 3. Hogyan jönnek létre az üledékes kőzetek? 4. Magyarázd el a 116. oldali ábra segítségével, hogyan alakulnak ki a karsztjelenségek? Az Országház külső borítására több mint félmillió mészkő díszkövet faragtak", "A természet erői", "117"], ["A lánchegységek és a röghegységek formakincse A hegységek mai képe a belső és a külső erők együttes munkájának köszönhető. A gyű rődés és a vetődés létrehozta a hegységek jellegzetes szerkezetét. Elevenítsd fel a gondolattérkép segítségével, amit a vetődéssel és a gyűrődéssel létrejött felszínformákról tanultunk! vulkánműködés", "gyűrődés", "HEGYSÉGKÉPZŐDÉS", "vetődés", "párhuzamos vonulatok", "kiemelt rögök", "hosszanti völgyek", "lesüllyedt árkok", "láncszerű kapcsolódás", "lépcsős vidékek tágas medencék", "A hegységek mai formakincsének a kialakításában jelentős szerepük van a külső erőknek. Azt, hogy elsősorban melyik külső erő vesz részt a felszínformálásban, az határozza meg, hogy milyen magas a hegység. Az alacsonyabb hegyvidékeket elsősorban a folyóvizek alakítják. A magasabbaknál viszont a jég a legfontosabb felszínformáló erő. Elevenítsd fel, amit a folyóvíz és a jég felszínformáló munkájáról tanultunk! •K eresd meg a térképen az Alpokot! Olvass le magassági számokat a területéről! • Figyeld meg a magashegységek jellemző formakincsét az Alpokban készült felvételek segítségével! Az Alpokban készült felvételekről jól leolvashatók a magashegységek jellemző külső jegyei. Megfigyelheted, hogy felszínüket hegyes, sziklás csúcsok, éles, csipkézett gerincek és meredek, szakadékos lejtőjű hegyol dalak jellemzik. Már tudod, hogy ezeket a formákat a jég alakította ki. Jellegzetes magashegységi táj az Alpokban", "118", "A természet erői"], ["Az ilyen hegyvidékek vízfolyásai nagy esésűek, ezért nagyon sok kőzettörmeléket sodornak magukkal. Ezzel a lánchegysé gek jellegzetes keskeny, mély völgyeit még jobban kimélyítik. A röghegységek többségének a felszíne már annyira lepusztult, hogy magasságuk szerint legtöbbjük csak a középhegységek vagy a dombságok közé sorolható. Meredek, szakadékos lejtőjű hegyoldalak", "Keresd meg Magyarország domborzati térképén a Bükköt! Olvass le magassági számokat a hegység területéről! A leolvasott értékeket hasonlítsd össze az Alpokban találtakkal! A leolvasott magassági számokból kitűnik, hogy az Alpoktól eltérően a Bükk középhegység magasságú. Hasonlítsd össze az Alpokban és a Bükkben készült képeket!", "A középhegységekre jellemző formakincs a Bükkben", "A magashegységekre jellemző formakincs az Alpokban", "A Bükkben legömbölyített hegytetők, széles hegyhátak, lankás hegyoldalak a jellem zők. Ha távolról szemléled, szolid formáik óriási nyugalmat árasztanak, szemben a magashegységek hegyes, sziklás csúcsaival, csipkézett hegygerinceivel és meredek lejtőivel. Mindez – a kialakulásuk módja mellett – a két hegység közötti magasságkülönbség gel magyarázható.", "A természet erői", "119"], ["Vannak azonban olyan röghegységek is, amelyek a magashegységek közé tartoznak. A Föld legmagasabb röghegységét, a Tiensant is ebbe a kategóriába soroljuk. A keresőhálózat segítségével keresd meg a térképen a Tien-sant! Olvass le magassági számokat a hegység területéről! A felszínét elsősorban a jég formálta, ennek köszönhető a képen látható formakincs: hegyes, sziklás csúcsok, éles, csipkézett gerincek és meredek, szakadékos lejtőjű hegyoldalak jellemzik ezt a röghegységet.", "Tien-san hófödte csúcsai", "A változó földfelszín, így a hegységek is a belső és külső erők egyidejű, de ellentéte sen ható folyamatos munkájának az eredménye. Mutasd be a külső és a belső erők ellentétes munkáját az ábra alapján!", "KÜLSŐ ERŐK hőmérsékletingadozás", "jég", "lefolyó csapadék szél vetődés gyűrődés", "vulkáni működés", "BELSŐ ERŐK", "folyóvíz", "A felszín állandó változása a külső és belső erők együttes munkája során", "Ellenőrizd tudásodat!", "1. Mely folyamatok hozták létre a hegységek jellemző szerkezetét? 2. Mi a különbség az alacsonyabb és a magasabb hegységek formakincse között? 3. Minek köszönhetőek ezek a különbségek? 4. Hasonlítsd össze az Alpok és a Bükk külső jegyeit! 5. Magyarázd meg a tapasztalt különbségeket!", "120", "A természet erői"], ["Hogyan alakultak ki alföldjeink? Elevenítsd fel, amit az alföldről mint felszínformáról tanultunk! Már tudod, hogy a tenger szintje és a 200 méteres magasság között elhelyezkedő síkságok az alföldek. Amint azt a nevük is elárulja, ilyen táj hazánkban például az Alföld és a Kisalföld. Figyeld meg az ábrán, hogyan alakult ki alföldjeink többsége! 1. folyók folyók", "tenger üledék", "2.folyók folyók", "tenger üledék", "3.", "szél homok", "lösz", "Jellegzetes alföldi táj", "A legtöbb alföld a tengerek, tavak sül�lyedő medencéjének lassú feltöltődésével keletkezett. A folyók abban az időben is sok hor dalékot szállítottak. Vastag üledékréteg halmozódott fel ezekben a medencékben. Ahogy nőtt az üledékréteg vastagsága, a víz egyre sekélyebb lett, végül teljesen feltöltő dött. A szárazföld részévé vált, területén megtelepedtek a növények, és otthonra találtak benne az állatok. A külső erők a földfelszín minden részén működnek, így ezeket a szárazra került területeket is alakítják. Az alföldek elsősorban a folyók és a szél munkájának köszönhetik mostani képüket. A folyók által feltöltött sík területekre talán a legjellemzőbb példa a Pó-alföld kialakulása. A Pó folyó és mellékfolyói nagyon sok hordalékot szállítanak az Adriai-tengerbe. Ez a hatalmas mennyiségű hordalék olyan ütemben töltögeti a tengert, hogy évente akár 70 méteres sávot is szárazulattá változtat. Keresd meg Európa domborzati térképén a Póalföldet! Használd a keresőhálózatot!", "A feltöltött alföld kialakulása", "A természet erői", "121"], ["A „tengersík” vidékek szinte asztalsimaságú részeit a folyók rendszeres áradásai alakították ki. A mai folyók ősei is – a csapadék mennyiségétől függően – rendszeresen kiáradtak. Ilyenkor hatalmas területek kerültek víz alá. Az elárasztott részekre a folyók lerakták a magukkal szállított hordalékot. Ez az évenként ismétlődő töltögető munka egyengette el több tájunk felszínét. Így alakult ki például az Alföldön a Nagykunság. Keresd meg hazánk domborzati térképén a Nagykunságot! A folyók által leterített finom folyami hordalékból a szél kifújta a homokszeme ket, és buckákba halmozta fel. Ilyen homokbuckás tájunk például a Kiskunság.", "1.", "2.", "3.", "4.", "A folyók áradásaikkal egyengették el a felszínt", "A Kiskunság területén néhány százezer évvel ezelőtt a Duna őse kanyargott, amely a magasabban fekvő tájakról magával hozott hordalékát itt, az alacsonyabb alföldi területeken rakta le. Hátrahagyva a laza hordalékot, a folyó a saját medrét töltögetve araszolgatott nyugat felé. Ebből fújta ki a szél a homokot, amelyet azután buckákba halmozott fel és vándoroltatott.", "Löszfal. A lösz népies neve: sárgaföld", "Minél parányibb a kőzetszemcse, annál messzebbre képes sodorni a szél. Hazánk alföldi területeire is bőségesen halmozott fel ebből a nagyon finom porból, amelyből aztán kialakult a lösz. A lösz igen puha, kézzel is könnyen szétmorzsolható kőzet. Kiváló minőségű talajtakaró képződik rajta. Hazánk legkiválóbb szántóföldjei a löszvidékeken találhatók. Ilyen löszvidék például a Mezőföld. 122", "A természet erői", "A Kiskunsági Nemzeti Parkban, Bugacon, Fülöpháza mellett eredeti formában, jellegzetes növény- és állatvilágával hagyták meg a futóhomokvidéket, amely őrzi a múlt emlékét", "Keresd meg hazánk domborzati térképén a Mezőföldet!"], ["Az alföldeken nagyon könnyű utakat építeni, nem kell megküzdeni a hegységeknél jellemző szintkülönbségekkel. Hazánk alföldjei a mezőgaz daság számára igen értékes te rületek. Hatalmas, összefüggő szántóföldeken lehet gazdálkodni. A természeti viszonyok számtalan növény termesztését és az állattenyésztést teszik lehetővé. A kedvező körülményeknek köszönhetően az emberek szívesen telepedtek le ezekre a területekre.", "Kukoricaföld a Kisalföldön", "Ellenőrizd tudásodat!", "1. Jellemezd az alföldet mint felszínformát! 2. Ismertesd a feltöltött alföldek kialakulásának folyamatát! 3. Hogyan nyerték el alföldjeink a mai felszínüket? 4. Milyen előnnyel bír az alföld mint felszínforma a mezőgazdasági termelés szempontjából?", "Alföldi táj", "A természet erői", "123"], ["Legértékesebb természeti erőforrásunk: a talaj Földünk legértékesebb természeti erőfor rása a talaj. Benne gyökereznek a növények, és innen szívják fel a táplálékukat. Sok állat számára szolgál rejtekhelyül. A talajon terem meg minden szárazföldi élőlény számára a szükséges táplálék.", "A talaj létfontosságú a növények számára", "Elevenítsd fel, milyen alkotórészeket figyeltetek meg a talaj fizikai tulajdonságainak vizsgálata során!", "A talaj a földfelszín legfelső, laza, termékeny takarója. Elaprózódott, elmállott kőzet törmelékből, az élő szervezetek maradványaiból és parányi élőlények milliárdjaiból va lamint a talajnedvességből áll. Fontos, hogy mennyi levegő van a talajszemcsék között. A talaj a szilárd kőzetekből a víz, a levegő és a különböző élő szervezetek hatására nagyon lassan alakult ki. A talajban nyüzsög az élet. Egy öklömnyi darabkában ezernyi élő szervezet található. Közülük a legnagyobbak, például a vakond vagy a borz járataik kiásásával megbolygatják, szinte megforgatják a talajt. Kisebb állatok sokkal nagyobb számban találhatók benne. A legelterjedtebbek a földigiliszták, amelyek a finom talajszemcséket megemésztik, majd lerakják a felszínre.", "A fekete föld humuszban gazdag, jó minőségű talaj", "A legparányibb élő szervezetek között megtalálhatók itt például a baktériumok és a gombák. Ők alakítják át az élő szervezetek maradványait úgy, hogy azt a növények fel tudják venni. A talajban felhalmozódó növényi és álla ti maradványokból származó szerves anya gokat televénynek vagy latin eredetű szóval humusznak nevezzük. Minél több humuszt tartalmaz a talaj, annál termékenyebb.", "A talaj nedvességtartalma nagyon fontos alkotóelem, mivel ebben oldódnak a növények számára nélkülözhetetlen tápanyagok. A talajszemcsék közötti hézagokat tölti ki. Ezeket a beszivárgó csapadék és öntözővíz pótolja. A talaj pórusos szerkezete teszi lehetővé, hogy ezek a vizes oldatok eljussanak a gyökerekhez.", "124", "A természet erői"], ["Ha nincs elég levegő a talajban, a talajszemcsék szorosan ös�szetapadnak, ilyenkor kötött talajról beszélünk. Ebben a növények nem fejlődnek jól. A homoktalajok szemcséi nagyon gyengén kötődnek egymáshoz, azt mondjuk, laza a szerkezetük. Pillanatok alatt beisszák a vizet, még mielőtt az a növények gyökeréhez jutna. Az ilyen talajokat humusz hozzáadásával vagy a humuszképződést elősegítő mulcsolással lehet feljavítani. A Föld különböző területein más-más típusú talajokkal találkozhatunk. Azt, hogy hol melyik típus alakulhat ki, elsősorban az éghajlat határozza meg, hiszen ettől függ, hogy egy területen milyen növénytakaró jöhet létre. Ha megváltozik az éghajlat, más lesz a rajta élő növényzet, így a talaja is megváltozik.", "A homoktalajok gyengébb minőségűek", "Az egyes talajok tápanyagkészlete különböző. Természetes körülmények között a növényzet maga pótolja az elhasznált tápanyagokat azzal, hogy az elhalt növényi részek visszakerülnek a talajba. A termesztett növények részeit azonban betakarítjuk, tehát ezt a tápanyag-utánpótlást elvesszük a talajtól. Ha ezeket nem pótoljuk mesterségesen, például trágyázással, mulccsal, avarral, a talaj fokozatosan kimerül. Emiatt a termésátlagok rohamosan csökkennek. A földművelő ember az évezredek során védte, óvta, gondozta legféltettebb kincsét, a termőföldet. Az utóbbi évtizedekben a túlöntözés, a növényvédő szerek és a műtrágyák szakszerűt len használata világszerte komoly gondokat jelent. A helytelenül művelt földeken a legnagyobb kárt a víz és a szél pusztító tevékenysége okozza. A talaj pusztulását erózi ónak nevezzük. Ha a víz a talaj felső rétegeiből kimossa és elszállítja a kisebb részecskéket, tápanyagot, fokozatosan elvékonyodik a termőréteg. A szél talajpusztító tevékenysége főleg a száraz homokkal borított területeken jellemző, de a löszvidékeken is megfigyelhető.", "Nagyon fontos a szakszerű talajművelés, ennek hiányában a szél lehordhatja a felszín legfelső rétegét", "A földigiliszták a tevékenységükkel hozzájárulnak a talaj termőképességének javításához Szerinted hogyan?", "A laza szerkezetű homoktalajon nagyon nehéz a földművelés", "A természet erői", "125"], ["Az erdőirtások a talaj lepusztulásához vezetnek", "Sok helyen kerülnek a talajba veszélyes anyagok, mint az olaj vagy különböző mérgező vegyszerek. Ezeket a talaj mélyebb rétegeibe mossa a csapadékvíz, így ivóvízkészletünk is veszélybe kerül, de terméketlenné válhat a talaj, és a növényzet is kipusztulhat.", "Ökológiai gazdálkodás Egyre népszerűbbek az ökológiai gazdálkodás vagy más néven biogazdálkodás során előállított élelmiszerek. Ez a gazdálkodási forma tiltja vagy nagymértékben korlátozza a növényvédő szerek, műtrágyák és bizonyos talajjavító szerek alkalmazását. Ez nagyon fontos a talaj védelme szempontjából.", "Ha ezekkel a logókkal ellátott terméket vásárolsz, nemcsak egészségesebb élelmiszereket fogyasztasz, de te is hozzájárulsz legértékesebb természeti erőforrásunk, a talaj védelméhez!", "Ellenőrizd tudásodat!", "Gyorsítja a talaj lepusztulását az erdőir tás. A fák a gyökereikkel szinte összetartják az alattuk lévő talajt, de megvédik az eső verésétől is. Ha kiirtják az erdőket, a hir telen lezúduló csapadékvíz lehordja a ta lajréteget a kopár vagy gyér növényzetű lejtőkről. Minél meredekebb a lejtő, annál nagyobb pusztítást végez a víz. A lehordott iszap vastagon elterül a lejtő alján. 2010. október 4-én futótűzként járta be a világot a magyarországi vörösiszap-katasztrófa híre. A vörösiszap a timföldgyártás során keletkezett melléktermék, maró hatású ipari hulladék, amelyet hatalmas tározókban helyeznek el. A timföldet a bauxitból nyerik, és az alumíniumkohászat alapanyaga. Egy hatalmas tározó fala meglazult, majd átszakadt, és egymillió köbméternyi maró iszap zúdult a környező településekre. Kolontárt, Devecsert és Somlóvásárhelyt árasztotta el. Felbecsülhetetlen kár érte a környezetet. Hatalmas területen teljes talajcserére volt szükség! A katasztrófa során sokan elveszítették otthonukat. A keresőhálózat segítségével keresd meg a katasztrófa helyszínét a térképen! Nézz utána a vörösiszap-katasztrófa történéseinek!", "Az átszakadt tározó fala", "1. Mit nevezünk talajnak? Melyek az alkotórészei? 2. Mitől függ a talaj termőképessége? Miért nélkülözhetetlen alkotóeleme a talajnedvesség? 3. Hogyan lehet megelőzni a talajeróziót? 4. Milyen következményekkel jár, ha veszélyes anyagok kerülnek a talajba?", "126", "A természet erői"], ["Hogyan alakítja át az ember a környezetét? Bármerre járunk, mindenhol az emberi kéz nyomaival találkozunk a környezetünkben. Tevékenysége napról napra formálja a felszínt. A különféle építkezések, a bányászat, a vízügyi munkálatok hatalmas tömegű föld megmozgatásával és gyakran a környezet átalakításával járnak. A legnagyobb földmunkát az ásványkincsek felszínre hozása igényli. Hatalmas mennyiségű kőzetanyagot kell megmozgatni, mire felhasználható bányakincsekhez jutnak a szakemberek. Nyomukban bányajáratok, külszíni fejtések bányagödrei és meddőhányók sorakoznak.", "Ilyen és ehhez hasonló gépóriásokkal formálja az ember a tájat", "Előfordult már, hogy a felázott, rosszul felhalmozott meddőhányó a közelében lévő településre zúdult.", "Ha a meddőhányók átáznak, veszélyesek is lehetnek", "Délegyháza. A bányatavak többnyire nagyon mélyek", "Az építkezések számának rohamos emelkedése sok felszínváltozást eredményez. Gondoljunk csak a nap mint nap szemünk előtt zajló építkezésekre! Egy-egy ház alapozásához sok beton kell. A betongyártáshoz szükséges anyagok – például a kavics – kitermelése hatalmas gödrök keletkezésével jár. Helyüket bányatavak töltik ki. A cementgyártáshoz egész hegyeket hordanak el. Az út- és vasúthálózat kiépítéséhez és fejlesztéséhez is nagy men�nyiségű földet kell megmozgatni. A töltések építéséhez pedig nagyon sok zúzott kőre, például bazaltra van szükség. Az alapanyagokat szolgáltató kőbányák hatalmas sebhelyekként tátongnak. A Balaton-felvidéken látható Hegyestű jó részét elhordták", "A természet erői", "127"], ["A Föld népességének növekedése az élelmiszer-szükséglet fokozatos növekedésével jár. Emiatt újabb és újabb területeket vonnak művelés alá. Az erdőket kivágják, a gátak közé szorított folyók árterületeit felszántják, és ott is kultúrnövényeket termesztenek. A földek szakszerűtlen művelése és az erdőirtások a talaj lepusztulásához vezetnek. Elevenítsd fel, amit a Tisza szabályozásáról már tanultunk! Ennek a kiirtott erdőnek a helyén utat építenek", "Sok folyót szabályoztak az elmúlt évszázadokban. Árvízvédelmi célból és a zavartalan hajózás biztosítása érdekében átvágták a kanyarulataikat. Legtöbbször hatalmas töltések közé szorították a vizet. A kanyarulatok levágásával a folyó útja megrövidül, nő a sebessége. Ezzel nő a folyó völgymélyítő tevékenysége is, aminek következtében lényegesen több lesz a szállított hordalék is.", "A folyószabályozás fontos lépése a kanyarulatok levágása", "Árvízi töltés a Rába mentén. Az építése során nagy mennyiségű földet hordtak ide", "Egyre nagyobb duzzasztógátakat építenek. Ezek is hatalmas mennyiségű föld megmozgatásával és óriási töltések létrehozásával járnak. Gyűjts adatokat a Föld legnagyobb vízerőművéről, a kínai Három Szurdok-gátról! Ez a néhány példa is bizonyítja, hogy jelentősen megnőtt az ember szerepe a Föld felszínének alakításában. Egyes változások jótékony, míg mások sajnos környezetromboló hatásúak. A környezetkímélőbb megoldások alkalmazása a szakemberek felelőssége. Fontos, hogy ezt senki ne tévessze szem elől, mert csak így lesz igaz az a mondat, miszerint: „Nemcsak elvennünk kell, amit a Föld ad, nekünk is adnunk kell: óvni Őt!” Te is erre törekedj! Szervezzetek projektet Hogyan alakították át lakóhelyünk környezetét? címmel!", "128", "A természet erői"], ["Időszámítás a Föld és az emberiség történetében Ebben a fejezetben sok mindent megtanultál a Föld felszínének állandó változásáról, az egyes felszínformák kialakulásáról és felépítéséről. Pillantsunk be most abba is, mennyi időre volt szükség mindehhez! A Föld a tudósok számításai szerint mintegy 4,6 milliárd évvel ezelőtt alakult ki. 4600 millió év – még kimondani is sok. Ennyire hosszú időt nagyon nehezen tudunk elképzelni, mivel az emberek napokban, hónapokban, években, legfeljebb évtizedekben gondolkoznak.", "Olduvai-szakadék (Kelet-Afrika). Itt találták meg a kb. 2 millió évvel ezelőtt élt ősember koponyáját", "Már tanultad, hogy az emberiség történelme korokra ta golódik, és az ember megjelenésével, az őskorral kezdődik. Tovább folytatódik az ókorral, középkorral és az újkorral. A tudósok a földfelszín alakulását is különböző szakaszokra, úgynevezett földtörténeti korokra osztották. Ez az időszámítás a Föld kialakulásával kezdődik, és az ősidő nevet kapta. Az ősidőt az óidő, a középidő, majd az újidő követi.", "Mintegy 150 millió éves csontváz a középidőből", "A történelmi korok évtizedeket, évszázadokat, legfel jebb évezredeket ölelnek fel, ezzel szemben a földtörténeti korok évmilliókat, sőt több száz millió évet. A történelemben sokszor néhány nap, esetleg óra alatt történtek forradalmi változások, míg egy hegység, mint például az Alpok kialakulásához több tíz millió évre is szükség volt. A történelmi események legtöbbjének ismerjük a pontos dátumát. A földtörténet esetében sokkal nehezebb a kutatók dolga. A tudósok az egyes tájak vagy például egy kőzet kialakulásának az idejét a legkorszerűbb és legpontosabb módszerekkel is csak hozzávetőlegesen tudják megállapítani. A 130. oldali táblázatban megtalálod néhány, már tanult táj, kőzet, valamint az élővilág kialakulásának az idejét. Tanulmányozd a táblázatot, majd az adatok alapján készíts időszalagot! Ábrázold, majd figyeld meg az időszalagon a Föld története és az emberiség történelme közötti időbeli különbséget! Hasonlítsd össze az egyes szakaszokat!", "500 millió éves ősrákféle megkövesedett maradványa", "A több százmillió éve kialakult, felszínre került gránit, ma több helyen ilyen formában található meg. Miért?", "A természet erői", "129"], ["Idő (millió év) újidő (65)", "A földfelszínnel kapcsolatos események", "Élővilág fejlődése", "negyedi
