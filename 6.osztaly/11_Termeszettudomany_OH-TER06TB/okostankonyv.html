gtöbb földrengés erősségét? c) M ilyen károk keletkezhetnek az erősebb rengések közben? d) Miért veszélyes, ha a gázvezetékek elpattannak a földrengés során? e) Gyűjt a Richter-skáláról az interneten! Mi a különbség az egyes fokozatok között a pusztítás erősségében? f) G yűjts adatokat az eddig ismert nagy földrengésekről! Jegyezd fel, honnan gyűjtöttél!", "3. Modellezzétek a gleccserek felszínformáló munkáját!", "Csiszoljatok más-más intenzitással, különböző szemcsenagyságú csiszolópapírral különböző keménységű fadarabokat! Figyeljétek meg, melyik esetben lett nagyobb a csiszolás mélysége! Vonjatok párhuzamot a megfigyelt folyamat és a gleccserek munkája között! Készítsetek tablót gleccserek által mélyített völgyekről! Beszéljétek meg a tapasztaltakat!", "4. Egy földrajzi magazin szerkesztésében vesztek részt. A képek témái már adottak, csak képeket kell ke-", "resnetek hozzájuk az interneten! Mutassátok be a keresés eredményét az osztálynak! 1. téma: A folyóvíz munkavégző képességét mi sem bizonyítja jobban, mint ennek a hegyi folyónak a szurdoka. 2. téma: A síkságra érve a folyók esése csökken, medrük kiszélesedik, folyásuk lelassul. 3. téma: Ha huzamosabb ideig sok a csapadék, vagy olvadásnak indul a hó, a folyók vize felduzzad, és kilépnek medrükből.", "A természet erői", "131"], ["5. Hasonlítsd össze a röghegységeket és a lánchegységeket!", "Keress olyan jellemzőket, amelyek csak a röghegységekre, csak a lánchegységekre vagy mindkettőre jellemzőek.", "6. Gyűjtsetek talajmintát! Vizsgáljátok meg, milyen alkotórészeket találtatok a mintában! Hasonlítsátok össze a csoportok által bemutatott talajmintákat!", "7. A talajba kerülő szennyező anyagok kimutatása", "A kísérlethez szükséged lesz egy pohár vízre, ételfestékre és egy szál fehér virágra, pl. szegfűre. A szegfűt helyettesítheted pl. egy zellerlevéllel, azon is jól láthatóak lesznek a változások. • Önts egy pohár vízbe tetszőleges színű ételfestéket (tojásfestéket is használhatsz), és jól keverd össze! • Készíts a száron friss vágási felületet! • Állítsd a virágot a pohárba, és hagyd a vízben néhány óráig! Mit tapasztaltál? Fogalmazd meg a saját szavaiddal, mi a tanulsága ennek a kísérletnek!", "8. Nézzetek utána, hogy mi a feltétele annak, hogy egy terméken szerepelhessen az EU ökológiai logó vagy az USDA Organic logó! Milyen előnyökkel jár, ha ilyen terméket fogyasztasz? Keressétek fel a Bio Garancia Kft. honlapját: https://www.bio-garancia.hu/hu/home", "9. Írj fogalmazást Sokan kidobják, de a komposztba kerülhetne! címmel a komposztkészítés folyamatáról és jelentőségéről a talaj tápanyag-utánpótlásában!", "Konyhai hulladék", "1.", "2.", "3.", "4.", "5.", "6.", "Egymásra rétegzés", "Föld vagy segédanyag hozzáadása", "Nedvesítés", "Érés, hőtermelés", "Stabilizálódás", "Komposzt kitermelése, felhasználása", "Faforgács vagy szalma Vázanyag Levél Fanyesedék", "132", "A természet erői"], ["Rendszerezzük ismereteinket! A vulkánok és a földrengések", "A belső erők a Föld belsejéből ható erők. Az izzó kőzetolvadék, a magma a magmakamrából tör a felszínre. A vulkánműködés során a törésvonalak mentén a felszínre kerül az olvadt kőzetanyag, a láva. A vulkánkitörés többszöri megismétlődése során alakulnak ki a rétegvulkánok. A láva megszilárdulásával andezit és bazalt, a vulkáni törmelékekből és hamuból laza szerkezetű vulkáni tufa képződik. Hazánkban több kialudt vulkán is található. A földrengés iszonyatos pusztításokkal járó jelenség. A nagy mélységben uralkodó óriási belső erők hatására a merev kőzetrétegek elpattannak, és hatalmas energiával lökik meg a szomszédos rétegeket. Ez a váratlan lökés terjed minden irányban.", "Hogyan keletkez tek a hegységek?", "A hegységek vulkánműködés során, valamint gyűrődéssel és vetődéssel keletkeztek. A Föld mélyén képlékennyé váló kőzetek az őket érő oldalirányú nyomás hatására gyűrődtek meg, létrehozva ezzel a lánchegységeket. A lánchegységeket párhuzamos vonulatok és hosszanti völgyek jellemzik. A röghegységek vetődéssel alakultak ki, aminek következtében tágas medencék, lesüllyedt árkok, lépcsős vidékek váltakoznak. Felszínüket széles völgyek tagolják.", "A külső erők felszínformáló munkája", "A külső erők romboló és építő munkát végeznek. A hegységek kőzetanyagát, valamint a kiemelkedő területek felszínét lepusztítják. Anyagukat elszállítják, és az alacsonyabb területeken, valamint a tengerek, tavak medencéjében felhalmozzák. A nagy napi hőingás felaprózza a kőzeteket. Ha a kőzetek repedéseibe beszivárgó víz megfagy, fagyaprózódásról beszélünk. A hegyvidékeken a meredek lejtők vízfolyásai hosszú idő alatt hatalmas V alakú völgyeket vájnak ki maguknak. Az alföldi sík területeken a folyók először zátonyt, majd szigetet építenek. A csapadékvíz oldó hatására a mészkőhegységekben bekövetkező változásokat karsztosodásnak, az általa létrehozott érdekes formákat pedig karsztformáknak nevezzük. Karsztformák: víznyelő, dolina, barlang, cseppkő. A hegyvidékek magasabb területein a legfontosabb felszínformáló erő a jég. A jég kicsipkézi a hegygerinceket, és U alakú völgyekkel teszi változatosabbá a tájat. A gleccser lassan mozgó jégtömeg.", "A kőzetek és a felszín forma kincse", "Kialakulás szerint magmás, üledékes és átalakult kőzeteket különböztetünk meg.", "A természet erői", "133"], ["A lánchegységek és a röghegysé gek formakincse", "A hegységek szerkezetét a belső erők alakítják ki. A felszíni formakincs kialakításában jelentős szerepük van a külső erőknek. Munkájukat elsősorban a hegység magassága és kőzetanyaga határozza meg. A lánchegységeket hegyes, sziklás csúcsok, éles, csipkézett gerincek és meredek, szakadékos lejtőjű hegyoldalak jellemzik. A röghegységekben legömbölyített hegytetők, széles hegyhátak, lankás hegyoldalak a jellemzők.", "Hogyan alakultak ki alföldjeink?", "Ha a megsüllyedt területeket a folyók feltöltik, az ott lerakott vastag üledékrétegből hosszú évmilliók alatt alföldek alakulnak ki. Felszínük mai képe elsősorban a folyók és a szél munkájának köszönhető.", "Legértékesebb természeti erő forrásunk: talaj", "A talaj a földfelszín legfelső, laza, termékeny takarója. Elaprózódott, elmállott kőzettörmelékből, az élő szervezetek maradványaiból, parányi élő szervezetek milliárdjaiból és a talajnedvességből áll. Fontos, hogy mennyi levegő van a talajszemcsék között. A talajban felhalmozódó növényi és állati maradványokból származó szerves anyagokat televénynek vagy humusznak nevezzük. Minél több humuszt tartalmaz a talaj, annál termékenyebb. A talaj pusztulását eróziónak nevezzük.", "Időszámítás a Föld és az embe riség történeté ben", "A történelmi korok évtizedeket, évszázadokat, legfeljebb évezredeket ölelnek fel, ezzel szemben a földtörténeti korok évmilliókat, sőt több száz millió évet. A földtörténet a Föld kialakulásával, az ősidővel kezdődik, melyet az óidő, a középidő, majd az újidő követ.", "A gleccser útjának a vége. Jól látható a magával hozott kőzettörmelék", "134", "A természet erői"], ["AZ ŐSHONOS FÜVES TERÜLETEK ÉS A MEZŐK ÉLETKÖZÖSSÉGE", "Hazai tájakon", "135"], ["Az őshonos füves puszták kialakulása, növényei A mérsékelt éghajlati övezetben ott alakultak ki őshonos füves puszták, ahol az éves csapadék mennyisége 500 mm-nél kevesebb. Ezeken a területeken nagy az évi hőingás, és nyáron gyakoriak az aszályos hónapok. Hazánkban őshonos füves puszták csak az Alföld egyes részein, valamint az Északi- és a Dunántúli-középhegység déli oldalán, a hegyek lábánál találhatók. A mezőgazdaság térnyerésével e területek nagy részét felszántották. Füves pusztáink mára csak kis területen maradtak fenn, és védelem alatt állnak. Figyeld meg a képeken az őshonos füves pusztáinkat!", "Az őshonos árvalányhaj hazánkban védett növény", "Szikes puszta", "A mezőgazdasági területek helyén korábban erdők vagy őshonos füves területek voltak. Az erdőket kivágták, az őshonos füves területeket felszántották, helyükön szántóföldeket, kaszálóréteket, legelőket alakítottak ki, ezért ezeket a területeket másodlagos rétnek is nevezik. A rétek füvét évente többször kaszálják, megszárítják – ez a széna, amely állati takarmány. A legelők füvét az állatokkal (szarvasmarha, juh) frissen etetik fel. A rétek füvei elviselik az állatok taposását, a rendszeres legelést vagy a kaszálást. Bár a füvek föld feletti része megcsonkul, a csonkból új levél képződik. A füvek így folyamatosan megújítják önmagukat. Elviselik a szárazságot is, mivel sűrű gyökérzetükkel a talaj legkisebb nedvességét is képesek felvenni.", "A füves területek nevüket az uralkodó növényzetükről, a fűfélékről kapták. Közös jellemzőjük, hogy gyökérzetük mellékgyökérzet, amely sűrűn behálózza a talajt. Száruk nem ágazik el, belül üreges. Leveleik hosszúak, alsó részükkel körülölelik a szárat, vagyis szár ölelő levelek. Erezetük párhuzamosan fut, más néven mellékeresek. A virágaik különböző virágzatot alkotnak (buga, fürt, kalász), nem feltűnő színűek, a szél porozza be őket. 136", "Az őshonos füves területek és a mezők életközössége"], ["A száraz rétek gyakori fűféléje a siskanád és az angolperje. Figyeld meg a rajzokon a fűfélék tulajdonságait!", "Siskanád", "Angolperje", "A mezei zsálya 60-80 cm magas, feltűnő virágzatú növény. Elviseli a száraz, meleg nyarat, mivel főgyökérzete mélyen hatol a talajba. Évelő növény, gyöktörzse tápanyagokat raktároz. Májustól nyár végéig folyamatosan virágzik. Virágait a rovarok porozzák be. A zsályát gyógynövényként is használják. A leveleiből készített tea vértisztító, kiválóan alkalmas a légző- és az emésztőszervi panaszok enyhítésére. Mezei zsálya", "A mocsárrétek a folyók árterein, a tartósan vízzel borított területeken alakultak ki. A fűféléken (kékperje, ecsetpázsit, csenkesz) és sásfajokon kívül virágtalan növények is élnek itt. A mocsári zsurló ősei 200-300 millió évvel ezelőtt uralkodó növények voltak a Földön. 20-30 méter magasra nőttek. Földbe süllyedt maradványaikból alakultak ki a kőszéntelepek. A mocsári zsurló 50 cm magasra nő. Spórákkal szaporodik. A spóratartó tokok a főhajtás csúcsi részén fejlődnek. A kihulló spórákból a nedves talajon először előtelep fejlődik ki, majd azon kialakul az új növény. Az őshonos füves területek és a mezők életközössége", "137"], ["A zsurló levelei aprók, pikkelyszerűen a hajtásokhoz simulnak. A talajban lévő szerve a gyöktörzs, amelyből a gyökérszálak erednek. Frissen és szárítva is mérgező, a szénába keveredve az állatok bélgyulladását okozza. Nedves rétek gyakori évelő növénye az 1 méter magasra is megnövő réti boglárka. Talajban lévő szerve a tápanyag-raktározó Mocsári zsurló gyöktörzs, amely a mellékgyökérzetben folytatódik. A föld feletti szár elágazik, a nyélen ülő levelek a főérig bemetszettek. Az ilyen levelet szeldelt levélnek nevezzük. A virág csészelevelei és sziromlevelei egyformán élénksárga színűek, a rovarok porozzák be. A réti boglárka megszárítva jó minőségű szénát ad, frissen azonban mérgező. Mindezt az állatok ösztönösen tudják, ezért nem legelik. Így alakulnak ki a nedves réteken a nagy, boglárkákkal borított területek. Figyeld meg és hasonlítsd össze a tankönyv képei alapján a mezei zsálya és a réti boglárka virágait!", "A réti boglárka virága és termése", "Ellenőrizd tudásodat!", "A réti boglárka szeldelt levele", "1. Hol alakultak ki a mérsékelt éghajlati övezetben a füves puszták? 2. Hazánkban mely földrajzi tájakon találhatók ilyen területek? 3. Magyarázd meg a fogalmat: másodlagos rét! 4. Sorold fel a nedves és a száraz rétek megismert növényeit! Mi alapján tudod megkülönböztetni őket?", "138", "Az őshonos füves területek és a mezők életközössége"], ["Ízeltlábúak a füves területeken Már tanultuk, hogy az állatvilágban a legnépesebb állatcsoportot az ízeltlábúak alkotják. A füves területeken is nagy számban élnek. Életmódjukkal, testfelépítésükkel kiválóan alkalmazkodnak a különböző élőhelyek környezeti adottságaihoz. A száraz, táplálékban szegény homokpusztáktól a tartósan vízzel borított mocsárrétekig mindenütt megélnek. Alkalmazkodóképességük ellenére a természetes vagy ahhoz közeli élőhelyeken azonban nem szaporodnak túl. Egyedszámukat a velük táplálkozó állatok (énekes- és ragadozó madarak, sünök, vakondok, hörcsögök) szabályozzák. Tömeges elszaporodásuk csak ott lehetséges, ahol az emberi beavatkozások miatt lecsökkent (vagy kipusztult) a természetes ellenségeik száma. A füves területek legismertebb ízelt lábú rovarjai a sáskák, a szöcskék és a tücskök, összefoglaló néven: az egyenesszárnyúak. Közös tulajdonságuk a három pár ízelt láb és a három testrész (fej, tor és potroh). Jellegzetességük, hogy a harmadik pár ízelt láb ugrólábbá módosult. Rágó szájszervükkel a sáskák és a tücskök nagy mennyiségű növényt fogyasztanak. Fejük két oldalán az összetett szemek helyezkednek el. Ízlelő- és tapogatószervük a csáp, amelynek hossza alapján a sáskákat és szöcskéket megkülönböztethetjük. A sáskák csápjának hossza nem éri el a testhosszúságuk felét, a szöcskék csápja mindig hosszabb, mint a testük hosszának fele.", "A sáska rágó szájszerve", "A tori részükről ered a két pár szárny, melynek felépítése és működése különbözik a korábban tanult cserebogár és szarvasbogár szárnyától. A felül elhelyezkedő első pár szárny keményebb, tapintása bőrszerű. Ez alatt található a hártyás szárny, amely nyugalmi helyzetben legyezőszerűen összehajtott. Keleti vándorsáska", "Figyeld meg a képen a sáska szárnyainak jellegzetességeit! Miben különbözik a cserebogár és az 5. évfolyamon tanult házi légy szárnyaitól?", "Az őshonos füves területek és a mezők életközössége", "139"], ["Szaporodási időszakuk a nyár vége. Ekkor a nőstény a tojócső segítségével a talajba rakja a petéket. A peték áttelelnek, és csak a következő év tavaszán kelnek ki belőle a lárvák. A kis lárvák testfelépítésükben hasonlítanak a kifejlett állatra, de szárnyuk még fejletlen. Ugyanott élnek, és ugyanúgy táplálkoznak, mint a kifejlett rovarok. Növekedésük során többször vedlenek. Testhosszúságuk minden vedlés után az előző testhosszúság negyedrészével növekszik. A szárnyak az utolsó vedlés után fejlődnek ki. Bábállapot nincs, az ilyen fejlődést kifejlésnek nevezzük.", "lárvák", "kifejlett rovar", "pete A kifejlés folyamata", "• Hasonlítsd össze a tankönyv képei alapján a sáskák, a szöcskék és a tücskök testfelépítését! • Figyeld meg a kifejlés folyamatát! Hasonlítsd össze a fejlődésüket a szarvasbogár fejlődésével! A rovarok kültakarója nemcsak a környezeti hatásoktól véd, hanem rejtőszín is egyben. Ezért tapasztalhatjuk azt, hogy bár jelenlétükről hangos ciripelésük árulkodik, mégsem kerülnek a szemünk elé.", "A szöcske hallószerve", "140", "A sáskák hangadáskor a kitines combjukat az érdes szárnyukhoz dörzsölik. A szöcskék, tücskök a szárnyfedőik összedörzsölésével keltik a hangot. A hangokat hallószervükkel fogják fel. Ez egy vékony hártya, amelyet a hanghullámok megrezegtetnek. A szöcskéknél és tücsköknél a hallószerv az első pár lábban, a sáskáknál a potrohban helyezkedik el. A hangadásnak a szaporodási időszakban van jelentősége. Segíti, hogy a magas fűben a hímek és a nőstények egymásra találjanak. Ez a magyarázata annak, hogy a párzási időszakon kívül – a nyár végétől – már ritkábban halljuk ciripelésüket.", "Az őshonos füves területek és a mezők életközössége"], ["Olasz sáska", "Zöld lombszöcske", "Az egyik legismertebb sáskafaj az olasz sáska. 4 cm hosszú, teste oldalról lapított. A zöld lombszöcske színével teljesen beleolvad a leshelyéül szolgáló levelekbe. Csápjai hosszúak, a szárnyak túlnyúlnak a potrohon. A 3-4 cm hosszú lombszöcske főleg apró rovarokkal táplálkozik. A mezei tücsök 2-3 cm hosszú, testrészei fekete színűek, a szárnyai barnák. A talajba készített járatokban él, azok bejáratánál ciripel. A ciripelés egyben jelzés is fajtársainak, hogy a terület foglalt. Mezei tücsök", "A rétek színpompás ízeltlábú állatai a lepkék. Közülük is kitűnik az élénksárga-fekete színű, kb. 10 cm nagyságú fecskefarkú lepke. Az állatvilágban gyakori, hogy a szín nemcsak a rejtőzködést segíti, hanem az ellenség megtévesztésére és elriasztására is szolgál. Ilyen a fecskefarkú lepke kiterjesztett szárnyain előtűnő két narancsszínű riasztó szemfolt. A korábban tanult almamolyhoz, káposztalepkéhez hasonlóan, mint minden lepke, teljes átalakulással fejlődik.", "Fecskefarkú lepke", "Ellenőrizd tudásodat!", "1. Melyek a sáskák, szöcskék, tücskök közös tulajdonságai? 2. Hasonlítsd össze az eddig megismert ízeltlábúak szaporodását! 3. Hogyan fejlődik a fecskefarkú lepke? Mivel táplálkoznak a lárvák és a kifejlett lepkék?", "Az őshonos füves területek és a mezők életközössége", "141"], ["A fürge gyík és a vakond A fürge gyík és a vakond főleg rovarokkal táplálkozik. A táplálékért nincs közöttük versengés, mivel a gyíkok a füves terület növényei közt megbújva, míg a vakond a talajban készített járataiban zsákmányol.", "A fürge gyík hímje és nősténye", "A fürge gyík a farkával együtt 20-25 cm hosszú. Testét a vízisiklóhoz hasonlóan szá raz szarupikkelyek borítják. A pikkelyek összeolvadásából a fejen és a hasi oldalon szarupajzsok képződtek. A szorosan elhelyezkedő pikkelyek, pajzsok védik az állatot a környezeti hatásoktól, és meggátolják a testük kiszáradását. A kültakaró színe egyben segíti a rejtőzködést is. A gyíkokra jellemző, hogy növekedésük során többször vedlenek. Kövekhez, faágakhoz dörgölőzve, darabokban válik le róluk a régi kültakaró felső rétege. Figyeld meg a gyík gerincoszlopát, mozgását!", "A fürge gyík csontváza", "Tojásból kibúvó gyík", "142", "A fürge gyík gyors mozgásáról kapta a nevét. Lábai gyengék, mozgás közben nem bírják a testet felemelni. Gyorsaságát a hajlé kony gerincoszlopa és a hozzá kapcsolódó izomzat biztosítja. E szervezeti sajátossággal teste gyors, kígyózó mozgással halad előre. A fürge gyík változó testhőmérsékletű, ezért gyakran sütkérezik a napon. Ilyenkor melegíti fel testét, ami az életfolyamatainak felgyorsulásához szükséges. Hűvös, esős időben rejtekhelyén marad. Napsütéses időben szinte egész nap rovarokra, pókokra vadászik. A táplálék megszerzésében rejtőszíne, gyors mozgása és kiváló látása segíti. Természetes ellenségei közé tartozik a rézsikló, a gólya, a varjú és a nyest. A homokos talajba rakja 5-10 lágy héjú tojását, melyeket a nap melege költ ki. Fagymentes helyen téli álmot alszik.", "Az őshonos füves területek és a mezők életközössége"], ["A vakond 10-15 cm hosszú, hengeres testű, bársonyosan fénylő, fekete szőrzetű állat. Fülkagylója nincs, a hallójáratot egy kis bőrredő fedi. Egész életét a talajban, a saját maga készítette járatrendszerben tölti. Igen magányos állat, még a fajtársait sem tűri meg a közelében. Mellső lábai rövidek, tenyérrel kifelé és hátrafelé fordultak. Ujjai hegyes karomban végződnek, és bőrhártya van közöttük. Az ilyen felépítésű végtagot ásólábnak nevezzük. A kiásott talajt időnként a felszínre tolja, ez a vakondtúrás. A feltúrt, laza földön keresztül áramlik be a levegő a járataiba. A járatait helyenként kiszélesíti, ezek egyike a pihenőhelye, más kamrákban élelmet raktároz. Apró szemével igen gyengén lát, csak a sötétséget és a fényt érzékeli vele. A táplálék megszerzésében megnyúlt orra segíti, amely szagló- és tapintószerv is egyben. Rendkívül falánk állat, naponta saját testtömegével megegyező eleséget képes elfogyasztani. Elsősorban a járataiba kerülő rovarokkal, rovarlárvákkal, gyűrűsférgekkel táplálkozik, de megeszi az útjába kerülő egereket, pockokat is. Ha bőségesen van táplálék, készleteket gyűjt. Megfigyeltek olyan vakondjáratot, amelynek egyik kamrájában több tucat földigiliszta volt elraktározva a szűkösebb időkre. A vakonddal a baglyok, nyestek, gólyák táplálkoznak, melyek kifigyelik a friss túrását, és lecsapnak rá. A menyét a járataiban üldözve fogja el. A vakond fogazata a sünéhez hasonlóan rovarevő fogazat. Valamennyi fogtípusa (metsző-, szem- és zápfog) hegyes. A sünnel ellentétben nem alszik téli álmot. A téli hónapokban járatait mélyebbre ássa, és ilyenkor is rendszeresen táplálkozik. Jelenlétéről a hóval fedett területeken megfigyelhető friss vakondtúrások árulkodnak. Járatainak kiszélesített, puha növényzettel kibélelt üregében hozza világra 4-5, babszem nagyságú kicsinyét, melyek egy hónapos korukig szopnak.", "Vakond", "A vakond koponyája és ásólába", "A vakond föld alatti járatai", "Ellenőrizd tudásodat!", "1. Mely tulajdonságaiban hasonlít a fürge gyík a vízisiklóhoz? 2. Mi a jellemző a fürge gyík mozgására, táplálkozására, szaporodására? 3. Hol él a vakond? 4. Hogyan alkalmazkodott a vakond testfelépítése a táplálék megszerzéséhez? 5. Hasonlítsd össze a vakond és a sün életmódját!", "Az őshonos füves területek és a mezők életközössége", "143"], ["A mezei nyúl és a füves területek rágcsáló kisemlősei A mezei nyúl az állatfajok többségével szemben nem ragaszkodik egy-egy élőhelyhez. A réteken, szántóföldeken, gyümölcsösökben éppen úgy megtalálja életfeltételeit, mint az erdőben. Ez előnyös tulajdonság számára, mivel a táplálékszegény időszakban újabb élőhelyet keres magának. A szántóföldi növények közül a lucernát, a káposzta- és a répaféléket kedveli. Hátsó pár lába, az úgynevezett ugróláb hosszabb és erősebb a mellső lábainál. Veszély esetén nagy ugrásokkal, gyors iramban menekül. Éjjel jár tápláléka után, nappal a vackán pihen. Fűfélékkel, a téli időszakban az erdő fáinak, cserjéinek rügyeivel és a vékony ágak kérgével táplálkozik. A szántóföldi növények közül a lucernát, a káposztát, a répaféléket kedveli. A mezei nyúl testtömege 3-6 kg, hossza 6070 cm. Kültakarója rejtőszín is egyben. Mozdulatlan állapotban szinte észrevehetetlenül beleolvad a környezetébe.", "Metszőfogai hosszúak, hajlítottak, végük éles. A metszőfogaknak nincsenek gyökerei, folyamatosan nőnek, keményebb növényi anyagok rágásával koptatja őket. Felső metszőfogai mögött még egy pár kisebb metszőfoga is van. Szemfogai nincsenek, zápfogai nak felülete redős. A mezei nyúl életmódja rágcsáló.", "Mezei nyúl", "Az üregi nyúl az Alföldön él, a homokos talajba járatokat készít. A nappalt itt tölti, és csak éjjel jön elő táplálkozni. Testtömege és testhossza feleakkora, mint a mezei nyúlé. Nagyobb családokban él, egy-egy hímhez több nőstény is tartozik. A különböző házinyúlfajtákat az üregi nyúlból nemesítették ki.", "Hosszú vakbelében lebontó baktériumok élnek. Ezek segítik megemészteni a növényi rostokat, amelyeket nehezen emészthető ös�szetett anyagok (cellulóz) alkotnak. A kisnyulak belében a megszületésükkor még nincsenek ilyen baktériumok. Ezért első táplálékként az anyjuk emésztőbaktériumokat tartalmazó híg ürülékét fogyasztják el.", "Üregi nyúl", "144", "Az őshonos füves területek és a mezők életközössége"], ["A mezei nyúl természetes ellensége a róka, a héja és a ragadozó madarak. Érzékszervei közül a hallása kiváló, a legkisebb neszre is felriad pihenőhelyéről. Évente háromszor fiadzik, egy-egy alkalommal a földbe kapart mélyedésbe 2-4 kölyköt hoz a világra. A kisnyulak igen fejletten születnek, szőrzetük dús, a szemük nyitva van. Anyjuk csak egy hétig szoptatja őket, ezután már önállóan táplálkoznak. Szaporaságuk ellenére ma már egyre kevesebb mezei nyúllal találkozunk. Ennek legfőbb oka a természetes élőhelyük csökkenése. A mezőgazdaságban használt vegyszerek, továbbá egyes járványos betegségek is ritkítják állományukat. A füves területeken mindenütt gyakori a 10 cm nagyságú mezei pocok. Testfelépítése a házi egéréhez hasonló, de annál kisebb, lekerekített a füle, és rövidebb a farka. Enyhe telű években tömegesen elszaporodik. Élőhelyén a talaj felszínéhez közel járatokat épít. Télen is táplálkozik, járatait a hó alatt készíti el.", "Figyeld meg a tankönyv rajzán a mezei pocok és a mezei nyúl koponyáját, valamint a fogazat jellegzetességeit!", "A mezei pocok főleg növényekkel táplálkozik", "A mezei pocok és a mezei nyúl koponyája és fogazata", "A mezei pocok növényevő, rágcsá lófogazatú, metszőfogai folyamatosan nőnek. Főleg fűfélék magjaival, a frissen kikelt vetéssel, lucernafélékkel, érő gabonával, cukorrépával és burgonyával táplálkozik. Vörös vércse pockot zsákmányol", "Az őshonos füves területek és a mezők életközössége", "145"], ["A mezei pocok rendkívül szapora állat. Évente hatszor is kölykezik, egy-egy alkalommal 4-8 csupasz kölyköt hoz a világra. Egy nősténynek évente 50 utóda is lehet. Az, hogy nem lepik el az élőhelyeket, a természetes ellenségeiknek, a ragadozó állatoknak köszönhető. Ezek az egerészölyv, az erdei fülesbagoly, a vörös vércse, a róka, a sün, a vakond, a menyét és a hörcsög. Figyeld meg a képen a menyét testfelépítését!", "A menyét 20 cm nagyságú, egerekkel, pockokkal táplálkozik, melyeket járataikban is üldöz", "A közönséges hörcsög 25-30 cm hos�szú. Többnyire a gabonaföldek környezetében telepszik meg. Talajban készített járatai helyenként 2 m mélyen futnak, többfelé elágaznak, kamrákká szélesednek. Külön kamrában raktározza az eleséget, és más kamrát bélel ki alvóhelynek. Rágcsáló, a gabonaféléken kívül gilisztákkal, rovarokkal, mezei pockokkal is táplálkozik. A gabonaszemeket a pofazacskójában gyűjti össze. Ősszel akár 15 kg magot is elraktároz. Megszakított téli álmot alszik, ha felébred, készleteiből táplálkozik. Puhán kibélelt pihenőkamrájában 6-10 utódot hoz a világra. A közönséges hörcsög", "Természetes ellenségei a róka, a görény és a ragadozó madarak.", "Ellenőrizd tudásodat!", "1. Ismertesd a mezei nyúl testfelépítését, életmódját és szaporodását! 2. Mi a jellemző a tanult állatok fogazatára? 3. A mezei nyúl, a mezei pocok és a hörcsög szapora állat. Mi korlátozza a túlszaporodásukat?", "146", "Az őshonos füves területek és a mezők életközössége"], ["A fácán és a füves területek ragadozó madarai", "A fácán tojójának testhossza 50-60 cm, a kakasé 70-90 cm. Testtömegük 1 kg körüli", "Hazánkban a fácánok szinte mindenütt elterjedtek (mezőgazdasági területeken, réteken, erdei tisztások környékén), de nem őshonos madaraink. A középkorban vadászati célból telepítették őket Európába. Napjainkban is mesterséges körülmények között tenyésztik, majd szabadon engedik a fácánokat. Őshazájuk a Kaukázus hegység környéke. Kedvelik a ligetes, fás, cserjékben gazdag élőhelyeket és a vízparti, nádasokkal borított területeket.", "Figyeld meg a rajzokon a két nem közötti különbségeket! A hím állat (kakas) tollazata díszes, farktollai hosszúak, a nőstény (tyúk) színe nem feltűnő, vörösesbarna. Testfelépítése a házi tyúkéhoz hasonló. Kapirgálólába és a magvak, rovarok felcsipegetésére alkalmas csőre van. A fácán feje és kapirgálólába", "Magvakkal, rovarokkal táplálkozik. Nappal jár tápláléka után. Az éjszakát biztonságosabb helyen, a fákon tölti. Fészkét a talajra, sűrű növényzet közé építi. 10-18 tojást is rak, melyekből közel egy hónap alatt kelnek ki a fészekhagyó fácáncsibék. Sok természetes ellenségük miatt a felnőttkort még a csibék fele sem éri el. A füves területek csúcsragadozó madara az ege részölyv. Vele már más állat nem táplálkozik, vagyis a táplálkozási lánc csúcsán áll. Gyakran megfigyelhetjük útszéli fákon, villanyoszlopokon ülve, ahol áldozata mozgását figyeli.", "Az egerészölyv 50 cm nagyságú", "Az őshonos füves területek és a mezők életközössége", "147"], ["Testfelépítése az erdő életközösségében megismert héjáéhoz hasonló. Horgas, hegyes csőre és erős fogólába van, amellyel a zsákmányát ragadja meg. A zsákmány megszerzését éles látása segít. Nappali ragadozó, főleg egereket, pockokat és énekesmadarakat zsákmányol. Megeszi a frissen elpusztult állatokat is. Az egerészölyv kiterpesztett szárnyaival vitorlázórepülésre képes. Ilyenkor a felszálló légáramlatok tartják a magasban. Jellegzetes mozgása a szitálórepülés is. Ekkor nagy magasságban, gyors előre-hátra irányuló szárnycsapásokkal szinte egy helyben áll. Szitálás közben folyamatosan figyeli a talaj felszínén, a járataiból előmerészkedő egereket, pockokat, hörcsögöket. Zuhanó repülésben csap le áldozatára. Közel 1 méter átmérőjű fészkét az erdőszéli fákra vagy az erdősávok magas fáira építi. A fészket több éven keresztül használja. 2-5 tojást rak, melyeket a hímmel felváltva költenek ki. A fészeklakó utódoknak mindkét szülő hordja az eleséget. Állandó madarunk.", "Az egerészölyv tépőcsőre és fogólába", "Az egerészölyv szárnyfesztávolsága 120 cm", "Az egerészölyv szitálórepülésre is képes", "A vörös vércse galamb nagyságú (30 cmes) ragadozó madár. Nevét tollazata színéről kapta. Fészkét az erdőszélek fáira vagy a füves területeken szigetszerűen elhelyezkedő fákra építi. Gyakori, hogy a vetési varjú elhagyott fészkét foglalja el, amelybe 5-6 tojást rak. Megtelepszik a lakott területeken is, fészkét a magas épületekre, templomtornyokra építi.", "A vörös vércse hímje", "148", "Az őshonos füves területek és a mezők életközössége", "A vörös vércse tépőcsőre és lába"], ["A vörös vércse kiválóan repül. Áldozatát többnyire szitálórepülés közben figyeli ki, és nagy sebességgel csap le rá. Főleg egerekkel, pockokkal, gyíkokkal, békákkal és rovarokkal táplálkozik. Télre Afrikába vagy Dél-Európába vo nul. A hazánkban télen is megfigyelhető vércsék a tőlünk északabbról érkező madarak.", "vércse", "barna rétihéja", "egerészölyv", "héja", "Ragadozó madaraink jellegzetes röpképei", "csúcsragadozó", "fog yas ztó k", "lebontó szervezetek", "                ", "Táplálkozási lánc a réten", "      ", "szetermel rve ő zete k", "A füves területek élőlényei között is táplálkozási kapcsolatok alakulnak ki. Ha mennyiségileg ábrázoljuk a táplálkozási kapcsolatokban részt vevő élőlényeket, akkor táplálkozá si piramist kapunk. A piramis alján vannak a legnagyobb egyedszámú és tömegű termelő szervezetek. A piramis csúcsa felé haladva az élőlények egyedszáma csökken.", "Táplálkozási piramis a füves területeken", "•K észíts táplálkozási láncokat a füves területek élőlényeiből! •F igyeld meg a rajzon a táplálkozási piramis felépítését!", "Ellenőrizd tudásodat!", "1. Indokold meg, miért fontosak a ragadozó állatok az életközösségekben! 2. Milyen összefüggés van a ragadozó madarak testfelépítése és zsákmányszerzése között? 3. Fogalmazd meg a vitorlázó-, a szitáló- és a zuhanórepülés lényegét! 4. Ismertesd, mivel táplálkozik az egerészölyv és a vörös vércse!", "Az őshonos füves területek és a mezők életközössége", "149"], ["Termesztett növényeink: a búza és a kukorica Hazánkban a legfőbb kenyérgabona-növény a búza. Átlagosan évente 1 millió hektárnyi területen termesztik. (Egy hektár 100 × 100 méteres, vagyis körülbelül egy futballpályányi terület.) Átlagos terméshozama hektáronként 5 tonna.", "Búza kalászvirágzat", "termő", "A búza szervezeti felépítése a réteknél megismert fűfélékhez hasonló. A bojtos mellékgyökérzete sűrűn behálózza a talajt. Szára belül üreges, melyet a szárcsomók, más néven az úgynevezett bütykök merevítenek, és függőlegesen tartják a növényt. Az ilyen típusú szárat szalmaszárnak nevezzük. Hosszú szárölelő levelei nyél nélkül kapcsolódnak a szárhoz. A levéllemezen nem látható főér, az erek egymás mellett párhuzamosan tollas bibe futnak.", "A hazánkban termesztett búzafajták többségét ős�toklász szel vetik el. Májusban fejlődik ki a kalászvirágzat. porzó A virágzatot alkotó virágok csupasz virágok, csak pelyva ivarlevelekből (porzókból és termőből) állnak. A porzót és A kalászka felépítése a termőt a toklász védi. 2-4 csupasz virág alkotja a kalászkát, melyet a pelyva véd. A kalászkák egy közös virágzati tengelyen ülnek, így együttesen a kalászvirágzatot alkotják. Tanulmányozd a kalászvirágzat részeit! Milyen részekből áll? A búza szervezeti felépítése", "150", "Az őshonos füves területek és a mezők életközössége"], ["Figyeld meg a rajzon a búza fejlődését! Melyik hónapban milyen szerve jelenik meg? maghéj", "sziklevél A búza fejlődése bugavirágzat", "bibe", "torzsavirágzat", "külső termésfal", "A búza szemtermésének részei", "Figyeld meg a rajzon a szemtermés részeit is! Miben különbözik a korábban megismert termésektől? A virágokat a szél porozza be. A megporzás után kialakul a szemtermés, amelyben a termésfal és maghéj összenőtt. A búzát nyár elején aratják. A szemtermést a malmokban megőrlik. Ennek első mozzanata, hogy a termésfalat leválasztják a búzaszemről. Ez a termék a korpa. A visszamaradott részt megőrlik, és ebből készül a liszt. A teljes kiőrlésű liszt azért barnás színű, mert a termésfalat és az alatta lévő magot együttesen őrlik meg. Az így kapott termékből készült élelmiszerek egészségesebbek, mivel sok rostanyagot és vitamint tartalmaznak. A kukorica szemtermése magas tápértékű, az állatok fontos takarmánynövénye. A silókukoricát zölden aratják le, és felaprítva etetik fel a szarvasmarhákkal. A silózás során az összeaprított kukoricát megerjesztik, és a téli időszakban használják fel. A kukoricát évente átlagosan 1 millió 200 ezer hektár szántóföldön termesztik. 1 hektárról átlagosan 7 tonna szemtermést takarítanak be.", "A kukorica gyökérzete és termése", "Az őshonos füves területek és a mezők életközössége", "151"], ["A kukorica mellékgyökérzete sűrűn elágazik, és mélyre hatol a talajban. A legalsó szárcsomóból koronagyökerek fejlődnek, amelyek oldalirányban támasztják a növényt. Levelei a búzához hasonlóan szárölelő levelek, erei párhuzamosan futnak. Szára fajtától függően különböző magasra nő. A korai érésűek 1-1,5 méter magasak, a silózásra termesztettek elérik a 3 métert is. porzós virágok", "szemtermés", "A szár csúcsán fejlődik ki a porzós virág zat. Az egyes virágok bugavirágzatba tömörülnek. A termős virágok a szár középső részén helyezkednek el, és torzsavirágzatot alkotnak. A virágzatot kívülről a buroklevelek védik. A virágzatból hosszan kinyúlnak a bibeszálak („kukoricahaj”), amelyek végén megtapadnak a porzós virágzatból kihulló virágporszemek. A virágporszemeket a szél szállítja a termős virágokra. Az olyan virágot, amelyben csak egyféle ivarlevelek fejlődnek, egyivarú virágnak nevezzük. Ha az egyivarú virágok egy növényen helyezkednek el, akkor egylaki a növény. Figyeld meg a tankönyv ábráin a kukorica szerveit!", "A kukorica szervei", "Ellenőrizd tudásodat!", "1. Ismertesd a búza szervezeti felépítését és az egyes szervek jellemzőit! 2. A tankönyv rajzának segítségével ismertesd a kalászvirágzat felépítését! 3. Mi a jellemző a szemtermésre? Miben különbözik a korábban megismert termésektől? 4. Hasonlítsd össze a búza és a kukorica szerveit! 5. Foglald mondatokba a következő fogalmakat: egyivarú, egylaki, termős virágzat, porzós virágzat!", "152", "Az őshonos füves területek és a mezők életközössége"], ["Termesztett növényeink: a napraforgó, a repce és a lucerna A napraforgó az élelmiszeripar fontos növénye. A termésében lévő mag igen magas olajtartalmú, étolaj és különféle margarinok készülnek belőle. 10 kg napraforgómagból 2,5-5 kg olaj préselhető ki. Hazánkban évente 5-600 ezer hektár területen termesztik, átlaghozama 2-3 tonna hektáronként. A napraforgó őshazája Közép-Amerika, Mexikó környéke. Európába dísznövényként hozták be a 16. században, a 19. századtól lett fontos ipari növény.", "A napraforgó fészekvirágzata", "A napraforgó csöves és nyelves virágai", "A napraforgó melegigényes növény. A szárazságot jól bírja, mivel főgyökérzete mélyen lehatol a talajba, oldalgyökerei dús hálózatot alkotnak. Tavasszal vetik el a magját, bő termésérleléséhez sok tápanyagot és meszes talajt kíván. Szármagassága fajtánként igen változó (1-3 méter). Nagy, főeres levelei nyéllel kapcsolódnak a szárhoz. A szár csúcsán a virágzati tengely tányérszerűen kiszélesedik. Ezeken ülnek a csöves virágok, amelyek együttesen fészekvirág zatot alkotnak. A csöves virágokban helyezkednek el a porzók és termők. A fészek szélén ülő nagy, sárga virágokat nyelves virá goknak nevezzük. Ezek meddő virágok, vagyis nincs bennük sem porzó, sem termő. A virágokat a rovarok porozzák be. A megporzás után a csöves virágok helyén kifejlődnek a kaszattermések. A szemterméstől eltérően a kaszatterméseknél a termésfal és a maghéj elválik egymástól. A napraforgó szervezeti felépítése", "Figyeld meg a tankönyv ábráin a napraforgó szervezeti felépítését és a fészekvirágzat részeit! Az őshonos füves területek és a mezők életközössége", "153"], ["Repceföld", "A repce szervezeti felépítése", "A repce a káposztafélékhez tartozik. Őshazája India, az Indus folyó völgye. Magas olajtartalmú magjáért termesztik (a magok olajtartalma 30-45%). Többnyire szeptemberben, évente 200-250 ezer hektár szántóföldet vetnek be repcemaggal. A magok ősszel kikelnek, és a friss hajtások áttelelnek, tavasszal indulnak fejlődésnek. Főgyökerük 2 méter mélyre is lehatol a talajba. Száruk elágazik („bokrosodik”), magasságuk fajtától függően 70-120 cm. Sárga virágaik fürtvirágzatot alkotnak. Az egyes virágok két-két sziromlevele egymással szemben helyezkedik el. Az ilyen virágot keresztes virágnak nevezzük. A virágok sok nektárt is termelnek. A rovarbeporzás után kialakulnak az 5-10 cm hosszúságú becőtermések, amelyekben sok apró mag van. A repcét június közepétől aratják le, 1 hektár föld átlaghozama 1,8 tonna mag. Hasonlítsd össze a rajzok alapján a repce és az elmúlt tanév során megismert fejes káposzta keresztes virágát és becőtermését! csészelevél", "mag becőtermés sziromlevél", "A repce becőtermése", "154", "A fejes káposzta keresztes virága és becőtermése", "Az őshonos füves területek és a mezők életközössége"], ["A mezőgazdaságban a kukoricán kívül még számos olyan növényt is termesztenek, amelyeket az állatok takarmányozására használnak fel. Ilyen például a zab, a takarmányrépa és -burgonya, a silókukorica, a lóhere és a lucerna. A lucerna a kukorica mellett a másik fontos takar mánynövényünk. Évente többször is lekaszálják. Frissen lekaszálva vagy szárítva (lucernaszéna, -liszt) etetik fel az állatokkal. Gyakran más növényekkel együtt silózzák is. Magas a tápértéke, különösen sok fehérjét tartalmaz, mely az állatok fejlődéséhez nélkülözhetetlen. Rostanyagai a kérődző állatok számára könnyen emészthetőek. 1 hektár lucernaföld 1-2 tonna zöld lucernát ad. Száraz területeken is jól termeszthető, mivel főgyökérzete akár 6 méter mélyre is lenyúlik a talajba. Így a mélyebb talajrétegekből is képes vizet felvenni. Lejtős dombvidékeken is gyakran telepítik, mert megvédi a talajt a víz romboló munkájától.", "pillangós virág összetett levél", "felcsavarodott hüvelytermés", "Évelő növény. A talajban lévő megvastagodott szára a tápanyagokat raktározó gyöktörzs. Ez áttelelő szerv is egyben, melynek rügyeiből minden tavasszal új, föld feletti hajtások fejlődnek. Oldalgyökerein apró kis gömbszerű csomók figyelhetők meg, ezek a gyökérgümők. A gümőkben a levegő nitrogénjét megkötő baktériumok élnek. A nitrogén a növények egyik tápanyaga, így a luA lucerna szervezeti felépítése cernaültetvények egyben hozzájárulnak a talaj termőképességének fokozásához is. A föld feletti hajtások elágaznak („elbokrosodnak”). A 40-100 cm magasra növő szárhoz kapcsolódnak az összetett levelek, egy levélnyélen három levél helyezkedik el. A virágok fürtvirágzatba tömörülnek. Az egyes virágok sziromlevelei pillangóra hasonlító módon helyezkednek el. A virágok beporzását a rovarok végzik. Hüvelytermése felcsavarodott házú csigára hasonlít.", "Ellenőrizd tudásodat!", "1. Ismertesd, milyen célból termesztjük a napraforgót, a repcét és a lucernát! 2. Mi a jellemző a három megismert növény gyökérzetére, szárára, leveleire, virágzatára és termésére? 3. Milyen összefüggés van egy növényzet gyökérzete és szárazságtűrése között? 4. Készíts rajzot a napraforgó egyszerű és a lucerna összetett leveléről!", "Az őshonos füves területek és a mezők életközössége", "155"], ["Megfigyelések, vizsgálatok a füves területeken A füves területek kialakulása és növényei • Figyeld meg a lakóhelyed környéki füves területet! Hogyan hasznosítják (kaszálják, legeltetnek)? Hogyan gondozzák? • Füves területen jelölj ki (spárga és négy leszúrt bot segítségével) egy 1 négyzetméteres területet! Számold meg, hány növény található benne! • Takard le bármely füves területen a növényeket egy nagyobb fóliával! Rövid időn belül a fólia talaj felé eső felszíne nedves lesz a fűfélék által elpárologtatott és a talajból kipárolgó víztől. • A tanteremben két cserépbe vess fűmagot! Rendszeresen öntözd! A kikelt növényekkel teli cserepeket tedd napfényes helyre! Az egyik cserép növényeit ollóval rendszeresen nyírd le, a másikat hagyd nőni és virágozni! Figyeld meg ezután a változásokat! • Ha van a lakóhelyed környékén nedves rét, figyeld meg természetes élőhelyén a réti boglárkát és a mocsári zsurlót! A mocsári zsurló nemcsak spórákkal, hanem a gyöktörzsével is szaporodik. A vízszintes irányba kúszó gyöktörzs behálózza a talajt, egyre nagyobb élőhelyet foglal el magának. A kúszó gyöktörzs rügyeiből új, föld feletti hajtások fejlődnek. • Figyeld meg a lakóhelyed környéki füves életközösséget! Ismerj meg eredeti élőhelyén minél több termelő és fogyasztó élőlényt! Határozókönyvek segítségével ismerd meg a leggyakoribb fajok nevét! Milyen emberi beavatkozásokat tapasztaltál a megfigyelt területen? Következtess a beavatkozások hatásaira!", "A fürge gyík és a vakond • Napos időben domboldalak, sziklás területek, terméskövekkel kirakott támfalak mentén kitartó figyelemmel és mozdulatlan testhelyzetben megfigyelheted a fürge gyík zsákmányszerzését. • A vakond csak ritkán kerül szemünk elé, de a mezőkön, füves területeken megfigyelheted a vakondtúrásokat. Ha sokat látsz belőle, az azt jelzi, hogy a talajban sok földigiliszta és rovar él.", "A mezei nyúl és a füves területek rágcsáló kisemlősei • A nyulak testfelépítését a házi nyúlon figyelheted meg. • Ha van a környékeden házinyúltenyésztő, érdeklődj, mivel eteti, hogyan gondozza őket! Milyen gyakran szaporodnak, hogyan gondozza az anyanyúl a kicsinyeit? • A learatott gabonaföldeken, füves területeken figyeld meg a pockok és a hörcsögök járatait! • A hörcsög járata mélyen fut, és meredeken lefelé megy a talajba. Bejáratánál, ha találsz friss földtúrást, növényi táplálékmaradványokat, akkor biztos lehetsz abban, hogy a járatnak van lakója.", "A füves területek ragadozó madarai •F igyeld meg a füves területeken az egerészölyveket! Milyen élőhelyeket kedvelnek? Hogyan mozognak? Az ölyvek – különösen a téli időszakban – jól megfigyelhetők az utakat szegélyező fákon. Nem zavarja őket az autóforgalommal járó zaj sem. Viselkedésük oka, hogy innen jól kifigyelhetik és könnyen zsákmányul ejthetik az úttesten átszaladó egereket, pockokat. A kisemlősöket az árokparton található egyre több élelemforrás (elszórt ételmaradékok, a teherautókról lepotyogó gabonaszemek stb.) csábítja az árokpartra. • Az ölyveket, vércséket jellegzetes hangjukról is felismerheted. Repüléskor a röpképük alapján tudod azonosítani őket. Ebben a tankönyv 149. oldalán található rajz is segít.", "156", "Az őshonos füves területek és a mezők életközössége"], ["Rendszerezzük ismereteinket! Az őshonos füves puszták kiala kulása. A füves területek növé nyei", "A mérsékelt éghajlati övezetben füves puszták ott alakultak ki, ahol az éves csapadék mennyisége 500 mm-nél kevesebb. Hazánkban ilyen területek a középhegységeink déli lábánál és az Alföld egyes részein találhatók. A másodlagos réteket az ember hozta létre az őshonos növények kiirtásával. A fűfélék közös jellemzői: mellékgyökérzet; üreges, el nem ágazó szár; szárölelő levelek, melyek erezete mellékeres. A száraz rétek jellegzetes növényei: az angolperje, a siskanád és a mezei zsálya. Nedves réteken él a réti boglárka és mocsári zsurló.", "Ízeltlábúak a fü ves területeken", "A füves területeken a leggyakoribb ízeltlábúak a sáskák, szöcskék és a tücskök. Túlszaporodásukat a természetes ellenségeik gátolják meg. Három pár ízelt lábuk és három testrészük van. A 3. pár lábuk erős ugróláb. Rágó szájszervük, két pár szárnyuk és összetett szemük van. Petékkel szaporodnak, fejlődésüket kifejlésnek nevezzük.", "A fürge gyík és a vakond", "A gyík testét száraz szarupikkelyek és szarupajzsok borítják. Növekedése során többször vedlik. Testhőmérséklete változó, a külső környezet hőmérsékletétől függ. Lábai gyengék, de hajlékony gerincoszlopa és erős izomzata segítségével gyorsan mozog. Tojásokkal szaporodik, melyeket a nap melege költ ki. A vakond testfelépítése és táplálkozása a föld alatti életmódhoz alkalmazkodott. Rovarevő fogazata van, mellső lába ásólábbá módosult. Téli álmot nem alszik.", "A mezei nyúl és a füves területek rágcsáló kisem lősei", "A mezei nyúl szemfogai hosszúak és élesek, a fogaknak nincs gyökerük, folyamatosan nőnek. Zápfogainak felülete redős, amiből növényevő életmódjára következtethetünk. Hátsó lába erős, izmos ugróláb. Évente háromszor is fiadzik, egyegy alkalommal 2-4 utódot hoz a világra. A mezei pocok és a hörcsög rágcsálófogazatú, főleg magvakkal táplálkoznak. Éjjel járnak táplálékuk után, a nappalt föld alatti járataikban töltik. A pockok különösen szaporák. Túlszaporodásukat természetes ellenségeik (róka, menyét, bagoly, ölyv) akadályozzák meg.", "Az őshonos füves területek és a mezők életközössége", "157"], ["158", "A fácán és a füves területek ragado zó madarai", "A fácán hazánkban nem őshonos, vadászati céllal telepítették meg. Kapirgálólába van, növényekkel, rovarokkal táplálkozik. A talajra fészkel. Az egerészölyv a füves területek csúcsragadozója, fontos szerepe van az életközösségben a termelő és a fogyasztó élőlények közötti egyensúly fenntartásában. Horgas tépőcsőre és fogólába van, mely hegyes karmokban végződik. Állandó madarunk. A vörös vércse galamb nagyságú ragadozó. Többnyire a varjak elhagyott fészkében költ. A telet Afrikában vagy Európa déli részén tölti. Táplálkozási piramist úgy kapunk, ha egyedszámuk és testtömegük alapján vizsgálunk egy életközösséget. A termelő szervezetek vannak a piramis alján, a piramis csúcsán a csúcsragadozó áll.", "Termesztett nö vényeink: a búza és a kukorica", "A búza a legfontosabb kenyérgabona-növényünk. Több fajtáját termesztik. Főbb jellemzői: mellékgyökérzet, üreges, bütykös szár, szárölelő levél, kalászvirágzat, amely 2-4 virágból álló kalászkákból tevődik össze. A virágokat a szél porozza be. A kukorica fontos takarmánynövény. Zölden learatva silótakarmányt készítenek belőle. Éretten a szemtermése fontos tápláléka a tenyésztett állatoknak. Porzós virágai a szár csúcsán bugavirágzatot alkotnak, a termős virágok torzsavirágzatba tömörülnek. Szélbeporzású, egylaki növény.", "Termesztett növényeink: a napraforgó, a repce és a lucerna", "A napraforgót a kaszattermésben lévő mag magas olajtartalmáért termesztjük. Magvetéssel szaporítják. Főgyökérzete van, a levelek nyéllel kapcsolódnak a szárhoz, főeresek. A szár csúcsán helyezkedik el a fészekvirágzat, amely kívül sárga színű, meddő nyelves virágokból és belül csöves virágokból áll. Rovarok porozzák be. A repce értékes növény, mivel az élelmiszeriparban a magjából olajat állítanak elő. Sárga színű keresztes virágai fürtvirágzatot alkotnak. Az éretten száraz becőtermésében helyezkednek el a magvak. A lucerna takarmánynövény. Frissen lekaszálva vagy megszárítva a háziállatok fehérjékben gazdag takarmánya. Száraz területeken is megél. Évelő, a talajban lévő gyöktörzse telel át.", "Az őshonos füves területek és a mezők életközössége"], ["VIZEK, VÍZPARTOK ÉLETKÖZÖSSÉGE", "Az őshonos füves területek és a mezők életközössége", "159"], ["A víz jelentősége. A vizek parányi élőlényei A Föld felszínének 3/4 részét víz borítja. A hatalmas víztömeg 97%-a az óceánokban, tengerekben lévő sós víz, 2%-a a sarkvidékeken és a gleccserekben jéggé fagyott állapotban van, és mindössze 1%-a található édesvíz formájában a folyókban és tavakban. Már tanultuk, hogy a víz a természetben állandó körforgást végez. A víz az élőlények nélkülözhetetlen testépítő anyaga, ezért a vízhiányt csak nagyon rövid ideig képesek elviselni. Az ember és az emlősállatok testtömegének közel 70%-a víz. A dinnye 90%-a, az almatermés 85%-a víz, de még a száraz magvakban és termésekben is találhatunk vizet (a dió magjában 8%, a búza szemtermésében 5% víz van).", "A víz kiváló oldószer. Természetes vizekben oldott állapotban megtalálhatók benne az élőlények számára fontos ásványi anyagok (nitrogén, foszfor, kálium stb.), a szén-dioxid és az oxigén is. A víz megléte vagy hiánya határt szab az élőlények elterjedésének. Gondoljunk arra, hogy a száraz, sivatagos területeken szinte alig van nyoma az életnek. A vizekben bővelkedő területeken azonban az élővilág gazdag és sokféle, vagyis a víz meghatározza az életközösségek összetételét. A tavakban, folyókban számos olyan élőlény van, amelyeket szabad szemmel nem tudunk megfigyelni. Testfelépítésük, mozgásuk, sajátos szervecskéik csak mikroszkóp segítségével vizsgálhatók. Egy liter vízben akár 10 ezer parányi élőlény is lehet, melyeket együttesen planktonok nak nevezzük. Közös jellemzőjük, hogy kedvező környezeti feltételek mellett gyors osztódásokkal szaporodnak. Hatalmas tömegük adja a vizek jellegzetes barnás vagy zöldes színét. Túlszaporodásuk („algavirágzás”) súlyos környezeti problémákat okoz. A vizekben káros anyagok szabadulnak fel (például kén-dioxid, metán), és oxigénhiány lép fel, amely az élőlények tömeges pusztulását okozza. A planktonok némely tagja önálló mozgásra is képes, de közös jellemzőjük a lebegő életmód. A lebegés feltétele, hogy a víz és az élőlény sűrűsége közel azonos legyen. A lebegő élőlényeket a víz sodorja, áramoltatja. Mindez kedvező a planktonoknak, mivel kis energiabefektetéssel sodródhatnak újabb területek felé. A víznél nagyobb sűrűségű planktonok folyamatosan lefelé süllyednek, majd különböző mozgásszervecskéikkel (csilló, ostor, evezőláb) újra Planktonok felfelé emelkednek. 160", "Vizek, vízpartok életközössége"], ["A lebegést segíti, hogy a planktonoknak a tömegükhöz képest nagy a testfelületük, ami meggátolja a lesüllyedést. Más fajok testében a víznél kisebb sűrűségű olajcsepp vagy légbuborék képződik, amely szintén megkönnyíti a vízben történő mozgást. A baktériumok csak mikroszkóppal látható élőlények. A vízben élők növényi törmelékekkel és állati maradványokkal táplálkoznak. Az összetett anyagokat egyszerűbb anyagokká bontják le, amelyekkel ismét a növények táplálkoznak. A vízben lévő baktériumok tehát az anyagok körforgását biztosítják. A baktériumok fontosak a vizek öntisztulásában is, mivel nemcsak az összetett anyagok maradványait, hanem a bemosódó szennyező anyagok egy részét is lebontják. A növényi planktonok a fényben gazdag vízrétegekben élnek. Vannak közöttük egysejtűek és többsejtű telepet alkotók is.", "A vízben élő parányi baktériumok az anyagok körforgását biztosítják", "A zöld szemesostoros moszat teste egyetlen sejtből áll. Os torának csapkodásával önálló mozgásra is képes. Jellegzetes szerve a fényérzékelő szemfolt. Törmelékekkel, baktériumokkal táplálkozik, melyet a sejtszájon keresztül vesz fel. Nappal a zöld színtesteiben, a vízben oldott szén-dioxid felhasználásával ös�szetett anyagokat képez. Mivel a növényekre és az állatokra is jellemző módon táplálkozik, feltételezik, hogy sok száz millió évvel ezelőtt az ostoros moszatokból alakultak ki a növények és az állatok.", "ostor szemfolt", "Az állati planktonok is nagyon sokfélék. A papucsállatkák tápanyagban gazdag vizekben élnek. Egyetlen sejtből állnak, de ez minden életműködést (mozgás, táplálkozás, emésztés, szaporodás) elvégez. A sejtet kívülről csillók borítják. Ezek összehangolt, hullámszerűen végigfutó mozgatásával, csavarvonalban haladnak előre. A sejtszájon keresztül veszik fel baktériumokból és törmelékekből álló táplálékukat. A felvett anyagok lebontása az emésztőűröcskében történik. A felesleges anyagokat a lüktetőűröcske választja ki.", "zöld színtest", "sejtszáj Zöld szemesostoros mikroszkópos felvétele és rajza", "sejtszáj", "emésztőűröcske", "csilló", "sejtmag", "A papucsállatka szaporodása", "lüktetőűröcske Papucsállatka mikroszkópos felvétele és rajza", "Vizek, vízpartok életközössége", "161"], ["Vízibolha", "A lebegő planktonok között óriásnak számítanak a közel fél centiméteres nagyságú vízibolhák. Az ízeltlábúak csoportján belül a rákok közé tartoznak. Elágazó csápjaik segítségével, szökdelésre emlékeztető mozgással hajtják magukat a vízben. Innen ered a vízibolha elnevezésük. A felmelegedő vizekben gyorsan szaporodnak, mivel ivartalanul (hím egyedek nélkül) is képesek a nőstények szaporodni. Ezt nevezzük szűznemzésnek.", "Az óriásamőba nem tartozik a planktonok közé, mivel a vizek aljzatán él. Közel fél mm nagyságú. Alakja változatos, mert mozgás közben állábakat fejleszt. Törmelékekből álló táplálékát bekebelezi. Figyeld meg a tankönyv rajzán az amőba mozgását és táplálkozását!", "Az óriásamőba bekebelezi a táplálékát", "Óriásamőba mikroszkópos felvétele", "A vizek parányi élőlényei a számukra kedvezőtlen környezeti változások (például a téli időszakban a vízhőmérséklet csökkenése vagy az élőhely kiszáradása) hatására ellenálló burokkal veszik magukat körbe, betokozódnak. Betokozódott állapotban hosszú hónapokig kibírják. Ha kedvezően változik a környezet, a tok fala feloldódik, és tovább élnek.", "Ellenőrizd tudásodat!", "1. Mi a jelentősége a víznek az élőlények életében? 2. Mi a feltétele a lebegésnek? Hogyan biztosítják az élőlények a lebegő életmódot? 3. Indokold meg, miért fontosak a baktériumok a vizek életében! 4. Magyarázd el, mik azok a planktonok! 5. Hogyan nevezzük a megismert növényi és állati planktonokat? Mi a jellemző a táplálkozásukra és a szaporodásukra?", "162", "Vizek, vízpartok életközössége"], ["Lágyszárúak a vízben és a vízparton A vízpartokon élő lágy és fás szárú növények fontosak a vízi életközösség számára. Megvédik a partot a víz romboló munkájától, és felfogják a part felől jövő szennyeződéseket. A bemosódó tápanyagokat saját testükbe építik, így meggátolják azok feldúsulását. A parti öv növényzete élő szűrőberendezésként működik. A vízi, vízparti növények oxigént juttatnak a környezetükbe, és sok állat számára táp lálékforrást is jelentenek. A növényzet egyben fészkelő- és búvóhelyet is biztosít, ezért a hinarasokban és a parti övben gazdag az állatvilág. A hinarasok a tápanyagban dús, sekély tavakban és a folyók iszapos öbleiben élnek. Az ide tartozó növények sokfélék. Közös tulajdonságuk, hogy az aljzatba gyökereznek vagy lebegnek. A gyökerezők szára, levele a víz alá merül, más fajoknál a levél a víz felszínén szétterül. Nappal sok oxigént termelnek, de éjszaka maguk is oxigénfogyasztók, ezért ha túlszaporodnak, oxigénhiányt okoznak. A fonalas zöldmosza tok (más néven békanyálmoszatok) a mohákhoz hasonlóan telepes felépí tésű növények. Sekély vizekben tömegesen elszaporodnak. A víz felszínén úsznak, vagy bevonatokat képeznek a köveken, vízi építményeken, csónakok alján, de megtelepednek a nád és gyékény szárán is. Gyökerük, száruk, levelük, viráguk nincs.", "A hínáros békaszőlő porzós virágzata", "A zöldmoszat telepes felépítésű", "Gyakori hínárféle a híná ros békaszőlő. Gyökérzete és módosult szára, a gyöktörzs az iszapban sűrű hálózatot alkot. A gyöktörzsből ered a szár, rajta fejlődnek a 3-4 cm hosszú levelek. A levélerek párhuzamosan futnak. Az egész növényből csak a zöldes színű porzós és a termős virágzat emelkedik a víz fölé. A beporzást az áramló víz végzi el. Vizek, vízpartok életközössége", "163"], ["A tündérrózsa és a vízitök is az iszapban gyökerezik, de viaszos bevonatú levelük a víz felszínén szétterül. A levegőt a levelek veszik fel, az üreges száron keresztül a gyöktörzshöz áramoltatják. Ha bőségesen van táplálék, rövid idő alatt az egész vízfelületet benövik. A tápanyagot a gyöktörzs tárolja, amelynek rügyeiből tavasszal az új növény fejlődik.", "Fehér tündérrózsa", "Az apró békalencse 1 cm nagyságú. Ös�szefüggő állománya helyenként teljesen ellepi a víz felszínét. Szára lencse alakú, szét terül a vízen, gyökérszál lóg belőle lefelé. Levele elcsökevényesedett, apró virágát a víz porozza be. Békalencse", "A közönséges nád a part felől 2 méteres vízmélységig is behatol. Mellékgyökérzetével és vastag, elágazó gyöktörzsével kapaszkodik az iszapba. A gyöktörzs rügyéből fejlődik a több méter magasra megnövő, belül üreges, bütykös, el nem ágazó szár. A szár igen erős, ellenáll a szélviharnak, a hullámzó víznek, a téli hóviharoknak. A párhuzamos erezetű levelek körbeölelik a szárat, a levél széle éles. Nyár végén fejlődik ki a bugavirágzata, amelyet a szél poroz be. Apró magvait a szél terjeszti. Nádas a tó partján", "164", "Vizek, vízpartok életközössége"], ["Az összefüggő vízparti nádasok nemcsak élőhelyet biztosítanak, hanem a partvédelemben is nélkülözhetetlenek. Meggátolják bizonyos tápanyagok (foszfor, nitrogén) feldúsulását, mivel ezeket felveszik, és saját testük anyagává alakítják át. A széleslevelű gyékény a náddal közös élőhelyen telepszik meg. Gyökérzete és gyöktörzse a nádéhoz hasonlít. Párhuzamos erezetű levelei a nádénál szélesebbek, vaskosabbak. Virágzati tengelye 2 méter hosszú is lehet, végén a torzsavirágzat ül (buzogánynak is nevezik). A torzsavirágzat felső részén a porzós, az alsón a termős virágok vannak. A beporzást és a repítőszőrös magvak terjesztését a szél végzi.", "A nád és a gyékény felépítése", "Gyékény", "Ellenőrizd tudásodat!", "1. Miért fontosak a vizek életközösségében a hinarasok és a parti öv növényei? 2. Mi a jellemző a hínáros békaszőlő, a békalencse és fonalas zöldmoszat testfelépítésére? 3. Miért hívhatjuk a parti öv növényeit élő szűrőberendezésnek? 4. Hasonlítsd össze a nád és a gyékény felépítését!", "Vizek, vízpartok életközössége", "165"], ["A ligeterdők és a vízparti fák A ligeterdők a folyók mentén, időszakosan vízzel borított ártereken alakultak ki. A folyószabályozások előtt hazánkban még nagy területet foglaltak el. Mára a folyókat gátak közé szorították, az árterek területe lecsökkent, az ártéri erdők csak kisebb területeken maradtak fenn. Jellegzetes fafajai a nyár- és a fűzfafélék. Dombvidékeken a folyóvizeket égerligeterdők övezik. A folyók és a ligeterdők között szoros kapcsolat alakult ki. Élőviláguk elválaszthatatlan egymástól, és kölcsönösen hatnak egymás életére.", "Ártéri erdő", "Néhány példa a folyó és a ligeterdő kapcsolatára: • A vízzel elöntött területeken a sekély víz gyorsan felmelegszik. Ez kedvező feltételeket teremt a planktonok, az ízeltlábúak, a halak és a kétéltűek szaporodásához. A petékből, ikrákból kikelt ivadé kok bőséges táplálékhoz jutnak, így gyorsan fejlődnek. A folyóvíz apadásakor már megerősödve kerülnek vissza a folyóba. A víz visszahúzódásával sok oldott tápanyag és táplálék (növényi és állati törmelékek, férgek, csigák, különböző rovarok és lárváik) sodródik a folyókba. Az oldott tápanyagokat a vízinövények hasznosítják, az állati táplálékokat a planktonok, a vízben élő rovarok, a csigák, a kagylók és a halak fogyasztják. • Nagy folyóink régi halbőségét az árterek és folyók természetes kapcsolata biztosította. Napjainkban a természetvédelem egyik feladata, hogy megőrizze a fennmaradt ártéri erdőket. Több helyütt a régi ártéri élőhelyek visszaállítását végzik. • A kiöntött folyók az árterekre sok növényi tápanyagot raknak le. Ezért az ártéri erdők fái gyorsan nőnek, aljnövényzetük gazdag, sok helyütt áthatolhatatlanul dús. Gyakoriak a fákra felkúszó növények, amelyek a fák törzsén fejlesztik ki levélzetüket. Ilyen például az iszalag, a ligeti szőlő, a komló, a nagy szulák. • A vízparti növényzet megvédi a partot a víz romboló munkájától, a hullámveréstől és a partfal elmosásától. A gyökeres, alámosott partszakaszok búvóhelyet biztosítanak az állatoknak. Számos ragadozó hal (lesőharcsa, sügér, süllő) ezeket az élőhelyeket leshelyként használja. A növényi részek között megbújva ragadják meg áldozatukat.", "166", "Vizek, vízpartok életközössége"], ["A folyókat, tavakat szegélyező fák, cserjék árnyékot vetnek a vízre, így a meleg nyári napokon megakadályozzák a víz felmelegedését. Szeles időben a fákról, cserjékről sok rovar hull a vízbe. Egyes halfajok (pisztráng, domolykó) testfelépítése és életmódja e táplálékforrás kihasználásához alkalmazkodott. A ligeterdők és parti öv jellegzetes növényei a fűzfák. Több fajuk van, lombkoronájuk terebélyes. Kora tavasszal virágoznak, egy-egy fán csak egyféle ivarú virágok fejlődnek. Az egyik fán csak porzós, a másikon csak termős virágok, amelyek rövid nyélen ülve együttesen barkavirágzatot alkotnak. Mivel a termős és porzós virágok két különböző növényen helyezkednek el, a fűz kétla ki növény. A fűz porzós virágzata", "A fűz virágai édes váladékot, nektárt termelnek, ezért a rovarok tömegesen látogatják őket. A nektár szívása közben a testükre tapadt virágport átviszik a termős barkákra, így elvégzik a beporzást. A beporzás után a virág termőjéből finom szőrökkel borított toktermés fejlődik. A fűz termése a repítőszőrökkel", "A fűz hajtásai gyorsan növekednek, rajtuk lándzsa alakú, főeres levelek vannak. Fája puhafa, nem tartós, egy 20-30 éves fűzfa törzse már korhadni kezd. (A tölgy és bükk ebben a korban indul erőteljes fejlődésnek.) Fennmaradása nincs veszélyben, mivel nagy a megújulási képessége. Gyökér- és tősarjakból, letört ágdarabokból gyorsan új fák fejlődnek. A nyárfáknak is több fajuk van. Ezek a fák is lombfakadás előtt virágoznak, kétlaki, szélbeporzású nö vények. Toktermésükhöz vattaszerű repítőszőrök tapadnak, ezek segítik elterjedésüket. Mivel gyorsan növekednek, egyes fajaikat sokfelé telepítik. A papírgyártás számára értékes nyersanyagot adnak. Jegenyenyár", "Vizek, vízpartok életközössége", "167"], ["porzós virágzat Égerfa", "termős virágzat", "Az enyves éger egylaki növény, virágai egyivarúak", "A láperdők tartósan vízzel borított területeken alakultak ki, például a folyók feltöltődő holtágai mentén, vizes mélyedésekben, tőzeges talajjal borított területeken. A láperdők jellegzetes fája az enyves éger, amelynek lombkoronája 20 méter magasra nő. A nedves talajszinten mohák, páfrányok és sásfajok élnek.", "Ellenőrizd tudásodat!", "1. Hol helyezkednek el a ligeterdők? 2. Mondj példákat a folyók és ligeterdők kapcsolatára! 3. Mi a jelentősége a folyók partján található növényzetnek? Mondj példákat! 4. Mi a jellemző a fűzfákra és a nyárfákra? 5. Magyarázd meg a következő fogalmakat: kétlaki növény, egyivarú virág, kétivarú virág!", "Égeres láperdő", "168", "Vizek, vízpartok életközössége"], ["Az orvosi pióca. Csigák és kagylók a vízben Az orvosi pióca régen a népi gyógyászatban is használatos állat volt, innen származik az elnevezése. Vérszívásával a magas vérnyomást és az ízületi gyulladásos betegeket kezelték. Nyála véralvadásgátló anyagot tartalmaz, ami megakadályozza, hogy a szervezetben vérrög képződjön. Napjainkban már a gyógyszergyárakban kémiai úton állítják elő a véralvadásgátló gyógyszereket. A piócák kedvelt élőhelye a dús növényzetű, iszapos fenekű tavakban és a lassan áramló folyószaka szokon van. A kifejlett állat 15 cm hosszú, kültakarója barnászöld, hátoldalán két narancssárga sáv húzódik.", "Az orvosi piócával történő vérszívást régen a népi gyógyászatban használták", "A földigilisztához hasonlóan kültakarója bőrizom tömlő, amely egyben a mozgásszerve is. A bőrizom tömlő izmai összehúzódásra (megrövidülésre) és elernyedésre (megnyúlásra) képesek. Ez biztosítja az aljzaton a jellegzetes féregmozgást. A vízben testének hullámszerű mozgatásával úszni is képes. Figyeld meg a rajzon a pióca úszását és jellegzetes féregmozgását! Nyálkás kültakaróján keresztül veszi fel az oxigént és adja le a szén-dioxidot, tehát a kültakarója egyben légzőszerv is. Táplálkozása alapján élősködő. A vízben élő vagy a vízre inni járó gerinces állatok vérét szívja. Az élősködő életmód abban különbözik a ragadozástól, hogy az élősködés nem jár együtt a táplálékállat pusztulásával. Az orvosi pióca mellső, keskenyebb feji részén helyezkedik el a szívókorong, hátsó részén a tapadóko rong. Az áldozatán ezek segítségével rögzül. A szájüregében fogazott, Y alakú állkapcsaival sebet ejt, majd a kicsorgó vért felszívja. A nyálában lévő véralvadásgátló anyag megakadályozza, hogy a seb elzáródjon, így a vér folyamatosan szivárog. Testtömegénél ötször több vért képes felszívni, melyet a bélcsatornájában tárol.", "A pióca mozgásformái: úszás, araszoló mozgás", "Az orvosi pióca gerincesek vérével táplálkozik", "Vizek, vízpartok életközössége", "169"], ["Szeme nincs, a testén szórtan fényérzékelő pontszemek vannak, amelyekkel csak a fényt és a sötétséget érzékeli. Hímnős állat. Egyes testszelvényében hímivarsejtek, másokban petesejtek képződnek. Párzáskor két pióca összetapad, és kölcsönösen kicserélik egymás ivarsejtjeit. A megtermékenyített petesejtből képződő petéket a parti öv talajába rakja le. A petékből a következő év tavaszán bújnak elő a kis piócák. Átalakulás nélkül érik el a kifejlett állapotot. A szárazföldön élő éticsigáról már az 5. évfolyamon tanultunk. Az álló- és folyóvizekben is számos csigafaj él. Legnagyobb közülük a nagy mocsári csiga, melynek csúcsban végződő háza 6 cm-es. A vízi növényzeten és a köveken vékony rétegben megtelepedő moszatokkal táplálkozik. Az éticsigához hasonlóan haslába van. külső meszes váz köpeny", "szív", "tüdő", "ivarszerv", "tapogatók bélcsatorna szájnyílás", "A nagy mocsári csiga", "hasláb", "A csiga szervei", "Kezdetleges tüdővel lélegzik, amely a köpenyének erekben gazdag része. Amikor lélegzik, a növényzeten a víz felszínére mászik. Mivel a légkörből veszi fel az oxigént, oxigénben szegény, eliszaposodó állóvizekben is megél. Szaporodáskor nagyjából 200 darab nyálkás burokkal körülvett petét rak. Az utódok egy hónap múlva bújnak ki a petékből, és átalakulás nélkül fejlődnek. A vizekben számos kagylófaj él. A csigákhoz hasonlóan külső meszes vázuk van, de a meszes váz két egyforma nagyságú héjból (más néven kagylóteknőből) áll. A meszes vázát a köpeny választja ki, amelynek felszíkülső ni részén helyezkednek el a mésztermelő meszes váz köpeny mirigysejtek. A héjakat két záróizom fogja össze. A csigáktól eltérően a kagylóknak szájnyílás nincs fejük.", "kopoltyú tolóláb A tavi kagyló testfelépítése", "170", "Vizek, vízpartok életközössége", "A tavi kagyló vízi növényzetben gazdag, iszapos tavakban és folyókban él. 20 cm hosszú és 10 cm széles is lehet a héja. Mozgáskor a záróizmok elernyednek, és kitolja az ék alakú tolólábát, amellyel lassan halad az aljzaton."], ["Táplálkozása és légzése összekapcsolódik. A héj keskenyebb végénél van a bevezető nyílás. Itt áramlik be a víz és a benne lévő törmelékek, apró állatok. A beáramlást a nyílás környékén lévő csillók segítik. A kopoltyú nemcsak felveszi a vízből az oxigént, hanem kiszűri a táplálékot, amelyet aztán a bélcsatornájában megemészt. A víz a bevezető nyílás felett elhelyezkedő kivezető nyíláson át távozik. Szaporodásakor a petéi a kopoltyúlemezek között lárvákká alakulnak. A lárvák a kivezető nyíláson át kilökődnek, és a halak kopoltyúlemezein, majd az úszóikon fejlődnek tovább. Élősködő, a halak testnedveivel táplálkozik. A kifejlődött kagyló elhagyja a gazdaállatot, és az aljzatra süllyedve él tovább.", "A tavi kagyló táplálkozása", "A vándorkagyló 2-4 cm nagyságú, őshazája a Fekete-tenger. Vízi járműveken megtapadva ma már Európa minden álló- és folyóvizében elterjedt. A Balatonba 1932-ben egy uszály közvetítésével jutott el. A haslábaiban képződött rögzítőfonalakkal megtapad minden arra alkalmas helyen (vízinövényeken, kagylókon, a parti kövezéseken, vízi járműveken). Helyhez kötött az életmódja, táplálkozáskor – a tavi kagylóhoz hasonlóan – folyamatosan szűri a vizet. Egyetlen vándorkagyló naponta 2-3 dl vizet szűr át. Petékkel szaporodik, melyekből a kikelt lárvák szabadon úsznak a vízben, és a plankton élőlényeivel táplálkoznak.", "A csigáknak, kagylóknak nagy jelentőségük van a vizek életközösségében. Számos állatnak természetes táplálékul szolgálnak. A törmelékeket szűrő életmódjukkal pedig hozzájárulnak a vizek öntisztulásához. Számítások szerint a Balatonban élő csigák, kagylók, vízibolhák és planktont alkotó élőlények 15 naponként a teljes vízmennyiséget átszűrik.", "Ellenőrizd tudásodat!", "1. Mi jellemző az orvosi pióca testfelépítésére, mozgására és életmódjára? 2. Hasonlítsd össze a ragadozó és az élősködő életmódot! 3. Ismertesd, hogyan szaporodnak és fejlődnek a piócák, a megismert csigafajok, a tavi kagyló és a vándorkagyló! 4. Melyek a csigák és a kagylók közös tulajdonságai? 5. Indokold meg, miért fontosak a planktonok, a csigák és a kagylók a vizek életközösségében!", "Vizek, vízpartok életközössége", "171"], ["Ízeltlábúak a vízben és a vízparton Hideg vizű tavakban, tiszta vizű folyókban, patakokban él a folyami rák. Főleg rovarokkal, csigákkal, apró halakkal, békalárvákkal és elhullott állatokkal táplálkozik. A vizek szennyezése miatt egyedszáma igen lecsökkent. További veszélyt jelent az őshonos rákokra, hogy az utóbbi években megtelepedett a hazai vizekben az amerikai folyami rák, más néven a jelzőrák. Nemcsak az élőhelyükről szorítja ki az őshonos rákokat, hanem egy veszélyes fertőző betegséget is terjeszt (rákpestis), amivel szemben önmaga védett, de a hazai fajok nem. A folyami rák testfelépítése", "A folyami rák az ízeltlábúak közé tartozik. 5 pár ízelt lába közül az első pár ollóvá módosult. Ez a zsákmányszerző és védekező fegyvere. A fej és a potroh szelvényei összenőttek, együttesen a fejtort alkotják. Potroha – az orvosi piócáéhoz hasonlóan – gyűrű formájú szelvényekből áll. A potroh végén szétterpeszthető farki lemezek vannak, melyek gyors befelé történő mozgatásával hátrafelé úszik. Kültakarója a cserebogáréhoz és a szarvasbogáréhoz hasonlóan kitines, melybe mésztartalmú vegyület rakódik. Ettől kültakarója igen szilárd és kemény lesz, ez a kitinpáncél. Fején két pár csáp van, melyek tapogató- és szaglószervek. Összetett szemei rövid nyélen ülnek. A fejtor páncéljai alatt helyezkedik el a légzőszerve, a kopoltyú, amellyel a vízben oldott oxigént veszi fel. Figyeld meg a tankönyv ábráin a folyami rák testfelépítését! A folyami rák petékkel szaporodik. A peték a potrohlábakhoz tapadnak, így azok védve vannak a ragadozóktól. Egy évig hordozza a petéket, amelyekből apró rákok bújnak elő. A rákok növekedésük során többször vedlenek. 172", "Vizek, vízpartok életközössége", "A folyami rák feje és tora összenőtt"], ["A szitakötőknek sok fajuk van. Közös jellemzőjük, hogy ragadozók. Repülő rovarokkal – legyekkel, szúnyogokkal, lepkékkel – táplálkoznak. Áldozatukat a levegőben, az első pár lábukkal fogják el. Erős rágóikkal felaprítják, és a levegőben el is fogyasztják őket. Két pár hártyás szárnyukkal kiválóan repülnek. Gyorsan cikáznak, lecsapnak, egy helyben lebegnek, majd hirtelen eltűnnek a szemünk elől.", "Közönséges acsa", "A változatos mozgásokat a torban lévő szárnymozgató izmok működése biztosítja. A fej mozgathatóan kapcsolódik a torhoz, rajta két hatalmas összetett szem van, így minden irányba jól és éles képet látnak. A párzás után a petesejtekből kialakulnak a peték, melyeket a nőstény a vízbe rak le. A petékből kikelt lárvák a vízben élnek, a potroh végén elhelyezkedő külső kopoltyúval lélegeznek. A növényzet közé rejtőzködve apró rovarokra, halivadékokra, békalárvákra vadásznak. Áldozatukat az alsó ajkukból képződött fogókészülékkel, az álarccal ragadják meg. Figyeld meg a tankönyv képein a szitakötő testfelépítését és az álarc működését!", "lárva", "kifejlett rovar", "pete vedlés", "A szitakötő szervezeti felépítése", "A szitakötőlárva álarcának működése", "A lárvák 2-3 évig fejlődnek a vízben. Fejlődésükben nincs bábállapot. Az utolsó vedlésük előtt egy vízinövényen a felszínre másznak. Itt ismét vedlenek, és a levetett bőr alól szárnyas szitakötők bújnak ki. Ezt a fejlődést átváltozásnak nevezzük.", "A szitakötő fejlődése", "Vizek, vízpartok életközössége", "173"], ["A vizes élőhelyeken sok szúnyogfaj is él. Közülük a gyötrőszúnyog az embernek is sok kellemetlenséget okoz. Kifejlett példányai közül a nőstények vérszívók. Szúró-szívó szájszervükkel átszúrják a bőrt, és a hajszálerekből vért szívnak. Vérszívás után fejlődnek ki ivarszervükben a peték, melyeket a víz felszínére raknak le. A kikelt lárvák lebegnek a vízben, de légzéskor a víz felszínéhez közel úsznak. Kitolják a légcsövüket, és így lélegeznek. Apró élőlényekkel és törmelékekkel táplálkoznak. A lárvákból kikelt bábok is képesek mozogni, majd kifejlett szúnyogokká alakulnak. Fejlődésük teljes átalakulás. Figyeld meg az ábrákon a gyötrőszúnyog fejlődését és a szúró-szívó szájszervét!", "pete", "lárva", "báb", "A gyötrőszúnyog teljes átalakulással fejlődik", "Közönséges gyötrőszúnyog és szájszerve", "A szúnyog is – akárcsak a korábban megismert káposztalepke, almamoly, burgonyabogár, cserebogár és szarvasbogár – a rovarok közé tartozik. Három testrésze és három pár ízelt lába van. A toron egy pár hártyás szárny helyezkedik el. A második pár szárnya a házilégyéhez hasonlóan elcsökevényesedett, kis méretű szervvé módosult, és a levegőben való mozgást (egyensúlyozás) segíti. A különböző szúnyogfajoknak is fontos szerepük van a vizek, vízpartok életközösségé ben. A lárvák nélkülözhetetlen táplálékállatai például a halaknak, békáknak. A vizek öntisztulásához is hozzájárulnak, mivel a lárvák nagy mennyiségben fogyasztják a növényi és állati eredetű törmelékeket. Ha ezek a törmelékek a vízben felhalmozódnának, káros folyamatok indulnának el az életközösségében. Ilyen például a tápanyag-feldú sulás. Ezért helytelen csak az ember szempontjából megítélni a szúnyogokat. A vegyszeres szúnyogirtás káros beavatkozás a természetes vizek életébe.", "Ellenőrizd tudásodat!", "1. Ismertesd a folyami rák testfelépítését és szaporodását! 2. Mely tulajdonságokban hasonlít a szitakötő és a szúnyog testfelépítése? 3. Mi a különbség a szitakötő és a szúnyog fejlődése között? 4. Indokold meg a szúnyogok jelentőségét a vizek életében!", "174", "Vizek, vízpartok életközössége"], ["A hazai vizekben élő halak Az álló- és folyóvizekben mások a környezeti feltételek, mint a szárazföldön. A folyók és tavak is különböznek azonban egymástól, más-más életfeltételeket biztosítanak. Eltérő például a vizek mélysége, a meder aljzata, a víz áramlása és hőmérséklete, a víz tisztasága, átlátszósága, a benne oldott tápanyagok és az oldott oxigén mennyisége. Ezek együttesen az élettelen környezeti feltételeket jelentik. A különböző halfajok testfelépítésükkel és életmódjukkal alkalmazkodtak a vizes élőhelyek sajátos feltételeihez. A fejes domolykó és a sebes pisztráng például a tiszta vizű, gyors folyású, oxigénben gazdag folyóvizekben él. Testük áramvonalas, így kisebb ellenállással tudnak mozogni. Mivel élőhelyükön kevés a táplálék, a vízre hulló rovarokkal, bemosódó apró állatokkal táplálkoznak. A keszegfélék, a kárászok és a pontyok az iszapos fenekű, gyorsan felmelegedő, tápanyagban gazdag állóvizeket kedvelik. Elviselik a víz alacsonyabb oxigénszintjét is. Vízinövényekkel és az iszapban élő apró állatokkal táplálkoznak. A különböző halfajok más-más élőhelyeket foglalnak el", "A tőponty álló- és folyóvizeink gyakori halfaja. Nemesített változatát (tükörponty) a halgazdaságokban is nagy mennyiségben tenyésztik. Kedvező táplálkozási körülmények között testtömege 3 év alatt eléri az 1-1,5 kg-ot. Természetes környezetben ennél sokkal lassabban fejlődik, de egyes élőhelyeken nem ritkák a 20-25 kg-os példányok sem. A tőponty teste oldalról lapított, fejre, törzsre és farokra tagolódik. Belső szilárdító váza a gerincoszlop, amely csigolyákból tevődik össze.", "A hal csontváza", "Vizek, vízpartok életközössége", "175"], ["Kültakarója egymást szorosan fedő pikkelyekből áll. A pikkelyek a bőrében lévő mirigyek váladékától síkosak, nyálkásak. A nyálkabevonat megkönnyíti a mozgást (csökkenti a súrlódást), és védelmet biztosít a vízben lévő kórokozó gombákkal szemben. Fő mozgásszerve a farokúszó. A többi páros (mell- és hasúszó) és páratlan úszó (farok alatti és hátúszó) a testhelyzet megtartásában és az irányváltoztatásban fontos. A ponty és még sok más halfaj sajátos szerve az úszóhólyag. Ebben levegő van, melynek mennyiségét a hal képes szabályozni, így változtatni tudja testének sűrűségét is. Ez a le- és felfelé való mozgást könnyíti meg. Figyeld meg a tankönyv rajzain a ponty testrészeit, a belső csontos vázát!", "fej", "törzs", "farok", "szív úszóhólyag", "bélcsatorna A hal úszói és belső szervei", "Kopoltyúval lélegzik, amelynek sűrű érhálózata felveszi a vízből az oxigént, és leadja a szervezetében keletkező szén-dioxidot. A kopoltyúkat a kopoltyúfedő védi. A belégzés során száját kinyitja, így vizet áramoltat a kopoltyúlemezekhez. Kilégzéskor összezárja a száját, és a kopoltyúfedél felemelésével távozik a víz. Testhőmérséklete változó, azaz megegyezik a víz hőmérsékletével. Tanulmányozd a rajzon légzés folyamatát!", "A hal kopoltyúja", "A ponty légzése. A szájon át beáramló víz a kopoltyúfedő hátsó pereménél távozik", "A tőponty és a keszegfélék mindenevők. Harmonikaszerűen kinyitható szájukkal az iszapból kitúrják a férgeket, rovarlárvákat, elfogyasztják a kisebb csigákat, kagylókat és a vízi növényzet friss hajtásait és terméseit. A halak sajátos érzékszerve az oldalvonal, amellyel a víz áramlását, rezgéseit fogják fel. Ez segíti őket a tájékozódásban és a ragadozók mozgásának érzékelésében. A téli hónapokban a meder legmélyebb részein csapatosan elvermelnek. Életműkö désük (légzés, szívműködés) lelassul, nem is táplálkoznak. A nőstény nyár elején 500-700 ezer ikrát rak le, melyeket aztán a hím ivarsejtjeivel megtermékenyít. Az ikrákból közvetlenül fejlődnek ki a halivadékok. A nagy mennyiségű ikrából csak kevés éri meg a kifejlett kort, mivel sok természetes ellenségük van. 176", "Vizek, vízpartok életközössége"], ["A dévérkeszeg a ponty rokona. A ponttyal azonos élőhelyen él, és hasonló módon táplálkozik. Növekedése azonban lényegesen lassúbb, a húsa is szálkásabb. A fogassüllő az egyik legértékesebb hazai halfajunk. Ragadozó, kisebb halakkal táplálkozik, de zsákmányul ejti kisebb fajtársait is.", "Dévérkeszeg", "Süllő", "Tavaink és folyóink csúcsragadozója a lesőharcsa. Nem ritkák a 100 kg tömegű példányok sem. Bőre csupasz, nem fedik pikkelyek. Széles szájában sok száz tűhegyes, befelé hajló fog van, melyekkel a zsákmányát megragadja. Éjszakai ragadozó, a nappalt búvóhelyén, a meder üregeiben, kidőlt fák közé bújva tölti. Főleg halakkal, békákkal, vízimadarakkal táplálkozik, de elfogyasztja a dögöket is.", "A harcsa szájában lévő fogak", "Lesőharcsa", "Ellenőrizd tudásodat!", "1. Ismertesd, milyen környezeti feltételekhez kell alkalmazkodniuk a halaknak! 2. Mutasd be a tőponty testfelépítését! Mely szervei segítik a mozgásban? 3. Miben különbözik a ponty és a lesőharcsa testfelépítése és életmódja?", "Vizek, vízpartok életközössége", "177"], ["Békák a vízben és a vízparton A vizes élőhelyek környezetében számos békafaj is él. Közülük a leggyakoribb a közel 10 cm nagyságú kecskebéka. Kültakarója a bőrében lévő mirigyek váladékától nyálkás. Csupasz bőrének színe rejtőszín, így a mozdulatlan béka jól beleolvad a környezetébe. Négy végtagja közül a hátsó pár láb erős ugróláb. A vízben jól úszik, amit az ujjai között kifeszülő úszóhártyák segítenek. Egyszerű felépítésű tüdővel lélegzik, a légzésben a bőr is részt vesz. A békák életmódja ragadozó. A kecskebéka mozdulatlan testhelyzetben, lesből szerzi meg táplálékát, amely legyekből, szúnyogokból, szitakötőkből, férgekből, csigákból tevődik össze. A zsákmányát kicsapható nyelvével fogja el, majd rágás nélkül lenyeli. Gyakran a kisebb fajtársait is elfogja.", "peték lárvák", "Kecskebéka", "A békák kicsapható nyelvükkel fogják meg áldozatukat", "Úszóhártyás láb", "Testhőmérséklete a halakéhoz hasonlóan változó. Ősszel beássa magát az iszapba, és téli álmot alszik. Ilyenkor életműködései szinte teljesen leállnak. A téli álomból kora tavasszal ébred. Figyeld meg az ábrán a kecskebéka fejlődését! Petékkel szaporodik, melyeket a hím az anyaállat testén kívül termékenyít meg. Ezt nevezzük külső megtermékenyítésnek. A petéket kocsonyás burok veszi körül, amely nemcsak védelmet biztosít, hanem a petékből kikelő lárvák első tápláléka is.", "A békák szaporodása", "178", "Vizek, vízpartok életközössége"], ["A lárvák a vízben élnek, külső kopoltyúval lélegeznek, és planktonokkal táplálkoznak. Sokkal inkább hasonlítanak a halakra, mint a kifejlett békára, ezért ebihalnak is nevezik őket. Átalakulásos fejlődésük során először a hátsó, aztán a mellső végtagjuk nő ki, majd a farkuk és a külső kopoltyújuk visszafejlődik. A kopoltyús légzést felváltja a tüdővel és a bőrön keresztül történő légzés. A kifejlett kecskebéka elhagyja a vizet, de mindig annak körn
