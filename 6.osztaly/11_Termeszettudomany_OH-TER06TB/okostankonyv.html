<script>
const OLDALAK=[[], [], ["TERMÉSZETTUDOMÁNY 6. tankönyv a 6. évfolyam számára", "OKTATÁSI HIVATAL"], ["A kiadvány 2021. 01. 28-tól 2026. 08. 31-ig tankönyvi engedélyt kapott a TKV/96-7/2021. számú határozattal. A kiadvány megfelel a Nemzeti alaptanterv kiadásáról, bevezetéséről és alkalmazásáról szóló 110/2012. (VI. 4.) Korm. rendelet alapján készült, 2020. 01. 31. után kiadott, 5–8. évfolyam Természettudomány tantárgy kerettantervének. A tankönyvvé nyilvánítási eljárásban közreműködő szakértő: Bódis Bertalan Tananyagfejlesztők: Horváth Miklós (Érdemes tankönyvíró), Molnár László, Szentirmainé Brecsok Mária Kerettantervi szakértő: dr. Angyal Zsuzsanna Szerkesztő: Vitéz Annamária Fedélfotó: ©Shutterstock Tipográfia: KajtArt Kft. Illusztrációk: Guzmits István, Megyeri Katalin, Benedek Virág, Jécsai Zoltán, Muszka Máté Gergely, Nagy Áron (Stiefel), Nagy Zsófia, Titz Noémi Fotók: Guzmits Viktória, Magisztérium LMG Kft./Szentirmainé Brecsok Mária, Molnár László, © Shutterstock, OH-képtár, Magyar Nemzeti Múzeum, Országalbum, MTI, Bio Garancia Kft., Herman Ottó Múzeum, Wikipédia A tankönyv szerkesztői ezúton is köszönetet mondanak azoknak az íróknak, költőknek, képzőművészeknek, akiknek alkotásai tankönyveinket gazdagítják.", "© Oktatási Hivatal, 2021 ISBN 978-615-6178-98-5 Oktatási Hivatal 1055 Budapest, Szalay u. 10–14. Tel.: (+36-1) 374-2100 E-mail: tankonyv@oh.gov.hu A kiadásért felel: Brassói Sándor elnök Raktári szám: OH-TER06TB Tankönyvkiadási osztályvezető: Horváth Zoltán Ákos • Műszaki szerkesztő: Kurucz Klára, Fazekas Julianna Grafikai szerkesztő: Gajda Szilvia Mónika • Nyomdai előkészítés: WOW Stúdió (KL) Terjedelem: 19,3 (A/5) ív • Tömeg: 375 gramm • 1. kiadás, 2025 A könyvben felhasználtuk a Természetismeret 6. tankönyv a 6. évfolyam számára című művet. Raktári szám: AP-061009 • Szerzők: Horváth Miklós (Érdemes tankönyvíró), Molnár László, Szentirmainé Brecsok Mária Ez a tankönyv a Széchenyi 2020 Emberi Erőforrás Fejlesztési Operatív Program EFOP-3.2.2-VEKOP-15-2016-00001 számú, „A köznevelés tartalmi szabályozóinak megfelelő tankönyvek, taneszközök fejlesztése és digitális tartalomfejlesztés” című projektje keretében készült. A projekt az Európai Unió támogatásával, az Európai Szociális Alap társfinanszírozásával valósult meg. Gyártás: Könyvtárellátó Nonprofit Kft. Nyomta és kötötte: Alföldi Nyomda Zrt., Debrecen Felelős vezető: György Géza vezérigazgató A nyomdai megrendelés törzsszáma: 0000000000 Európai Szociális Alap", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 2", "2025. 02. 14. 11:04:07"], ["Kedves hatodikos tanulók! Az elmúlt tanévben megismerkedtetek a környezetünkben élő növényekkel, állatokkal. Tanultatok a térképről, az időjárásról és az éghajlat jelenségeiről. Rendszereztétek az élő és élettelen anyag minőségi tulajdonságait, mérhető jellemzőit. Különböző megfigyelések és kísérletek segítettek benneteket a környezetünkben megfigyelhető változások megismerésében. Az idei tanévben a természettudományórákon megismerkedtek a hazai erdők, a füves területek, valamint a vizek és vízpartok jellemző élőlényeivel. Tanultok a mozgásról, a mágneses és az elektromos kölcsönhatásról, a gravitációról, de szó lesz az élő szervezetek energiájáról is. Ismereteket szereztek a Földről. Sok érdekességet megtudtok majd a bolygónk mozgásairól és azok következményeiről. Betekintést nyerhettek a felszínt formáló belső és külső erők munkájába.", "A tankönyvben található jelölések magyarázata Az egyes leckékben a legfontosabb fogalmakat vastag betűvel emeltük ki. Ez megkön� nyíti számotokra a lényeg kiemelését tanulás közben. A leckéken belül több kérdés és feladat segíti a tananyag feldolgozását, valamint az eredményesebb otthoni tanulást. Piros betűvel jelöltük a fontos, veszélyre figyelmeztető információkat. A sárgával alászínezett, apró betűs részek olyan érdekességeket tartalmaznak, amelyeket nem kell megtanulni, de érdemes elolvasni. Sok hasznos ismeretet szerezhettek belőlük.", "Igyekeztünk könyvajánlóval is felkelteni az érdeklődéseteket bizonyos témakörök iránt.", "A Kísérletezzünk! elsősorban a fizikai tartalmú tananyagok megértését segítő kísérletek leírását tartalmazza. A vizsgálatokat tanárotok segítségével végezzétek! Ügyeljetek eközben saját magatok és mások testi épségére!", "Fogalomtár", "3"], ["A tanultak jobb megértését segítik a Megfigyelések, vizsgálatok című részek. Ezek elvégzése közben mindig tartsátok szem előtt, hogy a környezetünket, az abban zajló változásokat és az ott élő élőlényeket nem ismerhetitek meg, ha csak a könyvet veszitek a kezetekbe. A színes képek és rajzok segítenek a tanulásban, de nem helyettesítik a vizsgálódásokat. Ahhoz, hogy mikor, mit, hogyan kell megfigyelni és megvizsgálni, mindig segítséget ad a tankönyv. Az Ellenőrizd tudásodat! kérdései segítenek rendszerbe foglalni a tanultakat. Soha ne mulaszd el a feladatok megoldását a tanulást követően!", "Találtok a könyvben olyan kiegészítő tananyagot, olvasmányokat, amelyeket érdemes elolvasni, mert bővíthetitek velük ismereteiteket. A minden témakör végén megtalálható Rendszerezzük ismereteinket! című táblázatos áttekintés az egyes leckék fontos fogalmainak meghatározásával és tömör összefoglalásával segíti a tananyag elmélyítését, jobb megértését. A tankönyv végén a Fogalomtár a fontosabb fogalmak, szakszavak ismertetését tartalmazza. Már tudjátok, mennyire fontos az ismerete annak, hogy a helyek, amelyekről tanultok, hol találhatók. Tanulás közben mindig legyen előttetek az atlasz, hogy meg tudjátok keresni az ismeretlen helyeket a térképen! A tanuláshoz sok sikert kívánnak:", "a Szerzők", "A könyvben található piktogramok jelentése: Párban dolgozzatok!", "4", "Fogalomtár", "Csoportban dolgozzatok!", "Projektfeladat"], ["AZ ERDŐ ÉLETKÖZÖSSÉGE", "Az erdő életközössége"], ["Erdőt alkotó fáink: a tölgy és a bükk A fát mint nyersanyagot az ember évezredek óta használja. Régen fából készültek a házak, a vízi és a szárazföldi közlekedés eszközei (hajók, szekerek, vasúti talpfák), különböző gépek, használati tárgyak. A fémek és műanyagok csak a 19–20. században szorították ki a fát a technika világából. Hazánkban legnagyobb területen a különböző tölgyfajokból álló tölgyerdők élnek. A kocsánytalan tölgy a domb- és hegyvidékeken, a kocsányos tölgy a síkvidékeken, homokos talajon és az ártereken honos. A csertölgy a hegyoldalakat, a meszes talajt kedveli, jól tűri a szárazságot. Hegységeink déli oldalán, a szárazabb, sziklás élőhelyeken a molyhos tölgy él.", "A tölgyerdő szintezettsége", "A természetes állapotú tölgyerdőkben a fák távol állnak egymástól, a lombkorona nem záródik össze. A cserjeszintre és gyepszintre sok fény jut, ezért az aljnövényzet gazdag. Számos cserje és lágyszárú találja meg itt az életfeltételeit. Igen változatos a gombák világa is. A magányosan álló tölgyfa (kocsányos, kocsánytalan) törzse zömök, a fa kérge barna, mélyen re pedezett, és nagy, szétterülő lombkoronát fejleszt. Művelt erdőkben, zárt állományban a fa törzse hengeres, a lombkorona felfelé törekszik, így a levelek elegendő fényhez jutnak. A fák magassága a 30 métert is elérheti. Több száz évig is élnek, a művelt erdőkben azonban 80-100 éves korukban kivágják őket.", "lombkoronaszint", "cserjeszint gyepszint A tölgyerdő szintjei", "6", "Az erdő életközössége"], ["termős virág", "Figyeld meg a rajzokon a tölgy levelét, virágait és termését! makktermés", "A téli nyugalmi állapot után a tölgyfa rügyei tavasszal kihajtanak, kifejlődnek a levelek és a virágok. A levelek fényesek, sötétzöldek, szélük karéjos. A virágrügyekből fejlődő virágok kétfélék. A porzós virágok megnyúlt virágzati tengelyen barkavirágza tot alkotnak. A termős virágok nem feltűnő színűek, magányosan vagy kisebb csopor tokban állnak. A termős virágokra a szél szállítja a porzós virágokban képződött virágport. A tölgyek egylaki növények, mert a porzós és a termős virágok egy növényen helyezkednek el. A megporzás után a termős virágokból makktermés fejlődik. Ősszel a talajra hulló termések magjai 4-5 hét alatt kicsíráznak, és új fa fejlődik. Így újul fel természetes módon az erdő. A természetes felújulás másik formája a tősarjképzés. Ilyenkor az idős fák törzsén, a talajhoz közeli részen elhelyezkedő alvó rügyek hajtanak ki.", "porzós virágzat", "karéjos levél", "A kocsánytalan tölgy levele, virágai és termése", "A tölgy levele és termése", "Figyeld meg a rajzokon a bükk levelét, virágait és termését! fényes felületű levél", "porzós virágzat", "makktermés", "termős virág", "A közönséges bükk levele, virágai és termése", "A közönséges bükk főleg a hegységek 600 méter feletti területein alkot erdőket. 40 méter magasra is megnő. Törzse egyenes, kérge szürke, sima felületű. A levelek rövid nyélen ülnek, felületük felül fényes. A bükk is egylaki növény. A porzós virágok hosszú kocsány végén tömörülnek. A termős virá gokból a szélbeporzás után tövises, kupacsokkal fedett makktermés fejlődik.", "Az erdő életközössége", "7"], ["A bükkerdők lombkoronája szorosan összezáródik, az ágak egymásba fonódnak. A lombfaka dás után a gyepszintre kevés fény jut, ezért az aljnövényzet szegényes. Lombfakadás előtt azonban gazdag az aljnövényzet, amelyet például medvehagyma és egyéb hagymás és gumós növények alkotnak. A közönséges bükk kérge és levelei", "Ellenőrizd tudásodat!", "1. Mondj példákat, mi mindenre használták régen és ma a fát mint nyersanyagot! 2. Hol helyezkednek el hazánkban tölgy- és bükkerdők? Hasonlítsd össze a kétféle erdő jellegzetességeit (elhelyezkedés, lombkorona, fényviszonyok)! 3. Mi a jellemző a tölgyfa és a bükkfa törzsére, lombkoronájára, leveleire és termésére? 4. Mit jelent az, hogy a tölgy és a bükk egylaki növény? 5. Mi a jellemző a virágaikra, virágzataikra?", "A bükkerdő fái sűrűn állnak, a lombkorona zárt", "8", "Az erdő életközössége"], ["Az erdeifenyő. Gombák az erdőben A hazánkban található fenyvesek nagy része telepített. Őshonos fenyőerdők csak az Al pokalján és a Bakonyban (Dunántúli-középhegység) élnek. A fenyőerdőkben a fák sűrűn állnak, az ágak összeérnek, az erdő belsejébe így kevés fény jut. A fényszegény környezetben a cserjeszint fejletlen. A gyepszintet is csak néhány ár nyékkedvelő virágos (körtikefélék, ciklámen) és virágtalan növény (páfrányok, zuzmók) alkotja. A mohaszint fejlett, a felszínt helyenként összefüggő „mohaszőnyeg” borítja. Másutt 20-30 cm vastagságban nehezen lebomló tűlevelek fedik a talajt. Leggyakoribb fenyőfé lénk az erdeifenyő. Örökzöld, ami azt jelenti, hogy a fák tűleveleiket folyamatosan hullajtják le, így mindig van zöld levelük. Az összes levél lecserélődéséhez 5-9 év szükséges. Az erdeifenyő tűlevelei kettesével állnak, hegyes végűek, 4-6 cm hosszúak. A levelek felszíne viaszos bevonatú. Az egész növény gyantát tartalmaz, mely a gyantajáratokban képződik. Egylaki növény. A porzós virágok a hajtások csúcsán virágzatokba tömörülnek, és nagy tömegben termelik a virágport. A termős virágok elfásodó tobozvirágzatot alkotnak. A mag kezdemények a tobozvirágzat termőpikkelyeinek tövén, szabadon, fedetlenül helyezkednek el, ezért nyitvatermőnek nevezzük őket.", "Erdeifenyő", "Figyeld meg a rajzokon a fenyő virágzatát és a megporzás után kialakuló magvakat! magkezdemény", "légzsákos virágpor", "Az erdeifenyő törzse és virágzata", "A megporzás idején a tobozvirágzat termőpikkelyei szétnyílnak, és a szél akadálytalanul ráviheti a virágport a magkezdeményre. A megporzás és megtermékenyítés után a tobozpikkelyek újra összezáródnak, és védik a magkezdeményekből kifejlődő magvakat. Ha a magok megértek, a tobozpikkelyek ismét szétnyílnak. Onnan a szél könnyen kifújja és távoli területekre terjeszti a repítőhártyás érett magokat.", "A termős tobozvirágzat hosszmetszete", "Az erdő életközössége", "9"], ["Rókagomba, őzlábgomba, ízletes vargánya, erdei csiperke", "Az erdőkben nagy számban élnek különböző gom bafajok. Különböznek az eddig megismert élőlényektől, mivel nem tartoznak sem a növények, sem az állatok közé. Növényi tulajdonságuk, hogy spórákkal szaporodnak. Zöld színtesteik nincsenek, ezért az állatokhoz hasonlóan más élőlények összetett anyagaival táplálkoznak. A növények gyökérzetének legvékonyabb részei a hajszálgyökerek. Ezekből erednek a gyökérszőrök, Gombafonalak kapcsolata a gyökérzettel melyek a növény számára felveszik a talajból a vizet és a benne oldott tápanyagokat. Sok fának azonban nem fejlődnek gyökérszőrei, így például a fenyőknek sem. A tápanyagokat a gyökerekkel együtt élő gombafonalak veszik fel. Az együttélés hasznos a fának, mivel csak így juthat tápanyagokhoz. Előnyös a gombáknak is, mert cserébe a fáktól kész táplálékot (cukrot) kapnak. A legismertebb gombák a kalaposgombák. Táplálkozásuk alapján korhadékevők, azaz elhalt élőlények összetett anyagaival táplálkoznak. A gyilkos galóca halálos méreganyagot tartalmaz. A gomba fő ismertetőjegye, hogy bocskora és gallérja van, a lemezek fehérek mind a fiatal, mind a kifejlődött termőtesten. Az erdei csiperke lemezei fiatalon rózsaszínűek, majd megfeketednek. A tönkjén gallér van, de bocskora nincs. Az erdei csiperke és még számos gombafaj ehető és magas tápértékű. Értékes fehérjéket, ásványi anyagokat és vitaminokat tartalmaznak. Kalóriában (energiában) szegények, ezért az egészséges táplálkozás fontos összetevői. Egyes gombafajoknak gyógyító hatásuk is van (magas vérnyomás és a koleszterinszint csökkentése, daganatos betegségek elleni hatás), és erősítik a szervezet általános ellenálló képességét a betegségekkel szemben. A kalaposgombák gombafonalai átszövik a korhadó avart, a talajban lévő növényi és állati maradványokat. Ezekből veszik fel a táplálékukat. Kedvező környezeti feltételek mellett (például az esőket követő meleg, párás napokon) a gombafonalak tömörülnek, és létrehozzák a termőtestet. Két nagy részt, a tönköt és a kalapot külöA termőtestet gombafonalak alkotják níthetjük el rajtuk. A kalap alsó része a termőréteg, ez a 10", "Az erdő életközössége"], ["csiperke- és a galócafajoknál lemezes szerkezetű. Itt képződnek többmilliós nagyságban a spórák, melyek ivartalan szaporítósejtek. Ez azt jelenti, hogy képződésükhöz nincs szükség két különböző nemű szülőegyedre. Az érett spórák kihullnak, és belőlük megfelelő környezeti feltételek mellett gombafonalak képződnek. Figyeld meg az alábbi rajzokon a gyilkos galóca és az erdei csiperke fejlődését!", "lemezek gallér", "gombafonalak", "A hazánkban élő több ezer kalaposgomba élőhelye, felépítése, alakja, színe és mérete nagyon különböző. Például csak a csiperkegombákból 300 különböző fajt ismer a tudomány. Egyes gombafajoknak nagy jelentőségük van az életközösségekben. Nemcsak felveszik a tápanyagokat egyes növények számára, hanem részt vesznek az elhalt növényi és állati maradványok lebontásában is.", "tönk bocskor", "A gyilkos galóca fejlődése", "spóra", "Az erdei csiperke szaporodása", "Sokak kedvelt időtöltése a gombagyűjtés. Fontos azonban, hogy kizárólag hivatásos gombaszakértő által megvizsgált gombát szabad elfogyasztani! A gombából készült ételeket mindig frissen kell fogyasztani!", "Ellenőrizd tudásodat!", "1. Hol élnek őshonos fenyőerdők hazánkban? 2. Mi a jellemző a fenyőerdők szintjeire? 3. Hasonlítsd össze a tölgyerdők, a bükkerdők és a fenyőerdők szintjeit! 4. Magyarázd meg a következő fogalmakat: örökzöld, egylaki, tobozvirágzat, nyitvatermő! 5. Miért nem sorolhatjuk a gombákat sem a növények, sem az állatok közé? 6. Milyen kapcsolat alakult ki a gombafonalak és az erdeifenyő gyökérzete között? 7. Miről ismerheted fel a gyilkos galócát?", "Az erdő életközössége", "11"], ["A cserjék és a gyepszint virágos növényei", "Az erdők uralkodó növényei a fák, melyek lombkoronájukkal elzárják az éltető fényt, gyökérzetükkel felveszik a tápanyagok nagy részét is. A cserjék és a gyepszint lágy szárú növényei kevesebb fénnyel és tápanyaggal is beérik, alkalmazkodnak a környezethez. Figyeld meg a fa és cserje alakját! Hasonlítsd össze! Mely tulajdonságokban azonosak, és miben különböznek?", "A fa és a cserje felépítése", "A kökény érett termése", "A kökény virága és a virágból kialakuló termés", "12", "Az erdő életközössége", "A lombhullató erdők cserjeszintjét fiatal fák és cserjefajok alkotják. A cserjék is fásszárúak, de nincs törzsük, közvetlenül a talaj felett elágaznak. Jól al kalmazkodnak a fák által alakított környezeti feltételekhez. A föléjük tornyosuló fáknál előbb fejlesztik ki lombozatukat, így kora tavasszal sok fényhez jutnak, gyorsan fejlődnek. A virágzásuk is megelőzi az uralkodó fákét (tölgy, bükk), ezért a fák nem gátolják a széllel és rovarokkal történő beporzást. Egyik leggyakoribb cserjénk a kökény. Sűrű, áthatolhatatlan a lombozata, akár 4 méter magasra is megnőhet. Oldalhajtásai szúrós ágtövi sekké módosultak, melyeket kézzel nem tudunk lepattintani róla. Kora tavasszal virágzik. A virága és termése az előző tanévben megismert szilvafáéhoz hasonló. A termő magházában zártan helyezkedik el a magkezdemény, amelyből a megporzás után kialakul a mag, a termő falából pedig a termés. Az ilyen növényeket zárvatermőknek nevez zük. A kökény ősszel beérő csonthéjas termése fanyar ízű. Ha „a dér megcsípte” – vagyis az első fagyos nap után –, az íze már kellemesebb. Figyeld meg, hogy a virág mely részeiből alakul ki a csonthéjas termés!"], ["A mogyoró az erdőszéleken él. Már február végén virágzik. Szélbeporzású növény, a termős virágokból sok tápanyagot tartalmazó makktermés fejlődik. A vadrózsa (vagy gyepűrózsa) is a naposabb erdőszéleken él. Színes virágait a rovarok porozzák be. Csipkebogyótermése áltermés. A termés kialakulásában – az almaterméshez hasonlóan – a termő mellett a vacok és a csészelevelek is részt vesznek. A vadrózsa hajtásain a növény külső részéből (a bőrszövetből) tüskék fejlődnek. Az ágtövistől eltérően a tüskét könnyen lepattinthatjuk. Figyeld meg a rajzokon a vadrózsa és a mogyoró virágát (virágzatát) és a termés kialakulását!", "termős virág porzós virágzat", "makktermés", "A mogyoró szervei", "A vadrózsa virága, levele és áltermése", "A cserjéknek fontos szerepük van az erdő életközösségében. Sűrű, tüskés, tövises ágaik madárfajoknak nyújtanak védelmet és biztonságos fészkelőhelyet. A siklók, gyíkok szintén kedvelik az erdőszéli cserjéseket. Itt a napfényben sütkéreznek, veszély esetén a sűrű ágrendszer kiváló búvóhelyet biztosít számukra. Cserjék az erdő szélén", "Az erdő életközössége", "13"], ["A cserjék levélzete és termése táplálékot ad a növényevőknek. Az erdőszéli cserjesor felfogja a szelet, védi az erdő fáit a szél pusztító hatásaitól. A téli időszakban a sűrű ágrendszer véd a hóviharokkal, hófúvásokkal szemben.", "leples virág", "Az ujjas keltike, a téltemető és a berki szellőrózsa a gyepszintben él", "Az erdők gyepszintjében sok virágos és virágtalan lágyszárú él. Az évelő hóvirág lombfakadás előtt virágzik. A virágzás után kifejlődő levélzete táplálékot készít, melyet a talajban lévő módosult hajtás, a hagy ma raktároz el. Őszre a talaj feletti részei elszáradnak, a fagyos hónapokat a talajban lévő hagyma vészeli át. Kora tavasszal az itt elraktározott tápanyagok fel használásával képes gyorsan kihajtani és virágzani.", "Ellenőrizd tudásodat!", "hagyma", "A hóvirág szervei", "1. Hasonlítsd össze a cserjéket és a fákat! Melyek az azonosságok és a különbségek? 2. Mi a különbség a tövis és a tüske között? 3. Mely virágrészből alakul ki a termés és a mag? Hogy nevezzük a kökény, a vadrózsa és a mogyoró termését? 4. Miről ismerhetők fel a szél- és a rovarbeporzású virágok? 5. Mi a jelentőségük a cserjéknek? 6. Ismertesd a hóvirág szerveit! Hogyan alkalmazkodik a környezetéhez?", "14", "Az erdő életközössége"], ["Virágtalan növények az erdőben Az erdő virágtalan növényei közé tartoznak a zuzmók, a mohák és a páfrányok. Közös jellemzőjük, hogy nincs viráguk. Szabad szemmel nem látható spórákkal szaporodnak, melyekből kedvező környezeti feltétek mellett új növények képződnek. Zuzmókkal szinte minden élőhelyen találkozhatunk. Megtelepednek a fákon, a sziklákon, a talaj felszínén, a betonkerítéseken, a szobrokon stb. Alakjuk, színük változatos. A Föld szélsőséges éghajlati területein is megélnek (sivatagok, fagyos területek, magashegységek).", "A zuzmók telepes növények. Testük nem különül el gyökérre, szárra és levélre. A zuzmótelep két élőlény (gomba és moszat) szoros együttéléséből alakul ki. A gombafonalak veszik fel a tápanyagokat és a vizet, ezek tömörülése alkotja a telep kéregszerű bevonatát is. A telep alkotói még a zöldmoszatok, melyek a felvett tápanyagokból táplálékot készítenek. A zuzmótelep növekedése igen lassú folyamat, évente mindössze 1-2 cm. Szaporodáskor a telep felszínén termőtestet fejlesztenek, melyekben spórák képződnek. A spórákhoz parányi moszatsejtek is kapcsolódnak. Apró, leváló telepdarabokkal is szaporodnak, amelyeket a szél terjeszt. Kedvező környezetben belőlük is új növény fejlődik. Figyeld meg a tankönyv rajzán a zuzmótelep felépítését!", "zöldmoszat", "gombafonalak", "A zuzmótelep és a telep belső felépítése mikroszkóp alatt", "A zuzmóknak fontos szerepük van az élővilágban. Sajátos anyagot termelnek (zuzmósav), amely mállasztja a sziklákat, így a talajképződésben is részt vesznek. A zuzmók számos állatnak jelentenek fontos táplálékforrást. Az erdő életközössége", "15"], ["A mohák is telepes növények. Figyeld meg a rajzon a moha felépítését! Valódi gyökerük, száruk, levelük nincs. A talajba gyökérszerű fona spórák lakkal rögzülnek. A vizet egész testfelületükkel ve szik fel, ezért csak előtelep párás, nedves környezetben élnek. spóratok A táplálékot a telepben megtalálható zöld alkotórészek (színtestek) spóratartó készítik. ivarnyél Egyes mohák el viselik a teljes szervek kiszáradást. Ha vízhez jutnak, újra megindulnak életműködéseik. Spólevélke rákkal szaporodnak, amelyek a spóratartó nyél csúcsán elhelyezkedő spóratokban képződnek. A kihulló spórákból nedves talajon új moha gyökérszerű rögzítőfonalak növények fejlődnek. A lombosmoha felépítése és fejlődése", "Sok helyütt az erdők talaját szőnyegszerűen mohák borítják. A fenyőerdők gyepszintje szinte csak mohákból áll. Fontosak az életközösségben, a lehulló csapadékot felfogják, és lassan továbbítják a talajba. Szivacsszerű működésük megvédi a talajt a kiszáradástól, megóvja a termőréteg lepusztulását. Az elpusztult moháknak fontos szerepük van a talajképződésben és a termőréteg megújulásában is.", "Mohatakaró az erdőben", "16", "Az erdő életközössége"], ["levélke spóratokkal", "Figyeld meg a tankönyv rajzán az erdei pajzsika felépítését! Az erdők árnyékos, hűvösebb, páradús élőhelyein találják meg életfeltételeiket a páfrányok. Közülük az erdei pajzsika a legismertebb. A páfrányoknak már valódi szerveik vannak. A talajban lévő szervük a gyöktörzs, amely rögzíti a növényt, felveszi és raktározza a táplálékot. Rügyeiből fejlődnek ki az összetett levelek, vagyis egy közös levélnyélen több levél helyezkedik el.", "spóra", "kifejlett növény", "előtelep fejlődő új növény az előtelepen Az erdei pajzsika fejlődése", "A levelek fonáki részén helyezkednek el a spó ratartó tokok, amelyekben a spórák képződnek. A spórákból nedves talajon szív alakú előtelep fejlődik, majd kifejlődnek rajta a női és hímivarszervek. A hímivarsejt vízcseppben úszva jut el a petesejthez. A két sejt összeolvad, és a megtermékenyített pete sejtből az előtelepen új pajzsika fejlődik. Az erdei pajzsika évelő növény. Minden évben kihajt ugyanarról a helyről. A kedvezőtlen téli időszakot a talajban lévő szerve, a gyöktörzs vészeli át. A föld feletti levelei elszáradnak. Tavasszal a tápanyagraktárként is szolgáló gyöktörzs rügyei kihajtanak, és új levélzet fejlődik.", "Az erdei pajzsika fiatal hajtása", "Hasonlítsd össze az erdei pajzsika felépítését a hóvirágéval! Mely tulajdonságokban hasonlít, és miben különbözik?", "Ellenőrizd tudásodat!", "1. Ismertesd a zuzmók, a mohák és a páfrányok élőhelyét! 2. Milyen élőlények alkotják a zuzmótelepeket? 3. Magyarázd meg, mit jelent az, hogy a mohák és a zuzmók telepes növények! 4. Mivel szaporodnak a tanult virágtalan növények? 5. Mi a jelentősége az erdők életközösségében a moháknak, a zuzmóknak és a páfrányoknak? 6. Ismertesd egy mohanövény részeit!", "Az erdő életközössége", "17"], ["A gímszarvas, az őz és a vaddisznó Lombhullató erdőink legnagyobb állata a gímszarvas. Természetes ellenségeit mára az ember kipusztította a hazai erdőkből. Régen a fiatal példányokat a hiúz és a farkas zsákmányolta. Ma egyedszámuk kb. 60 ezer, amelyet az ember vadászattal szabályoz.", "A gímszarvasbika testtömege 200 kg, marmagassága 1,5 méter, testhossza 2-2,5 méter", "Szarvastehén", "A gímszarvas a fák rügyeivel, leveleivel, kérgével, terméseivel, fűfélékkel táplálkozik. Télen a hó alól kaparja ki táplálékát. Kemény teleken a vadetetőket is felkeresi. Fogazata növényevő. A zápfogak bendő százrétű gyomor recésgyomor felülete széles, mélyen barázdált redős zápfog. A nehezen emészthető növényi táplálék (fakéreg, makk) szétmorzso lására alkalmas. Kérődző állat, összetett gyomra van. A megrágott és lenyelt táplálék először a bendőbe, majd a recésgyomorba jut. oltógyomor Amikor az állat pihen, felöklendezi a táplálékot, újra megrágja, ekkor a táplálék a százrétű, majd az oltógyomorba kerül. A táplálék teljes megemésztése és A szarvasmarha tápcsatornája és az összetett gyomor részei felszívása a belekben történik. Figyeld meg a rajzon az összetett gyomor részeit! Honnan hová kerül a táplálék a kérődzés során? 18", "Az erdő életközössége"], ["Végtagjai négy ujjban végződnek, az ujjakat pata borítja. Párosujjú patás állat. A talajjal a két középső, nagyobb méretű pata érintkezik. Különösen a szaglása és a hallása fejlett, ezek biztosítják rendkívüli éberségét. Az ember közeledtét már több száz méterről érzékeli. tülök", "A szarvasbikák agancsa a homlokcsont csapjából fejlődik. Az évről évre újrafejlődő agancs tömege egyre nagyobb lesz, és egy adott életkorig (10-12 év) nő az elágazások száma is. A párzási időszakot a szarvasbőgés jelzi. Ekkor a hímek szarvnyúlvány összemérik erejüket. A legerősebb uralja majd a területet, és párosodik a nőstényekkel. A gímszarvas és a szarvasmarha koponyája a szarvakkal A szarvastehén nyár elején egy borjat ellik, amelyet négy hónapos koráig szoptat. A szarvas az idős tölgyerdőket kedveli. Az őz eredetileg a cserjékkel, facsoportokkal tarkított füves területeken élt. Napjainkban az emberi beavatkozások miatt (mezőgazdaság, vadászat) nagyrészt visszahúzódott az erdőszéli területekre. A hím állat neve őzbak. A nőstény őz a suta, amely májusban egy, ritkábban két gidát hoz a világra. Az őz főbb tulajdonságaiban a szarvashoz hasonlít, de lényegesen kisebb termetű állat. Csapatokba verődve gyakran megfigyelhetjük szántóföldeken, ahol a téli időszakban a hó alól kaparja ki a friss búza- és repcehajtásokat.", "A vaddisznó a sűrű, cserjékben gazdag erdőkben él. Ott érzi jól magát, ahol dagonyázóhelyet is talál, azaz hempereghet az iszapos vízben. A kifejlett hím állat (kan) 250 kg tömegű, 1,5 méter hosszú, marmagassága közel 1 méter. Testét durva szőrzet borítja, amely alatt a téli időszakban finom gyapjúszőrzet fejlődik. Ez megőrzi testének melegét. Párosujjú patás, biztonságosan mozog a mocsaras talajon is, mivel mind a négy ujja éri a talajt.", "Az őzbak testtömege 20-25 kg, marmagassága 60-70 cm, hossza 1-1,5 méter", "A párosujjú patás végtag", "Éjjel jár tápláléka után, amelyet kiváló szaglásával kutat fel. Orra megnyúlt, túrókaréjban (túrókarima) végződik. Ennek segítségével kiforgatja a talajból a gyökereket, férgeket, csigákat, gombákat. Megeszi a makkterméseket, a földön fészkelő madarak tojásait, fiókáit, de még az elhullott állatokat (dögöket) is. Az erdő életközössége", "19"], ["szemfog metszőfog", "Figyeld meg a rajzon a vaddisznó fogazatát!", "gumós zápfog", "A vaddisznó fogazata", "Vadmalac", "Mindenevő, zápfogainak felülete gumós. Szemfogai hatalmas agyarrá fejlődnek, amely elérheti a 25 cm-es hosszúságot is. Ez a védekezőfegyvere, de segít a táplálék megszerzésében is. Feltépi vele a vastag gyökereket is, és minden, a felszínre kerülő élőlényt felfal. Szapora állat. A koca kora tavasszal 6-10 csíkos malacot hoz a világra. Két hétig szoptatja őket, majd a kismalacok követik anyjukat, és önállóan táplálkoznak. A kocák és malacaik nagyobb csapatokban (kon dák) élnek, csak az öreg hímek járják magányosan az erdőt. A vadon élő állatok védelméről, a vadászatuk szabályairól és a vadgazdálkodásról törvény rendelkezik. A vadgazdálkodás számos feladata megegyezik a természetvédelmi munka feladataival. Ilyen például az életközösségek egészének védelme vagy a kis egyedszámban élő fajok és azok élőhelyeinek megőrzése, a természetes szaporulat elősegítése. A vadgazdálkodás során meghatározzák, hogy egy adott élőhelyen mekkora lehet a vadászható fajok egyedszáma. A kilőhető fajok mennyiségét az adott élőhely vadeltartó képessége határozza meg. Mivel a hazai erdőkből a csúcsragadozók (hiúz, farkas, barna medve) kipusztultak, a szarvasok, az őzek, a vaddisznók és a rókák egyedszámát vadászattal szabályozzák.", "Szarvasok és vaddisznók", "Ellenőrizd tudásodat!", "1. Hasonlítsd össze a gímszarvas, az őz és a vaddisznó élőhelyét! 2. Sorold fel a megismert állatok testfelépítésének és életmódjának jellemzőit! 3. Milyen életmódra következtethetsz a zápfogak felületéből? 4. Hogyan nevezzük a szarvas, az őz és a vaddisznó hímjét és nőstényét?", "20", "Az erdő életközössége"], ["A róka, a sün és a mókus A vörös róka az erdő meredek, szakadékos domboldalait kedveli, ahol kotorékát mélyen beáshatja a gyökerek közé. Több kijáratot készít, így veszély esetén könnyebben elmenekülhet. Jól alkalmazkodik a környezeti változásokhoz. Megtelepszik a szántóföldek, a lakott területek környékén is. Ma már nem ritkák a városi parkokban és szeméttelepeken élelem után kutató rókák sem. Alkalmazkodóképessége miatt hazánk legelterjedtebb ragadozó állata, bár sok helyütt minden eszközzel pusztítják.", "A rókakölykök", "A vörös róka törzse kb. 70 cm, farka 40 cm, magassága 40 cm. Testtömege átlagosan 7 kg", "A róka vörös szőrzete télre megvastagszik, dúsabb lesz. Tavasszal a téli bundát levedli. Fogazata a kutyáéhoz hasonlóan ragadozófogazat. Hosszú, hegyes szemfogaival ragadja meg zsákmányát, tarajos felületű, erős zápfogaival pedig felaprítja. A legerősebb zápfogakat tépőfogaknak nevezik. Szapora állat, 4-6 vakond nagyságú kölyköt hoz a világra. A kölykök kezdetben szopnak, majd az anyaállat előemésztett húsdarabokat öklendez fel számukra. A vadon élő emlősök gyakori betegsége a veszettség. A róka igen fogékony a betegségre. A megbetegedett állat elveszti éberségét, félelemérzetét, és szelíddé válik. Gyakran a lakott területekre is bemerészkedik, megfertőzi a kutyákat, macskákat is. Más esetben támadóvá (agres�szívvé) válik, minden élőlénybe belemar. Nyála, harapása, de a szőrzetének érintése is fertőzhet, ezért a gyanúsan viselkedő rókához, de még a rókatetemekhez sem szabad hozzáérni. A veszettség ellen a rókák élőhelyein táplálékot szórnak ki, melybe a védettséget kialakító gyógyszert is belekeverik. Ez az emberi beavatkozás csökkenti a betegség terjedését. Nemkívánatos hatása, hogy egyes területeken a rókák túlszaporodnak.", "A róka táplálékának összetétele Ismertesd a kördiagram alapján, mi mindennel táplálkozik a róka!", "Az erdő életközössége", "21"], ["A sün a cserjékben gazdag erdőket kedveli, de megtelepszik a lakóhely környéki gyümölcsösök ben, parkokban is. Természetes ellenségeivel szemben a szőrszálak ból átalakult, megvastagodott és elszarusodott tüs kékkel védekezik. Ha veszélyt érez, összegömbö lyödik, és bőrizomzatával kimerevíti tüskéit. Éjjel jár a főleg rovarokból álló tápláléka után. Elfogyasztja a férgeket, csigákat, hüllőket, kisemlő söket is. A táplálékszerzésben szaglása és hallása segíti. Fogazata rovarevő. Minden fogtípusa hegyes, a kemény kitinváz felaprítására alkalmas.", "A sün 20-25 cm hosszú, testtömege 1 kg", "Hasonlítsd össze a rajzokon a sün és a róka koponyáját! Hogyan nevezzük az egyes fogtípusokat? Melyik fogtípusból milyen életmódra következtethetsz? metszőfog", "szemfog", "hegyes fogak", "tarajos zápfog A róka és a sün koponyája", "Figyeld meg a tankönyv rajzain a sün életfolyamatainak változásait!", "Nyár", "Tél", "Ősz", "Nyár", "Ősz", "Tél", "A környezet hőmérséklete", "20 °C", "10 °C", "2 °C", "Testhőmérséklete", "35 °C", "24 °C", "5 °C", "Szívverése percenként", "320", "124", "18", "A sün életműködéseinek változása", "22", "Az erdő életközössége", "A 3-6 sünkölykök lágy tüskékkel jönnek a világra, egy hónapos korukig szopnak. Az őszi hónapokban különösen mohón táplálkozik, szinte felhizlalja magát. A bőr alatti zsírréteg tartalék tápanyag, melyet a téli álom alatt hasznosít. Levelekkel, mohákkal kibélelt üregben téli álmot alszik. A róka erdőben és erdőn kívül nagy területeket kóborol be a táplálékszerzése során. A sün az aljnövényzet közt keresi táplálékát."], ["A közönséges erdei mókus élőhelye a lombkorona. A fenyő- és lombhullató erdőkben egyaránt megél, de megtelepszik a nagyobb parkokban is. Ügyesen és gyorsan mozog a fák törzsén, a vékony ágakon. 4-5 méteres ugrásokra képes, a levegőben farkával kormányoz. Rágcsálófogazata van. Met szőfogai fejlettek, élesek, szemfogai nincsenek, zápfogai gumósak. Magvakkal táplálkozik, de megeszi a madártojásokat és -fiókákat is. A téli időszakra készleteket gyűjt. A leghidegebb napokat átalussza, de életfolyamatai nem lassulnak le. A napsütötte órákban felébred, és készleteiből táplálkozik. Ezt nevezzük megszakított téli álomnak.", "A mókus testhossza 20-30 cm, farka 25 cm, testtömege 0,5 kg", "Évente kétszer szaporodik, 4-5 kicsinyét faodúban vagy fészkében hozza világra. A mókus és környezete közötti szoros kapcsolatot jelzi, hogy hány utódot nevel fel. Ha bőségesen van táplálék, valamennyi kicsinyét felneveli. Ha kevés, csak egyet-kettőt.", "Ellenőrizd tudásodat!", "1. Ismertesd a róka, a sün és a mókus élőhelyét, életmódját és fogazatát! 2. Melyik állat mikor jár tápláléka után? 3. Miért kell óvakodni a szelíd rókáktól? 4. Milyen összefüggés van az élőhely táplálékkészlete és a felnevelhető utódok száma között?", "Az erdő életközössége", "23"], ["Harkályok és énekesmadarak az erdőben Az élőlények alapvető életjelensége a táplálkozás és a szaporodás. A táplálék hiányát a növények és az állatok rövid ideig viselik el. Különösen igaz ez a kis termetű énekesmadarakra, amelyek csak néhány napig bírják víz és szilárd táplálék nélkül. Az élőlények között folyamatos versengés alakul ki a táplálkozási helyekért, a táplálék megszerzéséért. Az életrevalóbb, a jobban alkalmazkodó élőlények kiszorítják az élőhelyről a gyengébbeket. A madarak a versengés eredményeként felosztják egymás között az élő helyeket. Más-más fajok táplálkoznak a lombkorona ágai között, mások a fák törzsén, a kéregrepedésekben, és mások a cserje- és a gyepszintben. Így például a tölgyerdőkben egy négyzetkilométeren 80-100 madárfaj is tud táplálkozni, fészkelni és utódokat felnevelni. A hazai erdőkben a harkályoknak több fajuk él. Közös tulajdonságuk, hogy testfelépítésük alkalmazkodott a fák kérge alatt és az odvas fákban rejtőzködő táplálék megszerzéséhez. Lábuk kúszóláb, ujjaik közül kettő előre-, kettő hátranéz. Karmaik hegyesek, erősek, csőrük véső alakú. Farktollaik erősek, amikor a fa törzsén kúsznak, alulról támasztják a testüket. Nyelvük hosszú, kiölthető, a vége ragadós. Táplálkozáskor csőrükkel kéregdarabokat hántanak le. Néha az elszáradt fa teljes kérgét lehántják, vagy a puha, odvas fába üregeket vésnek, így hozzáférnek a mélyen megbúvó rovarokhoz. A téli időszakban magvakat is fogyasztanak (fenyő, mogyoró, dió).", "A harkályok odúban költenek", "Figyeld meg a rajzon a harkály kiölthető nyelvét és zsákmányszerzését!", "A harkály kiölthető nyelve és kúszólába", "24", "Az erdő életközössége"], ["Legismertebb harkályfélénk a nagy fakopáncs. Állandó madarunk. Maga készítette odúban fészkel, 4-6 fiókát nevel. Az elhagyott odúját cinegék foglalják el. Figyeld meg a 24. oldali rajzon, hogyan alkalmazkodott a nagy fakopáncs testfelépítése a táplálék megszerzéséhez!", "Nagy fakopáncs", "A csuszka szintén a fák törzsén, vastag ágakon kúszva szerzi meg táplálékát. A csuszka fejjel lefelé és felfelé egyaránt remekül mozog a fák törzsén. Hegyes csőrével a kéreg repedései közül szedegeti ki a pókokat, hernyókat, kifejlett rovarokat. Állandó madarunk, télen gyakran behúzódik a nagyobb parkokba, gyümölcsösökbe. Csuszka", "A sárgarigót a hím citromsárga tollai miatt arany málinkónak is nevezik. A lombkorona ágai között keresi főleg hernyókból és kifejlett bogarakból álló táplálékát. Érett gyümölcsöt is fogyaszt. A tojó a fészkét ágvillára függeszti, 3-4 tojást rak. Költöző madarunk. Májusban érkezik, és már augusztusban indul vis�sza Afrikába.", "Sárgarigó", "Az örvös légykapó is költöző madár. Neve arra utal, hogy repülő rovarokkal táplálkozik, amelyeket a levegőben fog el. Erdőszéleken, tisztásokon a fák külső ágain ülve figyeli ki táplálékállatait.", "Örvös légykapó", "Az erdő életközössége", "25"], ["A sűrű tövises, tüskés cserjésekben és a gazdag alj növényzetű erdőkben fészkel és keresi főleg rovarokból álló táplálékát a barátposzáta. A hímet a fekete tollsapkája különbözteti meg más énekesma daraktól. Költöző madár.", "Barátposzáta", "A fekete rigó eredeti élőhelye a lombhullató erdő. Ma már nagy számban élnek a lakott területeken, falvakban és városokban. Ezek a rigók a telet is nálunk töltik. Az erdőben élő rigók táplálékukat – amely főleg férgekből, csigákból, rovarokból áll – az avarban keresik. Nyáron és ősszel gyümölcsöt (szedret, bodzát, galagonyát) is fogyasztanak.", "Fekete rigó", "A fülemüle a legszebb hangú énekesmadarunk", "Széncinege", "Ellenőrizd tudásodat!", "1. Miért tud azonos élőhelyen több madárfaj is megélni? 2. Hol keresik táplálékukat a harkályok és a megismert énekesmadarak? 3. Hogyan alkalmazkodott a harkálynak a testfelépítése az életmódjához?", "26", "Az erdő életközössége"], ["Ragadozó madarak az erdőben A ragadozó életmódú állatokra jellemző, hogy táplálkozásuk során különböző állatokat zsákmányolnak, és azokkal táplálkoznak. Testfelépítésük a zsákmány megszerzéséhez alkalmazkodott. Érzékszerveik (látás, hallás, szaglás) fejlettek, színükkel beleolvadnak a környezetükbe, így észrevétlenül, lesből csapnak le áldozatukra. A ragadozó emlősöknek hosszú, hegyes szemfogaik vannak, élesek a zápfogaik, erősek az állkapcsi izmaik. Egyes fajok (farkasok, hiénák) csapatokba verődve, hosszabb-rövidebb üldözés során szerzik meg táplálékukat, míg mások magányosan vadásznak (vadmacska, hiúz, puma). Számos ragadozó hüllőre, ízeltlábúra jellemző, hogy méreganyagukkal ölik meg áldozatukat. A ragadozó madaraknak horgas, hegyes csőrük és erős markolólábuk van, amely hosszú, hegyes karmokban végződik. A ragadozók bélcsatornája sokkal rövidebb, mint a növényevőké, ugyanis a hús emésztése könnyebb, mint a sok rostanyagot tartalmazó növényi tápanyagoké. A csúcsragadozók a táplálkozási láncok végén állnak, és velük már más állatok nem táplálkoznak. Fontosak az életközösségekben, mivel szabályozzák a növényevők számát. A szabályozás révén viszonylagos egyensúly alakul ki a növények, a növényevők és a ragadozók között. A hazai életközösségekben a csúcsragadozók egy része már kipusztult, mások pedig csak a természetvédelmi területeken maradtak fenn (uhu, rétisas, parlagi sas, kerecsensólyom, parlagi vipera). A héja 60 cm nagyságú, szárnyainak fesztávolsága 110 cm", "A héja a fás élőhelyek (tölgyesek, kisebb erdőfoltok, fasorok, telepített akác- és nyárerdők) ragadozó madara. Nappal szerzi zsákmányát, amely egerekből, pockokból, énekesmadarakból, galambokból, fácánokból, nyulakból, fiatal rókákból áll. Képes elfogni még a gyors mozgású mókusokat is. Lesből figyel áldozatára, majd gyors, a fák között cikázó repüléssel üldözőbe veszi, és hirtelen zuhanással lecsap. A héja zsákmányszerzése", "Figyeld meg a héja zsákmányszerzését! Az erdő életközössége", "27"], ["A héja gyors repülését a fejlett szárnymozgató mellizmok biztosítják. A hosszú fark tollakkal a mozgás irányát szabályozza. Lába fogóláb. Csüdje rövid, ujjai erősek, hegyes karmai 3-4 cm hosszúak. Áldozatával hegyes karmai és ujjainak szorítása végez. Csőre a ragadozó madarakra jellemzően horgas, hegyes tépőcsőr.", "A héja tépőcsőre", "A héja fogólába", "A költőpár a fészket a magas fák lombkoronájába rakja. A tojó 2-4 tojást rak, a kotlás ideje alatt a hím hordja az eleséget. A kikelt madarak fészeklakók, mindkét szülő eteti őket. A héja a téli időszakban sem költözik el, állandó madarunk. Az erdei fülesbagoly a legnagyobb egyedszámban élő bagolyfajunk. Nevét a fején lévő fülszerű tollazatáról kapta. Az erdőszéleket, a folyók ártéri erdőit, a ligetes facsoportos élőhelyeket kedveli. Gyakran megtelepszik az emberi települések környezetében, a tűlevelű fákon, temetők környékén. A téli időszakban kisebb csapatokba verődnek, és telelő csoportokat alkotnak. A települések belterületét kedvelik, ahol fenyőfákon, tuják ágai közé gyűlnek össze. Nappal megbújnak az ágak között, mozdulatlanul pihennek, éjjel táplálkoznak.", "Az erdei fülesbagoly 30-37 cm hosszúságú szárnyának fesztávolsága 1 m", "Figyeld meg a rajzon az erdei fülesbagoly testfelépítését! Mi a különbség a héja és a fülesbagoly zsákmányszerzése között?", "Az erdei fülesbagoly főleg egereket, pockokat, énekesmadarakat zsákmányol. Naponta 4-5 egeret is elfogyaszt. A táplálék megszerzésében kiváló hallása, látása és nesztelen repülése segíti.", "28", "Az erdő életközössége"], ["Az erdei fülesbagoly vetélőujja", "Fő zsákmányszerző szerve a horgas, hegyes, éles csőr. Karmai hegyesek. Négy ujja közül az egyiket előre-hátra is tudja mozgatni, ez a vetélőujj. Amikor az ágakon kapaszkodik, két ujja előre-, kettő Fejletlen bagolyfiókák hátrafelé áll. Zsákmányszerzéskor három ujja néz előre. A táplálék emészthetetlen részeit (csontok, csőr, toll, szőr) kis gombócok formájában (bagolyköpet) visszaöklendezi. Fészket nem épít, többnyire elhagyott varjúfészekbe, ritkábban odvas fákban költ. 4-6 tojást rak. A költési időszak alatt a hím gondoskodik élelemről, később a fiókákat a szülőpár eteti.", "Ellenőrizd tudásodat!", "1. Fogalmazd meg, mit jelent a ragadozó életmód! 2. Mi a jelentősége a ragadozóknak az életközösségekben? 3. Hasonlítsd össze a héja és az erdei fülesbagoly táplálkozását! 4. Mely érzékszervek segítik a két madárfajt a táplálék megszerzésében? 5. Mi a jellemző a héja és az erdei fülesbagoly fészkelésére és szaporodására?", "Az erdő életközössége", "29"], ["Ízeltlábúak az erdőben", "ízeltlábúak", "a többi állatcsoport", "Az ízeltlábúak a Föld fajokban leggazdagabb állatcsoportját alkotják. A szélsőséges környezeti feltételű helyek kivételével mindenütt megélnek, a magashegységekben, a tengerek mélyén, a sivatagokban és a trópusi területeken egyaránt. Fajgazdagságuk és széles elterjedésük oka, hogy kiválóan alkalmazkodnak a környezeti feltételekhez. Az erdőkben is számos fajuk él. Megfigyelhetjük őket a talajban, az avartakaróban, a fák kérge alatt, a korhadó fatörzsekben, a cserjék és fák lombkoronájában. Szaporodásuk, egyedfejlődésük is sokféle. Életmódjuk alapján vannak közöttük növényevők, korhadékevők, ragadozók. Ennek megfelelően szájszervük is többféle.", "Az ízeltlábúak és a többi állatcsoport ismert fajszámának aránya", "A gyapjaslepke hímje és nősténye", "Figyeld meg az ábrát! Hogyan aránylik egymáshoz az ízeltlábúak és a többi állatcsoport fajszáma? A gyapjaslepke a rovarok közé tartozik, mert három pár ízelt lába, három testrésze (fej, tor, potroh) van. Testét lágy kitin fedi. Egyes években hatalmas rajokban jelenik meg. A lepke lárvája (hernyó) tetemes mennyiségű levelet fogyaszt. Tömeges elszaporodásukkor teljesen kopárrá rágnak egyes erdőrészeket. A kifejlett hernyók 6 cm hosszúak, testüket erős, sörteszerű szőrzet borítja. Nyár elején bebábozódnak, majd a kikelt lepkék párzanak. A lerakott peték áttelelnek, és csak következő év tavaszán kelnek ki.", "Az egyik legnagyobb ízeltlábú állatunk a szarvasbogár. A hímek hossza a rágókkal együtt 8-10 cm. Három testrésze (más néven testtája): a fej, a tor, a potroh, és három pár ízelt lába van. A hártyás szárnyakat kemény, kitines szárnyfedője védi, ezért a rovarokon belül a bogarak közé tartozik. A hímek rágói hatalmasra nőnek, agancsszerűek, a táplálkozásban nincs szerepük. A kifejlett állatok a sérült fákból kicsorgó nedvvel táplálkoznak. 30", "Az erdő életközössége", "fej", "rágók csáp fedőszárny", "tor", "ízelt láb potroh hártyás szárny", "A szarvasbogár testfelépítése"], ["A nőstények a korhadó fákba rakják petéiket, a kikelő lárvák az elpusztult fák belsejét rágják. Öt évig fejlődnek, közben 8 cm hosszúra nőnek. A bebábozódás után fejlődnek ki a szarvasbogarak, tehát fejlődésük teljes átalakulás.", "kifejlett rovar pete", "lárva", "báb", "A szarvasbogár teljes átalakulása", "Figyeld meg a rajzon a szarvasbogár átalakulását! Mely korábban tanult ízeltlábúak fejlődéséhez hasonló? Az erdő különböző szintjeiben mindenütt megfigyelhetjük a pókokat és változatos alakú hálóikat. A koronás keresztespók is – akárcsak a többi pókfaj – ragadozó. A hálójában fennakadó legyekkel, szúnyogokkal, bogarakkal táplálkozik. Négy pár ízelt lába van, teste két részből áll. A fej és a tor összenőtt, ez a fejtor (előtest), a másik testrésze a potroh (utótest). Koronás keresztespók", "A háló anyaga a szövőmirigyek ben képződik. A mirigy váladéka a szövőszemölcsön keresztül jut a külvilágba, s ott megszilárdul. A lábak végén lévő szövőkarmok segítségével a szálakat összefonja, és ebből készíti jellegzetes hálóját. A pók a háló közepén vagy a szélén lesben áll. A fennakadó zsákmány megremegteti a hálót, a pók ezt érzékeli, majd ráront, és csáprágójával megsebzi. A seben keresztül az áldozatba juttatja a méregmirigyének váladékát. A méreganyag elpusztítja az áldozatot, a nyálmirigyének váladéka pedig előemészti a belső szerveit. Ezt nevezzük külső emésztésnek. Az előemésztett táplálékot a pók felszívja, áldozatából csak a kitinváz marad meg.", "Figyeld meg a rajzon a pók belső szerveit! B", "A", "1.", "2. 3.", "4.", "5.", "szövőszemölcsök", "szövőmirigy", "6.", "7.", "8.", "A fejtor (előtest) B potroh (utótest) 1. ízelt láb 2. pontszem 3. tapogatóláb 4. csáprágó 5. méregmirigy", "9.", "10.", "11.", "6. szájnyílás 7. légzőszerv 8. tápcsatorna 9. peték 10. szövőmirigy 11. szövőszemölcs", "A pók szervei", "Az erdő életközössége", "31"], ["A kerek háló szövésének fő mozzanatai", "Figyeld meg a rajzon a hálószövés folyamatát! A keresztespók csomókba rakja le petéit, melyek köré hálóból burkot sző. Ez a petecsomó vagy más néven a kokon. A petékből kikelt pókok nagyon hasonlítanak a kifejlett állatokra. Növekedésük során többször vedlenek, átalakulás nélkül fejlődnek. A kullancsok a pókok rokonai. Apró, 1-2 mm nagyságú állatok. Az emlősökre, madarakra kapaszkodva, sajátos szájszervük segítségével vért szívnak. Vérszívás után a testméretük akár a tízszeresére is megnőhet. Kullancs vérszívás előtt és után", "A kullancsok veszélyes betegségeket terjesztenek, melyekkel az embert is megfertőzhetik. A megtapadt kullancsot csipesszel kell eltávolítani. Ha a csípés helye megpirosodik, vagy más tünetet tapasztalsz (fejfájás, hányinger), azonnal fordulj orvoshoz! A kullancsok a háziállatokat is megfertőzhetik. A kutyák számára is veszélyes kórokozókat terjesztenek.", "Ellenőrizd tudásodat!", "1. A gyapjaslepke mely fejlődési alakja okoz az erdőkben nagy károkat? 2. Hasonlítsd össze a gyapjaslepke, a szarvasbogár és a koronás keresztespók testfelépítését és táplálkozását! Melyek az azonosságok és a különbségek a testfelépítésükben? 3. Mi a jellemző a három ízeltlábú szaporodására?", "32", "Az erdő életközössége"], ["Az erdő életközössége A témakörben megismert növények, állatok és gombák természetes otthona, más néven élőhelye az erdő. Az erdőt még számos kisebb élőhelyre is feloszthatjuk. Minden egyes élőhelyre sajátos környezeti feltételek jellemzők. Ilyen a levegő hőmérséklete és páratartalma, a talaj összetétele, az éves csapadék mennyisége, az évszakok váltakozása, a napfénytartam. Mások például a fényviszonyok a lombkoronaszintben, és mások a gyepszintben. Eltérő a hőmérséklet a hegyvidéki erdők déli és északi oldalán. Más a talaj vízkészlete és a benne oldott tápanyagok mennyisége egy mészkőhegységben kialakult erdőben, mint egy síkvidéki tölgyerdőben.", "Az erdei pocok a talajban vagy az avarban találja meg a számára kedvező környezeti feltételeket, más fajok a korhadó fákban, a fatörzseken, a lombkoronában vagy éppen a cserjeszintben. A vaddisznó a sűrű, mocsaras erdőrészeket kedveli, a gímszarvas az idős tölgyerdőkben érzi jól magát, a fekete rigó a cserje- és a gyepszintben, a széncinege a lombkoronában, a szarvasbogár lárvája a korhadó fákban. • Nevezz meg erdőben élő állatokat! Ismertesd, hogy az erdőn belül hol van a természetes otthonuk, vagyis az élőhelyük! •M iben térnek el egymástól az egyes élőhelyekre jellemző környezeti feltételek? • Mondj példákat arra, hogy milyen módon alkalmazkodtak az egyes élőlények az élőhelyük sajátos környezeti feltételeihez!", "A lombhullató erdők növényei több szintben helyezkednek el. Minden szintnek sajátos állatvilága van", "Az élőhely és az ott élő, egymással kapcsolatban álló élőlények együttesen életközösséget alkotnak. Az emberi beavatkozásoktól mentes életközösségek önmagukat fenntartják, és folyamatosan megújulnak. Tanultunk róla, hogy az erdő élőlényei között sokféle kapcsolat alakul ki. A cserjék például fészkelőhelyet és búvóhelyet biztosítanak az állatoknak. Az erdőben élő fák és a gombafonalak együttélése nyomán jutnak tápanyagokhoz a fák és táplálékhoz a gombák. Tanultuk, hogy a zuzmótelepek két élőlény (gomba és zöldmoszat) együttélésből épülnek fel. Az erdő életközössége", "33"], ["Az élőlények közötti kapcsolatok legismertebb formája, amikor azt vizsgáljuk, hogy melyik élőlény mivel táplálkozik. Az egymással táplálkozási kapcsolatban álló élőlények táplálkozási láncokat alkotnak. A tölgyfa levelével táplálkozik például a gyapjaslepke hernyója, melyet az énekesmadarak fogyasztanak. Az énekesmadarak pedig a ragadozó madarak táplálékállatai. A makkterméssel táplálkozik az erdei egér, az erdei egér pedig a fülesbagoly fő tápláléka. Az egerek, pockok fontos táplálékállatai a rókáknak is, míg a fiatal rókát a héja fogja el. Az életközösségekben a táplálkozási láncok a növények által készített összetett anyagokra épülnek. Csak a növények képesek ugyanis arra, hogy a környezetük egyszerűbb anyagai ból (vízből és a benne oldott ásványi anyagokból, valamint a levegőben lévő szén-dioxidból) a napfény energiájának segítségével összetett anya Táplálkozási kapcsolatok az erdőben gokat képezzenek. Például cukrot, keményítőt, olajat, fehérjét, amelyek a növények különböző szerveiben elraktározódnak – leginkább a termésekben, magvakban, gumókban, hagymában, gyöktörzsben.", "Az egerészölyv dögöt is eszik", "34", "Az erdő életközössége", "Az összetett anyagok képzése során oxigén is képződik, amely a légkörbe jut. (A folyamat a levelekben megy végbe, és fotoszintézisnek nevezzük, amelyről a 7. évfolyamon tanulunk részletesebben.) Mindezek miatt a növényeket termelő szervezeteknek nevezzük. Velük táplálkoznak a növényevő állatok, amelyeket együttesen elsődleges fogyasztó szervezeteknek nevezünk. A növényevőkkel a ragadozó (húsevő) vagy más néven a másodlagos fogyasztók táplálkoznak."], ["Barna medve", "A táplálkozási kapcsolatok végén a csúcs ragadozók állnak, velük már más állat nem táplálkozik. A hazai erdők ilyen csúcsragadozója a héja, a fülesbagoly vagy a kifejlett róka. A korábban élt csúcsragadozók (barna medve, farkas, hiúz) hazánk területéről már kipusztultak. A természetvédelmi munka sikerét jelzi, hogy ezek a fajok egyes területeken újra megtelepedtek. Az utóbbi években kóborló példányaik az Északi-középhegységben ismét megjelentek.", "Farkas", "Hiúz", "Az élőlények közötti kapcsolatok nélkülözhetetlen tagjai a lebontó szervezetek. Ide tartoznak a szabad szemmel nem látható baktériumok, gombák és számos állat (férgek, ászkarákok, hangyák, rovarlárvák). Közös tulajdonságuk, hogy elpusztult növényekkel és állatokkal táplálkoznak. A bennük lévő összetett anyagokat egyszerű anyagokká alakítják, amelyekkel ismét a növények táplálkoznak. Természetes életközösségekben a termelő, a fogyaszTáplálékszegény időszakban péltó és a lebontó szervezetek egyedszáma között viszony dául a fülesbagoly nem költ. Amikor bőséges a táplálék, sok egér és lagos egyensúly alakul ki. Hosszabb időszakot tekintve pocok van az élőhelyén, akkor a egyik sem szaporodik túl a másik kárára. szokásos 4-5 tojás helyett 7 tojást Minden ember felelőssége, hogy az erdőben és minis rak, és minden fiókát felnevel. den más életközösségben megőrizze a fajok sokféle A felnevelt fiókák táplálkozásukkal ségét. Nem szabad pusztítani vagy pusztulni hagyni visszaállítják az egyensúlyt. egyetlen élőlényt sem!", "Ellenőrizd tudásodat!", "1. Mit jelentenek a következő fogalmak: élőhely, életközösség? 2. Ismertesd a táplálkozási láncok összetételét! 3. Indokold meg, miért nélkülözhetetlenek az életközösségekben a növények! 4. Mondj példákat az életközösségekben a viszonylagos egyensúlyra!", "Az erdő életközössége", "35"], ["Az erdők védelme Napjaink kiemelt természetvédelmi feladata, hogy megóvjuk erdőinket, erdővel borított területeink nagyságát; ahol pedig arra lehetőség van, ott új erdőket telepítsünk. Az erdők védelméről törvény rendelkezik, amely szabályozza többek között a fák kivágásának és újratelepítésének szabályait is. A tarvágás során bizonyos erdőterületek teljes faállományát egyidejűleg kivágják. A környezetkí mélő fakitermelés olyan gazdálkodás, amely a ter mészetes erdőfelújulásra épül. A fakitermelés során nem vágják ki az összes fát, az idősebb fák egy részét meghagyják. Az ezek terméseiben lévő magvak kicsíráznak és gyorsan fejlődnek, mivel a megritkított erdőben sok a fény. A megmaradt idős fákat csak a csemeték megerősödése után vágják ki. Az erdő tel jes megújulásához 100-120 év szükséges. Helytelen szemlélet, ha az erdőre csak úgy tekintünk, mint értékes ipari nyersanyagra vagy energiaforrásra (tüzelőanyagra). Az erdő növényei a táplálékkészítésük során elnyelik a levegő széndioxidját, és oxigént termelnek, amelyet a légkörbe juttatnak. Egy terebélyes fa évente egy ember számára elegendő oxigént termel. Oxigén nélkül nem Tarvágás lenne élet a Földön. A fák fontosak a környezetvédelemben is, ugyanis élő szűrőberendezésként megtisztítják a levegőt a porszennyeződéstől. A szűrés során a lebegő porszennyezés nekiütközik és fennakad a fák törzsén, ágain, levelein, majd onnan a talajra hull. Más jellegű szennyező anyagok lerakódnak a fák felületére, amelyet a csapadék a talajba mos. A domb- és hegyvidéken élő erdők fontosak a talajvédelemben is. A fák és az aljnövényzet gyökérzetükkel megvédik a termőréteget a csapadék káros hatásaitól, a talajeróziótól. Az elszáradt ágak, a lehulló levélzet alkotja az avartakarót. Az avarban sajátos életközösség alakul ki. A lebontó folyamatok révén a növényzet számára újra tápanyagok képződnek. Az erdők tehát fenntartják a talaj termőképességét is. Az erdők vízvisszatartó képességének nagy a jelentősége az árvízvédelemben is. Az utóbbi évek tiszai árvizeinek egyik oka a Kárpátok erdeinek kíméletlen kitermelése. Az erdő jelentősen befolyásolja az élettelen környezeti tényezők értékeit. Ha nyáron a levegő hőmérséklete az erdőn kívül 30 °C, akkor az erdő belsejében kb. 25 °C. Ugyanakkor éjszaka az erdőn kívül hűvösebb van, mint az erdőben. A levegő páratartalma is lényegesen magasabb az erdőben, mint az erdőn kívül. Környezetkímélő fakitermelés", "36", "Az erdő életközössége"], ["Figyeljétek meg a képet a talajpusztulásról! Beszéljétek meg, mi okozta a képen látható jelenséget! Tanultuk, hogy az emberi beavatkozástól mentes erdők folyamatosan megújulnak, fenntartják önmagukat. Önmaguktól megújuló energiaforrások. Mit jelent a fenntartható fejlődés? A hazai erdők fakészlete 350 millió köbméter. Ez a fák növekedésével, fejlődésével évente 11 millió köbméterrel gyarapodik. Évente 7-8 millió köbméter fát termelnek ki, így a növekedés, vagyis a fenntartható fejlődés mértéke 3-4 millió köbméter évente. Mindezekkel szemben a kőszén-, a kőolaj- és a földgázkészletek, amelyeket ma energianyerésre használunk, idővel elfogynak, a készletek kimerülnek. További probléma, hogy a felsorolt energiaforrások elégetésekor nagy mennyiségű szennyező anyag jut a környezetbe. A több száz évvel ezelőtti nagy, összefüggő erdőségek mára kisebb-nagyobb erdőkre darabolódtak fel. Az erdők közé szántóföldek, utak, települések, ipari létesítmények ékelődtek. Az őshonos erdők nagyvadállománya – csúcsragadozók nélkül is – nemzetközileg elismert. Számos világrekord trófeát viselő állatunk van (gímszarvas, dámvad, őz, vaddisznó). Egyedszámukat a vadgazdál kodás során az ember szabályozza, vagyis a táplálkozási láncok csúcsán az ember áll. Hazánk területén 3800 hektár – emberi beavatkozástól mentes – erdőrezervátum van, melyekben 72 fokozottan védett faj is él. A rezervátumokban még a kidőlt fák is védelem alatt állnak! A természetvédelmi munka célja, hogy emberi beavatkozástól mentesen érvényesülhessen az erdő önfenntartó és önmegújító képessége. Az erdők természeti értékeik mellett kikapcsolódási lehetőséget, aktív pihenést, a szabad idő hasznos el töltését is biztosítják az ember számára. Ilyen az erdei túrázás, a kocogás, a gombászás, az erdei gyümölcsök gyűjtése, az élővilág megfigyelése vagy éppen az erdő csendjének, nyugalmának átélése. Minden ember kötelessége az erdők védelme. Tilos az ágakat letördelni, a fiatal fákat megcsonkítani. A virágzó lágyszárúak is ott szépek, ahol az eredeti élőhelyük van. Készítsünk róluk fényképeket, ez őrizze meg a kirándulás emlékét! A vadon élő növények letépve és vázába helyezve nagyon rövid idő alatt elpusztulnak. Minden évben előfordulnak súlyos károkat okozó erdőtüzek. Tüzet gyújtani csak a kijelölt helyen szabad!", "Talajpusztulás az erdőirtás helyén", "• Figyeljétek meg a rajzon, hogy men�nyi anyag szükséges 1000 kg papír előállításához! • Indokoljátok meg, miért fontos a szelektív hulladékgyűjtés!", "FELHASZNÁLT Víz", "Energia", "3,8 m3", "2 800 000 l", "4750 kWh", "Hulladék papír", "1800 l", "2750 kWh", "Alapanyag Hagyományos papír", "Környezetbarát újrahasznosított papír", "Az újrahasznosítás előnyei", "Környezetszennyezés az erdőben", "Az erdő életközössége", "37"], ["Megfigyelések, vizsgálatok az erdőben Erdőt alkotó fáink: a tölgy és a bükk • Figyeld meg a lakóhelyed környéki erdőket! Állapítsd meg a tanultak alapján, hogy természetes vagy telepített-e az erdő! Képes növényhatározó segítségével határozd meg az uralkodó fafajokat! Készíts a megfigyelt fákról kéreglenyomatot, levél- és termésgyűjteményeket! • Figyeld meg a tölgyek lombkoronájában is megtelepedő sárga fagyöngyöt! Félélősködő növény, a fából szívja el a talajból felvett tápanyagokat, zöld leveleiben táplálékot készít. A fagyöngy ragadós termését a madarak fogyasztják. Ha a fagyöngy nagyon elszaporodik, az a fa pusztulását okozza. • A tölgyfák levelein vagy az avartakaróra lehullva különböző alakú gubacsokat találhatsz. Ezek belsejében valamely gubacsdarázsfaj lárvája fejlődik.", "Vágj ketté egy gubacsot! Figyeld meg a lárvabölcsőt és a lárvát! • A fa minden évben egy évgyűrűt fejleszt. Kivágott fák törzsének keresztmetszetén figyeld meg az évgyűrűket! Számold meg őket, így megismerheted a fa pontos életkorát!", "Az erdeifenyő. Gombák az erdőben • Figyeld meg a fenyőfán, hogy a sérülések helyén gyanta szivárog a fából! A sűrű gyanta befedi a sebfelületet, majd megszilárdul, és védi a fát a további károsodásoktól. Korhadó tuskókat szétbontva vagy az avartakaró felső rétege alatt megfigyelheted a lebontó gombákat. A gom bafonalak teljesen átszövik, behálózzák a növényi és állati maradványokat, kivonják belőlük a táplálékot. Ahol sok gomba él, ott egészséges az erdő fejlődése. Hiányuk valamilyen környezeti problémát jelez.", "A cserjék és a gyepszint virágos növényei • Figyeld meg a lakóhelyed környéki erdőkben, milyen cserjék élnek ott! Képes határozókönyvek segítségével határozd meg őket! • Lombhullás után könnyen megfigyelheted a cserjék ágai közé rakott madárfészkeket. Készíts a megfigyelt erdő fáinak, cserjéinek leveleiből, terméseiből gyűjteményt!", "Virágtalan növények az erdőben • Egyes zuzmófajok igen érzékenyek a levegő tisztaságára. Jelenlétükből vagy hiányukból következtethetünk az adott térség levegőminőségére. Ahol nincsenek zuzmók, ott szennyezett a levegő. A kéregszerű bevonatot alkotó zuzmók mérsékelten szennyezett környezetben élnek, a bokros és lemezes felépítésű zuzmók jelenléte tiszta levegőt jelez. Figyeld meg és rajzold le a lakóhelyed környezetében megfigyelhető zuzmókat! Tanulmányi kiránduláson mérd meg egy kiszáradt mohapárna tömegét, majd azt követően is mérd meg, hogy rövid ideig vízbe áztattad! A két adat összehasonlításából következtethetsz vízmegkötő képességükre. • Kézinagyítóval vizsgáld meg egy mohanövényen és egy erdei pajzsikán a spóratartó tokokat!", "A szarvas, az őz és a vaddisznó • A szarvas és a vaddisznó főleg éjjel jár tápláléka után, nappal ritkán figyelhetjük meg őket. Jelenlétükre rágás-, túrásnyomokból, ürülékükből és lábnyomaikból következtethetünk. Készíts gipszöntvényt a lenyomatokról!", "38", "Az erdő életközössége"], ["A róka, a sün és a mókus • Erdei kiránduláson a rókakotorékot már messziről érzékelhetjük jellegzetes szaga alapján. Ha találsz a rókalyuk bejáratánál ételmaradványokat és friss lábnyomokat, biztosan van gazdája a kotoréknak. • A mókus természetes ellensége a héja, a nyuszt és a nyest. Nyestekkel egyre gyakrabban találkozhatunk a falvakban és a városokban.", "Harkályok és énekesmadarak az erdőkben • A téli időszakban a csuszkákról, rigókról, cinegékről és még sok más énekesmadárról rendszeres etetéssel gondoskodhatsz. Érdekes megfigyeléseket végezhetsz az etetőre járó madarak életéről.", "Ragadozó madarak az erdőben • A héja a fészkét erdei utak, tisztások, nyiladékok mentén magas fákra rakja. Több évig használja. • A fülesbagoly pihenőhelye alatt sok bagolyköpetet találhatsz. Vizsgáld meg a bagolyköpetet! A csont-, szőr- és tollmaradványokból következtetni lehet zsákmányállataira.", "Ízeltlábúak az erdőben • Figyeld meg a lakóhelyed környékén az erdőben, a füves területeken és a vizek partján a különböző pókfajokat és hálóikat! Figyeld meg a lesben álló pók viselkedését! Keress a hálóban vagy az alatt kiszívott rovarvázakat! • Erdei tanulmányi kiránduláson figyeld meg az ízeltlábúak sokféleségét! Képes határozókönyvek segítségével ismerd meg minél több faj nevét! • Rostálj meg erdei talajt, a mintát közvetlenül az avartakaró alól vedd! Az átrostált, finom anyagot terítsd szét egy fehér papírlapon! Figyeld meg szabad szemmel, majd kézinagyítóval a parányi állatokat! • Sok hasznos ismeretet szerezhetsz a hangyák megfigyelésével. Mi mindent hordanak magukkal a hangyabolyba? Tegyél kenyérmorzsát a sürgő-forgó hangyák útjába! Figyeld meg, mi fog történni! • Bonts szét egy korhadó farönköt! Csipesz segítségével gyűjtsd össze a benne élő állatokat! Figyeld meg sokféleségüket!", "Az erdő életközössége • Tanulmányi kiránduláson keress az erdőben olyan nyomokat, amelyekből a ragadozó állatok jelenlétére lehet következtetni (csont-, szőr-, tollmaradványok)!", "Az erdők védelme • Figyeld meg a lakóhelyed környéki erdőkben az emberi tevékenységeket (fakitermelés, gépek által kitaposott utak, nem engedélyezett szemétlerakók stb.)! Írd le tapasztalataidat! • Töröld le nedves papír zsebkendővel az erdőszéli fák levelét, majd ismételd meg ezt többször az erdő belseje felé haladva! Figyeld meg a zsebkendő színének változásait! Jegyezd fel tapasztalataidat!", "Az erdő életközössége", "39"], ["Herman Ottó munkássága", "Herman Ottó", "Minden tudományterület számára fontos, hogy legyenek olyan képviselőik, akik a tudományos ismereteket képesek mindenki számára közérthető formában közvetíteni. A természettudományokban ilyen neves személyiség volt Herman Ottó (1835–1914). Herman Ottót az utolsó nagy polihisztornak is nevezik, mivel több tudományterülettel is foglalkozott, például politikával, régészettel, őslénytannal, madártannal és néprajzzal is. Néprajzi kutatómunkája során megismerte a magyar nép hagyományos életmódját, az ember és a természet szoros kapcsolatát, együttélését. Iskolás éveit Miskolcon kezdte, majd Bécsben tanult. Közben hat évig sorállományú katona lett, és csak ezt követően fejezte be tanulmányait. 1879-től 1886-ig a Függetlenségi Párt országgyűlési képvise lője volt. Képviselői munkájában fellépett a népoktatás színvonalának emelésért, hogy az emberek műveltebbek és politikailag érettebbek legyenek. Több felszólalásában a közegészségügy érdekében is szót emelt. Érdekes gondolata volt, hogy a társadalomban azt a harmóniát kellene megteremteni, amely a természetben az élőlények között van.", "A Halászélet, pásztorkodás című könyv egyik rajza a csíkászról", "Munkásságának egyik alapgondolata az ember és a termé szet együttélésének kutatása volt. Ősi foglalkozásokról (halászélet, pásztorkodás) írt néprajzi műveiben bemutatta, hogy régen az emberek nem akarták legyőzni a természetet. A gazdálkodási munkájuk során alkalmazkodtak a természeti feltételekhez. A magyar halászatról írt könyvében összegyűjtötte a régmúlt halászati eszközeit, leírta azok használatát és a halfogás ősi módszereit (csíkászok, pákászok). Könyvében kifejtette, hogy a halgazdaságokat csak úgy lehet fenntartani, ha a zsákmányolt halmennyiséget tervszerűen pótolják, fenntartva ezáltal a természet egyensúlyát. Könyve bevezetőjében ezt írta: „Szememet nem vetem magasba, sem a külföld felé, mert valójában csak az lelkesít, ami lelkesítette régebbi íróinkat, akik elöljáró beszédjeikkel megmondották, hogy a nemzetnek akarnak szolgálni, s ezt a könyvben be is váltották; én is erre törekedtem.”", "A Természettudományi Társaság megbízta a magyarországi pókfajok leírásával. Többéves gyűjtőmunkájának eredményét egy háromkötetes műben jelentette meg. 318 pókfajt írt le, melyek között 34 addig ismeretlen faj volt. 1875-től a Magyar Nemzeti Múzeum tudományos munkatársa lett. 1877-ben Természetrajzi Füzetek címmel folyóiratot alapított, amelyet tíz évig maga szerkesztett. 1883-ban részt vett az Állatvédő Egyesületet megalapításában. 1893-ban létrehozta a Magyar Ornitológiai Központot, amelynek igazgatója is volt egyben. Aquila címen madártani folyóiratot indított. 1891-ben Miskolcon egy ház alapozása során különös formájú kőleleteket találtak. Felismerte a leletek egyediségét, azt, hogy több tízezer évvel ezelőtti kőszerszámokról van szó. Mindez bizonyítékul szolgált arra, hogy a Kárpát-medencében már az őskorban éltek emberősök. A leleteket két évvel később egy kiállításon mutatta be. Az ősi kőkori kultúráról szóló elméletét a Szeleta-barlangban 1906-tól végzett ásatások megerősítették. A barlangban talált kő- és csontleletek arra utaltak, hogy itt ősemberek éltek. Az őslénytan (paleontológia) kutatása mellett tovább folytatta néprajzi gyűjtőmunkáját. Szinte az egész országot bejárta, és összegyűjtötte a régi néprajzi, nyelvészeti és ősfoglalkozási emlékeket. Munkái közt kiemelkedő jelentőségű a magyar halászatról írt könyve, mellyel megalapozta a hazai néprajzkutatást.", "40", "Az erdő életközössége"], ["Akkoriban – a nagy lecsapolásokat megelőzően – Herman Ottó még felkereshette a régi mocsaras-lápos területeket, ahol az emberek a halászatot ősi formában végezték. Megfigyelte, leírta és lerajzolta ennek a foglalkozásnak a formáit és eszközeit. Jelentős volt az állatpreparátori munkája is. Az 1896-os millenniumi ünnepségeken gyűjteményéből sikeres kiállítást rendezett, amelyet később Párizsban is bemutattak. 1900-ban javaslatot tett arra, hogy az ország valamennyi népiskolájában szervezzenek „Madarak és fák napja” programot. 1901-ben jelent meg híres, a tudományt népszerűsítő könyve A madarak hasznáról és káráról címmel. Munkájában a hazai madarak életét, életmódját, a környezetükhöz való alkalmazkodásukat írta le. Kitért az ember és a madárvilág ősi kapcsolatára és a madárvédelem fontosságára. Többek között ezt írta könyve bevezető részében: „[…] magában a természetben nincsen sem káros, sem hasznos madár, mert csak szükséges van. Arra szükséges, hogy végezze a természetben azt a munkát, amelyet más teremtmény el sem végezhetne. Károssá és hasznossá az emberre nézve a madarat csak az ember maga teszi akkor, amikor feltöri a gyepet és beveti oly maggal, mely tömeges termést ad, olyant, amely madártáplálék is; vagy kertet, szőlőt állít oda, ahol azelőtt nem volt. Megszámlálhatatlan kincs az, amit a czinegék, a poszáták, a légykapók és mások pihenést alig ismerő szorgalma az okos gazdának jövedelmez. […] Van ám erre még számbeli kalkulus is: A picziny királykamadár éven át hárommilliónál is több rovart emészt föl mindenféle állapotában: hol mint petét, hol mint bábot, hol mint kifejlett rovart […]. A kék czinege éven át hat és félmillió rovart pusztít el, de aztán még hol 12, hol 16 fiókát fölnevel, ami megint azt jelenti, hogy egy ilyen czinege család huszonnégy millióig való rovart fogyaszt el, vagyis ennyinek kártételétől óvja meg a kertet, az erdőt […].” A „Madarak és fák napja” elképzelése 1906-ban valósult meg. A vallás- és közoktatási miniszter, gróf Apponyi Albert elrendelte, hogy a népiskolákban ünnepélyt tartsanak Madarak és fák napja néven. Ez a szép hagyomány az 1990-es évektől újra feléledt, sőt az 1994-ben hozott miniszteri rendelet előírja, hogy május 10-én minden iskolában tanítás nélküli munkanap keretében szervezzenek Madarak és fák napi programot. Herman Ottó a magyar nyelv minden szépségét bemutató módon írta meg ismeretterjesztő könyveit. Kitűnő előadó is volt. Kortársai számára mindig élvezetes, érdeklődést felkeltő előadásokat tartott állattani, őslénytani és néprajzi kutatómunkáinak eredményéről. Munkásságának nagy érdeme, hogy több mint 120 évvel ezelőtt elsőként fogalmazta meg a környezet- és természetvédelem gondolatát. „A rétségek és a műveletlen, gazdátlan területek ősi idejében zengett Magyarország a madarak énekétől, megnyüzsgött tőlük a levegőég, a vizek és az erdők rengetege. Ám napjainkban nagyon megváltozott és a rétek eltűnésével, lecsapolásával belévágott az eke az ősföldbe és véget vetett a madártanyának. Hogy szép, tiszta vetéses táblákat nyerjenek, kivágták a legkisebb bokrot is, és evvel lassanként elvonták a leghasznosabb madaraktól a fészkeléshez szükséges alkalmatosságot, ami pedig öreg hiba volt. A régentén madárénektől zengő táj csöndes, sőt néma lett, a szemet sem gyönyörködteti a madárnak üdítő szemléllése […].” Herman Ottó nevét ma számos intézmény (múzeum, iskola) és országos biológiai tanulmányi verseny őrzi. A Herman Ottóérmet pedig a karszt- és barlangkutatásban kiemelkedő személyeknek ítélik oda. Napjaink kutatói számára számos műve még most is forrásértékű. Ismertebb művei: •M agyarország pókfaunája I–III. Budapest, 1876–79; • A magyar halászat könyve I–II. Budapest, 1887–89; • A madárvonulás elemei Magyarországon. Budapest, 1895; • Az ősfoglalkozások: halászat és pásztorélet. Budapest, 1898; • A magyar ősfoglalkozások köréből. Budapest, 1899; • A madarak hasznáról és káráról. Budapest, 1901.", "Herman Ottó nyári lakhelye, az úgynevezett „Pele-ház”", "Az erdő életközössége", "41"], ["Rendszerezzük ismereteinket!", "42", "Erdőt alkotó fáink: a tölgy és a bükk", "Az erdő olyan életközösség, ahol az uralkodó növények a fák. Hozzájuk társulnak a lágyszárúak és a virágtalan növények, a gerinctelen és a gerinces állatok és sokféle gomba. Összefüggő tölgyerdők a hegy- és dombvidéken élnek, kisebb állományuk az Alföldön is fennmaradt. Az idős tölgyerdőkben a fák ritkán állnak, a lombkorona nem záródik össze, ezért a talajszintre is elegendő fény jut. Aljnövényzetük gazdag. A tölgyfajok egylaki növények, a termős virágok magányosan állnak, a porzós virágok barkavirágzatot alkotnak. A szélbeporzás után kialakul a makktermés. A bükkerdők a hegyvidékek 600 méternél magasabb részein a hűvös völgyekben élnek. Lombkoronájuk zárt, ezért kevés benne a fény. Aljnövényzetük csak lombfakadás előtt gazdag. A bükk szélporozta egylaki növény, kupacsokkal fedett makktermése van.", "Az erdeifenyő. Gombák az er dőben", "Őshonos fenyőerdők az Alpokalján élnek. Jellemzőjük a zárt lombkorona. A talajszintre kevés fény jut, aljnövényzetük ezért szegényes. Az erdeifenyő örökzöld, egylaki, nyitvatermő növény. A termős virágok tobozvirágzatot alkotnak, a virágporszemeket a szél szállítja a szabadon álló magkezdeményre. A megporzás után a termőpikkelyek tövén kialakulnak a szárnyas magok. A gombák egy része szoros kapcsolatban van a fák gyökérzetével. Felveszik a fák számára a vizet és a benne oldott tápanyagokat, a fáktól pedig kész táplálékot kapnak. Két élőlény között az ilyen kapcsolatot együttélésnek nevezzük. A kalaposgombák (például gyilkos galóca, erdei csiperke) gombafonalak tömörüléséből épülnek fel. Részeik: a tönk és a kalap. A kalap alsó részén fejlődik ki a termőréteg, amelyben hatalmas mennyiségű spóra képződik. A gombafonalak átszövik az avart, a talaj felső rétegét, és kész tápanyagokat vesznek fel.", "A cserjék és a gyepszint virágos növényei", "A cserjék közös jellemzője, hogy nincs törzsük, közvetlenül a talaj felett elágaznak. Fontosak az erdő életközösségében, mivel fészkelőhelyet, búvóhelyet, táplálékot biztosítanak az állatoknak. Az erdőszéli cserjesor felfogja a szelet, és csökkenti a talaj és a növényzet párologtatását. A kökénynek ágtövise, a vadrózsának tüskéje van. Feltűnő színű virágaikat a rovarok porozzák be. A mogyoró kora tavasszal virágzik, a termős virágok szélbeporzásúak. A gyepszint leggyakoribb virágos növénye a hóvirág. Áttelelő szerve a hagyma.", "Az erdő életközössége"], ["Virágtalan növé nyek az erdőben", "A zuzmók, mohák, páfrányok virágtalan növények. Közös jellemzőjük, hogy spórákkal szaporodnak. Fontosak az erdő életközösségében, táplálékul szolgálnak az állatoknak, és részt vesznek a talajvédelemben és a talajképződésben is. A zuzmók telepes növények, gombafonalakból és moszatokból épülnek fel. A mohák is telepes szerveződésűek, valódi gyökerük, száruk és levelük nincsen. A táplálékukat a szár- és levélszerű képződményeikben készítik. Az erdei pajzsikának már valódi gyökere, szára és levele van. A spórák a levél fonáki részén, a spóratokban képződnek. A mohákhoz hasonlóan a spórákból előtelep képződik, majd kifejlődik az új növény.", "A gímszarvas, az őz és a vaddisznó", "A gímszarvas és az őz párosujjú patás, növényevő, összetett gyomrú, kérődző állat. A hím állatok fején lévő agancs csontképződmény, amelyet minden évben elhullatnak, és újat fejlesztenek helyette. Az őz gyakran megtelepszik az erdőn kívül, mezőgazdasági területek környékén, ahol kisebb facsoportok, cserjések is vannak. A vaddisznó párosujjú patás, mindenevő, vagyis növényi és állati eredetű táplálékot fogyaszt. Zápfogainak felülete gumós, szemfogai agyarrá fejlődnek. Csúcsragadozók hiányában mindhárom állat egyedszámát a vadgazdálkodás során vadászattal szabályozzák.", "A róka, a sün és a mókus", "A róka ma már az erdőn kívüli élőhelyeken is gyakori állat. Életmódja ragadozó, zápfogainak felülete éles, tarajos, a zápfogak ollószerűen záródnak össze. A sün testét elszarusodott szőrszálakból képződött tüskék fedik. Csigákkal, férgekkel, rovarokkal táplálkozik. Rovarevő fogazatának fő jellemzője, hogy valamennyi fogtípusa hegyes. Valódi téli álmot alszik. A mókus a lombkoronában él. Fogazata rágcsálófogazat, a rügyek és magvak mellett azonban állati eredetű táplálékot is fogyaszt. Megszakított téli álmot alszik.", "Harkályok és énekesmadarak az erdőben", "Az erdő madarai táplálkozásuk során felosztják egymás között az erdő élőhelyeit. Ez a magyarázata annak, hogy ilyen sokféle faj tud megélni az erdőkben. A harkályok közös jellemzője, hogy kúszólábuk van, farktollaik erősek, véső alakú csőrük és hosszú, kiölthető nyelvük van. A korhadt fákban, a fakéreg alatt megbúvó rovarokkal táplálkoznak. Tojásaikat odúkban költik ki. A széncinege a lombkoronában keresi táplálékát. Az örvös légykapó a levegőben fogja el a repülő rovarokat, a csuszka a kéregrepedésekből csipegeti ki őket, a fekete rigó az avarban keresi táplálékát.", "Az erdő életközössége", "43"], ["44", "Ragadozó mada rak az erdőben", "A ragadozó állatok táplálkozásukkal szabályozzák a táplálékállataik egyedszámát. A héjának és az erdei fülesbagolynak horgas, hegyes csőre és erős, hegyes karmokban végződő fogólába van. A héja nappal vadászik, kiváló a látása, és gyors, cikázó a repülése. Az erdei fülesbagoly nappal pihen, és éjjel szerzi meg zsákmányát. Érzékszervei közül különösen a hallása kiváló. A héja énekesmadarakkal, egerekkel, pockokkal, mókusokkal, fácánokkal, galambokkal táplálkozik. Mindkét madár állandó madarunk.", "Ízeltlábúak az erdőben", "Az állatvilág legnépesebb csoportját az ízeltlábúak alkotják. A gyapjaslepke bizonyos években tömegesen elszaporodik. Lárvái (hernyók) tarrá rágnak bizonyos erdőrészeket, szinte minden zöld növényi részt elfogyasztanak. A szarvasbogár az idősebb tölgyesekben él. Teljes átalakulással fejlődik. Lárvája több évig a korhadó fatörzsekben él. A rovarok csoportján belül a bogarakhoz tartozik, mivel első pár szárnya kemény fedeles szárny. A koronás keresztespóknak is ízekből tevődik össze a 4 pár lába. A feje és a tora fejtorrá nőtt össze, amit előtestnek is nevezünk, a potrohát pedig utótestnek. Jellegzetes szerve a csáprágó, a méreg- és a szövőmirigy. Petéiből átalakulás nélkül fejlődnek ki a pókok.", "Az erdő élet közössége", "Az életközösség élőhelyből és egymással szoros kapcsolatban álló élőlényekből áll. Az életközösségekben a növények a termelő szervezetek, mivel a környezetük egyszerűbb anyagaiból (vízből, szén-dioxidból) a napfény energiáját felhasználva összetett anyagokat képeznek (cukrot, keményítőt, fehérjét, olajat). A fogyasztók vagy növényevők, vagy állatokkal táplálkozó ragadozók. A táplálkozási láncok végén a csúcsragadozó áll. Természetes életközösségekben a termelők és a fogyasztók között viszonylagos egyensúly alakul ki. A hazai erdőkben a csúcsragadozó szerepét az ember veszi át.", "Az erdő életközössége"],
