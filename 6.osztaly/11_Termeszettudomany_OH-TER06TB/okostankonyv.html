yezetében él tovább. A barna varangy 15 cm hosszúságával a legnagyobb hazai békafajunk. Nyirkos, hűvös erdőkben, zöldségeskertekben, szántóföldek környékén él. Csak a szaporodási időszakban keresi fel a vizet. Védekező szerve a fej két oldalán kidülledő fültőmirigy, amely mérgező váladékot termel. Veszély esetén a valódi méretének a kétszeresére is képes felfújni magát, ami számos támadójával szemben hatásos védekezési mód.", "Barna varangy", "Éjjel jár tápláléka után. Főleg rovarokat, csigákat, férgeket zsákmányol, de megeszi a fiatal egereket, pockokat is. A zöldséges- és gyümölcsöskertek környékén különösen sok kártevőt fogyaszt, ezért a varangy is fontos a kártevők elleni természetes védekezésben. Csak a tudatlan emberek pusztítják a békákat. Kora tavasszal a párzási időszakban tömegesen vonulnak a békák a szaporodási helyükre, valamilyen vizes élőhelyre. Ilyenkor gyakran másznak át az úttesteken, ahol tömegesen tapossák el őket a gépjárművek. Az ország számos helyén van már békamentő akció. A békák vonulási útvonalában, az úttest szélére fóliából kerítést építenek. A békák, miközben keresik az átjárást, a talajba süllyesztett gyűjtőedényekbe esnek. A gyűjtőedényekbe került békákat aztán átviszik a vizes élőhelyre, ahol majd szaporodhatnak. Sok helyütt táblákat is kihelyeznek, óvatos vezetésre figyelmeztetve az autósokat.", "Békamentő akció Hont határában", "Vizek, vízpartok életközössége", "179"], ["A békák rokonai a gőték és a szalamandrák is. Testfelépítésükben lényeges különbség, hogy törzsük hengeres, és farokban végződik. A pettyes és a tarajos gőte az ország minden vizében megtalálható. A foltos szalamandra a Bükk hegységben és az Alpokalján él.", "Tarajos gőte", "Foltos szalamandra", "A békák, gőték és szalamandrák a két éltűek állatcsoportjába tartoznak. Az elnevezés arra utal, hogy két életterük van. Mindegyik állat a vizbe rakja petéit, a lárvák ott fejlődnek ki. Ezt követően a kifejlett egyedek vagy a vízben, a víz közelében élnek (kecskebéka), vagy elhagyják azt (barna varangy, foltos szalamandra).", "Pettyes gőte", "Ellenőrizd tudásodat!", "1. Mi a jellemző a kecskebéka kültakarójára, légzésére és testhőmérsékletére? 2. Hogyan mozog a szárazföldön és a vízben? 3. Mi segíti mozgását? 4. Hova rakja a petéit? Melyek a lárvák fejlődésének főbb változásai? 5. Mi a jellemző a kecskebéka és barna varangy életmódjára? 6. Mi a különbség a kecskebéka és a barna varangy élőhelye között?", "180", "Vizek, vízpartok életközössége"], ["A vízisikló és a mocsári teknős A vízisikló 1-1,5 méter hosszú. A többi kígyóhoz hasonlóan a mellső és a hátsó végtagjai elcsökevényesedtek. Színe többnyire szürkéskék, hasán fehér foltokkal. A többi hazai kígyótól a feje két oldalán lévő élénksárga, félhold alakú folt alapján lehet megkülönböztetni. Testét a háztetők cserepeihez hasonlóan egymásra boruló, száraz sza rupikkelyek fedik. A pikkelyek védik a környezeti hatásoktól, és meggátolják testének kiszáradását. A fejét és hasi oldalát a pikkelyek összenövésével képződött szarupajzsok borítják. Légzőszerve fejlett tüdő. A szorosan záródó száraz pikkelyek nem is teszik lehetővé, hogy a bőrén keresztül lélegezzen.", "A keresztes vipera és a vízisikló feje", "A vízisikló testfelépítése", "Figyeld meg a rajzon a vízisikló testrészeit! Különítsd el a fejet, a törzset és a farki részt! Jól úszik a víz felszínén és a vízbe merülve is. A szárazföldön jellegzetes hullámvonalban, S alakú mozgással halad előre. Ezt nevezzük kígyózó mozgásnak. Egerek, pockok után kutatva ügyesen kúszik a szűk járatokban. Ilyenkor a haspajzsait külön-külön, hullámszerűen mozgatva halad előre. Változatos mozgásformáit a hajlékony ge rincoszlopa és a hozzátapadó erős izomzata biztosítja. Gerincoszlopa 100-nál is több csigolyából tevődik össze. Kétágú nyelve tapogató- és szaglószerv is egyben. Ragadozó, főleg halakkal és békákkal táplálkozik, melyeket a nagyra nyíló szájában lévő apró, hátrahajló fogaival ragad meg. Méregfogai nincsenek, áldozatait egyben nyeli le. Nemcsak a szája, a bélcsatornája is tágulékony, így a testénél szélesebb állatokat is képes lenyelni.", "A vízisikló halat zsákmányol", "Vizek, vízpartok életközössége", "181"], ["Természetes ellenségei a gólyák, a gémek és a rétihéják. Változó testhőmérsékletű állat. Ős�szel a vízisiklók fagymentes helyeken összegyűlnek, telelőközösséget alkotva, és téli álmot alszanak. A szaporodási időszakban puha talajba vagy korhadt, nyirkos fába 20-30 lágy héjú tojást rak. A tojásokat a nap melege költi ki. Az utódok növekedésük során többször vedlenek, ilyenkor egyben vetik le kültakarójuk külső felszínét. A vízisikló tojásaival", "A mocsári teknős 20 cm nagyságú. Jellegzetessége, hogy a hasi és a háti oldalon szarupajzsokból felépülő páncél védi testét. Veszély esetén a páncélba visszahúzza fejét és a végtagjait. Figyeld meg a tankönyv rajzán a teknős vázát! A mocsári teknős szarupáncélja", "A teknős váza", "A teknős életmódja ragadozó. Kisebb halakkal, csigákkal, férgekkel, lárvákkal táplálkozik, de elfogyasztja az elhullott állatokat is. A nagyobb dögöket hegyes karmaival szétmarcangolja, majd éles szarukávával fedett állkapcsaival felaprítja. Rágás nélkül nyeli le táplálékát.", "182", "Vizek, vízpartok életközössége"], ["Lágy héjú tojásokkal szaporodik. 9-10 tojását a parti öv homokos talajába ássa el. Nyár végén kelnek ki a 2 cm nagyságú kis teknősök. A siklókéhoz hasonlóan a mo csári teknős testhőmérséklete is változó. A téli időszakot az iszapba ásva vészeli át, téli álmot alszik. Mely tulajdonságokban hasonlít a mocsári teknős a vízi siklóhoz? A mocsári teknős tojásaival", "A keresztes vipera a hazánkban élő mérges kígyók egyike. Jellegzetes mintázatáról kapta a nevét. 60-80 cm nagyságú, a Zemplénihegységben, a Tisza felső folyásánál, Zala és Somogy vármegyében fordul elő. Élőhelye csökkenése miatt ma már csak kis számban találkozhatunk vele. Ritkán kerül a szemünk elé, mivel igen óvatos állat, többnyire az ember közeledtére már rejtekhelyére húzódik. Ha valakit mégis megmarna, azonnal orvoshoz kell fordulni, mivel mérge súlyos tünetek kialakulását okozhatja.", "Ellenőrizd tudásodat!", "1. Mi borítja a vízisikló és a mocsári teknős testét? 2. Ismertesd a vízisikló mozgását a vízben és a szárazföldön! 3. Miből épül fel a teknős páncélja? 4. Hasonlítsd össze a vízisikló és a mocsári teknős táplálkozását és szaporodását!", "Vizek, vízpartok életközössége", "183"], ["A vizek, vízpartok madarai Az erdő és a füves területek életközösségeinek megismerésekor tanultuk, hogy az élőlények felosztják egymás között az élőhelyet. Így mindegyiknek elegendő táplálék, búvó- vagy fészkelőhely jut. Mindez előnyös számukra, mivel nem versengenek egymással, és biztonságban felnevelhetik utódaikat. A tőkés réce a házi kacsa őse. A vízi növényzetben gazdag élőhelyeket kedveli, de megtelepszik a települések környezetében lévő mesterséges tavakon is. Testfelépítése a vízi életmódhoz alkalmazkodott. Csónak alakú testével kis ellenállással tud úszni. Az úszást segíti a lábujjai között feszülő úszóhártya. Tollászkodás során fartőmirigye zsíros váladékával bekeni tollait, így azok puhák maradnak, és a víz lepereg róluk. Kiválóan repül. A tőkés réce gácsér, nászruhában", "A táplálék megszerzését lemezes csőre segíti. Kiszűri a vízből és az iszapból az apró férgeket, rovarlárvákat, csigákat. Friss növényi hajtásokat, elhullatott gabonaszemeket és kisebb halakat is fogyaszt. A parti öv növényzete között fészkel. 8-10 tojást rak, melyekből 28 nap után kelnek ki a fészekhagyó kiskacsák. Az anyjuk a teljes kifejlődésükig együtt tartja őket.", "A tőkés réce tojója és fészekhagyó fiókái", "A tőkés réce testfelépítése", "184", "Vizek, vízpartok életközössége", "Figyeld meg a rajzokon, hogyan alkalmazkodott a tőkés réce testfelépítése a vízi életmódhoz!", "Az úszó- és gázlómadarak csőre és lába"], ["A fehér gólya természetes élőhelye a fákkal tarkított vizes rét. Többségük azonban ma már az emberi települések környezetében telepszik meg. Ágakból készített nagy fészkét villanyoszlopokra, a házak kéményeire építi. Így lett a magyar emberek egyik legkedveltebb madara, amelyről számos népdal, mese és egyéb irodalmi mű is szól.", "A gólya és a gém repülése", "A gólya kiválóan repül, nagy szárnyai mozgatásával gyorsan halad. Jellemző mozgása a vitorlázórepülés. Kiterpesztett szárnyakkal – kihasználva a felfelé szálló légáramlatokat –, a szárnyak mozgatása nélkül nagy távolságokat tesz meg. A gólya lába gázlóláb. Lábujjai között felületnövelő hártya van, így biztonságosan mozog mocsaras területeken is. Az ujjak feletti rész hosszú, tollatlan, pikkelyekkel fedett, ezt csüdnek nevezzük. A csüd feletti rész a lábszár, amely szintén hosszú, és tollak fedik.", "A fehér gólya csőre és lába", "Figyeld meg a rajzon a fehér gólya testfelépítését és tollazatának színét! Táplálékát nyílt füves területeken vagy vízparti élőhelyek környékén keresi, ahol szabad kilátása van. Nádasba, sűrű növényzet közé nem megy. A táplálék megszerzését éles látása segíti. Hosszú, hegyes csőrével szinte minden mozgó és elejthető élőlényt zsákmányul ejt. Főleg egerekkel, pockokkal, békákkal, siklókkal, férgekkel és csigákkal táplálkozik, de elfogja a földön fészkelő madarak fiókáit is.", "Táplálékot kereső fehér gólyák", "A kora tavasszal visszatérő gólyapárok felújítják régi fészküket. A tojó 4-5 meszes héjú tojást rak. A fészeklakó fiókákat a két szülő felváltva eteti. Néhány hónap után a fiókák megerősödnek, és kirepülnek. A fehér gólya költöző madarunk. Nyár végén nagy csapatokba verődnek, és Afrika középső és déli részére vonulnak. Vizek, vízpartok életközössége", "185"], ["A gólyáéhoz hasonló a testfelépítésük a gémfélék családját alkotó madaraknak. Idetartozik a szürke gém, a vörös gém, a kis kócsag és a nagy kócsag. Nagy telepekben költenek, ezeket akár 80-100 madár is alkothatja. Főleg halakkal, siklókkal, egerekkel, pockokkal, madárfiókákkal táplálkoznak. Áldozatukat hegyes csőrükkel szinte felnyársalják, majd egyben lenyelik.", "Nagy kócsag", "A gólyák vonulási útvonala", "Figyeld meg az ábrán a fehér gólyák vonulási útvonalát!", "Barna rétihéja", "A nagyobb, nádasokkal szegélyezett vizes élőhelyek csúcsragadozó madara a barna rétihéja. Közel 60 cm nagyságú, szárnyainak fesztávolsága eléri a 130 cm-t. Testfelépítése, életmódja az erdő életközösségében megismert héjáéhoz hasonló. Kiválóan repül, békákkal, vízimadarakkal, siklókkal, egerekkel, pockokkal táplálkozik. Nádasokban rakja 0,5 méter magas, 1 méter átmérőjű fészkét.", "A vizes élőhelyeken sok sirályfaj is él. Leggyakoribb közülük a dankasirály. Főleg rovarokkal táplálkozik, ezért gyakran láthatjuk a frissen felszántott földeken. Megeszi a hulladékokat is. A nem megfelelően kezelt szemétlerakó helyeket tömegesen ellepik. A kárókatona (más néven kormorán) is telepekben fészkel. Zsákmányszerzéskor a víz alá bukik, lábait evezőként használja. Gyakori, hogy a sikeres zsákmányszerzésért több kormorán társul egymással. A vízben tollazatuk átnedvesedik. Ezért gyakran láthatjuk őket szétterpesztett szárnyakkal, amikor is tollazatukat szárítják.", "Ellenőrizd tudásodat!", "1. Ismertesd, hogyan alkalmazkodott a tőkés réce teste a vízi életmódhoz! 2. Mi jellemző a fehér gólya testfelépítésére, táplálkozására és szaporodására? 3. Indokold meg, mi lehet a gólyák költözésének az oka! 4. Mi árulja el a barna rétihéja testfelépítésén, hogy ragadozó madár?", "186", "Vizek, vízpartok életközössége"], ["A vizek, vízpartok életközössége A vízi, vízparti élőhelyeken is, mint a korábban megismert fás és füves élőhelyeken, az élőlények között szoros kapcsolatok alakultak ki. Az élőhelyen együtt élő élőlények életközös séget alkotnak. Figyeld meg a tankönyv rajzát az életközösség fogalmáról! A vízi, vízparti életközösségek termelő szervezetei a fák, a parti öv lágy szárú növényei, a hinarasok és a lebegő plankton növényei. A növények által termelt összetett anyagokkal táplálkoznak az elsődleges fogyasztók, vagyis a növényevők. A másodlagos, harmadlagos fogyasztók a húsevő állatok.", "Vízisikló békát zsákmányol", "A táplálkozási láncok a termelő szervezetekre épülnek, a lánc végén a csúcsragadozó áll. Például: a plankton növényei – a plankton állatai – békalárva – szitakötőlárva – dévérkeszeg – lesőharcsa.", "• Figyeld meg az ábrán a táplálkozási lánc felépítését! • Beszéljétek meg, mi történne akkor, ha a lánc egyes élőlényei kipusztulnának!", "Táplálkozási lánc a vizek életközösségében", "Természetes vizekben a táplálkozási láncok viszonylagos egyensúlyt alakítanak ki a termelő és a fogyasztó szervezetek között. Egyik sem szaporodik túl a másik kárára, minden élőlénynek elegendő élőhely és táplálék jut.", "Vizek, vízpartok életközössége", "187"], ["Az életközösségekben a lebontó szervezetek biztosítják az anyagok állandó körforgását. A lebontók közé tartoznak a baktériumok, a gombák, a talajban vagy az iszapban élő különböző férgek és rovarlárvák. Az elpusztult élőlények maradványaival, törmelékeivel táplálkoznak. Az összetett anyagokat egyszerű anyagokká alakítják, amelyek vízben oldódva a növények tápanyagai lesznek. A táplálkozási láncokon keresztül tehát az anyagok állandó körforgást végeznek, ezt nevezzük az életközösségek anyagforgalmának. Az életközösségekben az élőlények nemcsak egymással, hanem az élettelen környezeti tényezőkkel is szoros kapcsolatban vannak. Befolyásolja életüket az évszakok váltakozása, a napfény, a levegő hőmérséklete, a csapadék mennyisége, a talaj összetétele. (Mindezekről a 7. évfolyamon tanulunk részletesen.) A halak életműködéseit például alapvetően a víz hőmérséklete szabályozza. Amikor a víz hőmérséklete +4 °C-ra süllyed, a pontyok nagy csapatokban összegyűlnek, és elvermelnek. Életműködéseik (légzés, szívműködés) szinte teljesen leállnak, nem mozognak, nem táplálkoznak. Ez a környezeti tényezőnek a minimális (legalacsonyabb) értéke, amit még elviselnek, életben maradnak. Ha tovább hűlne a víz, elpusztulnának. Tavasszal, amikor emelkedik a víz hőmérséklete, életműködéseik is felgyorsulnak. Ha a víz hőmérséklete eléri a 20 °C körüli értéket, az a legkedvezőbb számukra, ilyenkor életműködéseik felgyorsulnak. A szaporodásukhoz is ez a hőmérséklet a legkedvezőbb. A környezeti tényezőnek a 20 °C körüli értékét nevezzük optimumnak. Nyári forróságban, a sekély vizű tavakban a víz hőmérséklete tovább emelkedhet. Tartósan 26 °C feletti (maximum) vízben a halak elpusztulnak. Ilyenkor ugyanis felgyorsulnak a tóban a lebontó folyamatok, káros gázok szabadulnak fel. A meleg vízben lényegesen kevesebb az oxigén, és olyan élőlények (például bizonyos moszatok) A ponty élőhelye szaporodnak el, amelyek a halak életére kedvezőtlenek.", "Figyeld meg az ábrát, amely a ponty életműködéseit szemlélteti a víz hőmérsékletének függvényében! 188", "Vizek, vízpartok életközössége", "optimum életfolyamatok", "A környezeti tényezők az élővilágra nézve lehetnek kedvezőek (optimális) és kedvezőtlenek. A fenti példából látjuk, hogy a változásokat csak bizonyos határértékeken belül viselik el. Az élőlényeknek ezt a tulajdonságát tűrőképességnek nevezzük. A tűrőképesség határait átlépve elpusztulnak.", "minimum", "20 °C tűrőképesség", "maximum", "Tűrőképesség-grafikon", "hőmérséklet"], ["A róka a környezetével szemben tág tűrőképességű", "A vidra a hazai vizek csúcsragadozója", "A szűk tűrőképességű élőlények a környezet változásait csak kismértékben viselik el. Ilyen például a sebes vizű patakokban élő pisztráng vagy a költöző madaraink. A tág tűrőképességű fajok a környezeti tényezők szélsőséges változásait is elviselik. A túlélés gyakori formája például a növények áttelelő szerve, a termésekbe zárt magvak, a szárazságtűrés különböző formái vagy egyes állatok téli álma, a vadon élő emlősök szőrzetének megvastagodása. Pisztrángok csak az oxigénben gazdag vizekben élnek", "Ellenőrizd tudásodat!", "1. Határozd meg az életközösség fogalmát! 2. Miért nevezzük a növényeket termelő szervezeteknek? 3. Mi a jelentősége az egyes életközösségekben a csúcsragadozóknak? 4. Indokold meg, miért nélkülözhetetlen tagjai az életközösségeknek a lebontó szervezetek! 5. Mit fejez ki a tűrőképesség? Mondj példákat tág és szűk tűrőképességű fajokra!", "Vizek, vízpartok életközössége", "189"], ["A vizek szennyezése. A vizes élőhelyek védelme A vizes élőhelyek szennyezésének gyakori formája, amikor szennyezett víz kerül a folyókba, tavakba. Szennyező forrás lehet a tisztítatlan háztartási vagy ipari szennyvíz vagy a szántóföldekről bemosódó műtrágyák. A nitrogén-, foszfor- és káliumtartalmú műtrágyák okozzák a vizek tápanyag-feldúsu lását, idegen szóval az eutrofizációját. Hatásukra a vizekben elszaporodnak az algák, a hínárfélék és a planktonok. A túlburjánzó növényzet idővel összefüggően beborítja az egész vízfelületet, így meggátolja a fény behatolását. Mivel a növényzet éjszaka maga is oxigénfogyasztó, a víz oxigénszintje lecsökken. Az elpusztuló növényzet lesüllyed a meder aljára, és bomlani kezd. A bomlás során olyan mérgező gázok keletkeznek (metán, kén-dioxid), amelyek elpusztítják többek között a vizek rovarvilágát, a halakat és a békákat is.", "A szennyvízkifolyók közelében gyakori a víz habzása", "Különböző hulladékok a vízben", "Az ipari eredetű szennyvizek mérgező anyagokat tartalmazhatnak, amelyek közvetlenül károsítják az élőlényeket. Egyes anyagok (nehézfémek) pedig beépülhetnek a táplálkozási láncokba, és annak minden tagját károsítják. Egy 4 fős háztartásban, ahol automata mosógép is működik, átlagosan naponta 400600 liter szennyvíz keletkezik. Ennek megtisztítása minden település elsődleges környezetvédelmi feladata. Ha tisztítatlanul kerül a vizekbe, az súlyos veszélyforrást jelent az élővilágra. A fekáliát (emberi ürüléket) is tartalmazó szennyvizek további komoly fertőzéseket okozhatnak. A napi 400-600 liter szennyvíz azt is jelenti, hogy ennyi ivóvízből lesz környezeti károkat is okozható szennyvíz. Ma már a tiszta ivóvíz is nagy kincs. Egyre mélyebbre kell a kutakat fúrni ahhoz, hogy elfogadható legyen a minősége. A különböző talaj- és vízszennyezések miatt a felszínhez közeli kutak vize sok helyütt fertőzött. Szennyvíztisztító", "190", "Vizek, vízpartok életközössége"], ["A folyószabályozás a természetes állapot megszűnésével jár együtt", "A folyók és tavak egy bizonyos mértékig ellenállnak a szennyezéseknek, öntisztulásra képesek. Tanultuk, hogy a planktonok, a hinarasok, nádasok, a csigák, a kagylók, a rovarok és lárváik élő szűrőberendezések. A szűrés egyik módja, hogy a szennyező anyagok megtapadnak a felületükön. Hatásosabb módja az öntisztulásnak az, hogy bizonyos élőlények nagy men�nyiségű elhalt anyagot, törmeléket fogyasztanak. A szennyezéseket azonban csak a tűrőképességük határain belül viselik el. Ezt túllépve megszűnik az öntisztulás, amit többek között a tömeges halpusztulás jelez. Az életközösségeket nem csak a szennyezések veszélyeztetik. A mocsaras területek lecsapolása, a folyók szabályozása és gátak közé szorítása, vízlépcsők és vízi erőművek létesítése az emberek életét biztonságosabbá és kényelmesebbé tette. Mindezek azonban együtt jártak a vizes élőhelyek megszűnésével, a természetes életközösségek pusztulásával. A folyóink nagy része szabályozott mederben folyik. Időszakos kiöntések hiányában azonban az ártéri erdők nagy része szárazra került, majd kipusztult. Eltűntek a halbölcsőként is működő vizes területek, megszűnt a folyó és az ártér élete közötti szoros kapcsolat. Vízszennyezés miatt pusztul az élővilág A Natura 2000 az Európai Unió által is támogatott természetvédelmi program. Ennek egyik eleme az eredeti élőhelyeket visszaállító (élőhely-rekonstrukciós) munka. A vis�szaállítás során a természetes folyamatokra építve kívánják elősegíteni az ártéri erdők, a mocsárvilág és a kiszáradt szikes tavak megújulását. Vizek, vízpartok életközössége", "191"], ["Az élőhely-visszaállító munka sikerét jelzi, hogy Magyarországon a vidrák száma újra növekszik. A vidrák Európa nyugati részén a folyók szabályozása és a parti öv növényzetének kiirtása miatt szinte teljesen kihaltak. A vidra a vizes élőhelyek csúcsragado zója. Testtömege átlagosan 10 kg, hossza 80 cm. Magányosan él, a vízparti fák gyökerei közé készíti kotorékát. Halakkal, békákkal, rákokkal táplálkozik. Úszóhártyás lábai és hajlékony teste segítségével gyorsan úszik. A víz alá merülve akár két percig is képes légvétel nélkül üldözni zsákmányát. 2-4 utódot hoz a világra, amelyek 3 hónapos korukig szopnak. Nem alszik téli álmot, ilyenkor a vermelő halakból zsákmányol. A vidrák egyedszáma hazánkban növekszik", "A hód egykor Európa valamennyi ártéri erdőjében őshonos volt. Kíméletlen vadászata és élőhelyének megszűnése miatt hazánk területéről teljesen kipusztult. 1996-tól 200 hódot telepítettek vissza a ligeterdőkbe. A természetvédelmi munka eredményességét jelzi, hogy egyedszámuk mára 500 fölé emelkedett, vagyis nemcsak újra megtelepedtek, hanem szaporodnak is. A hód 20-25 kg tömegű, rágcsáló életmódú állat. Különösen metszőfogai fejlettek. Nyáron lágy szárú növényekkel táplálkozik. Télen elrágja a fűz- és nyárfák törzsét, kiA hód visszatelepítése sikeres volt dönti a fákat, és így jut hozzá a vékony ágakhoz, rügyekhez, kéreghez. Családokban él, a kidöntött fákból gátakat épít, ezzel szabályozza, hogy élőhelyén a víz szintje állandó legyen. Életmódjával hozzájárul a ligeterdők eredeti arculatának a visszaállításához. Egy 8 fős hódcsalád a téli időszakban akár 100 darab fát is kidönt. Mindezzel azonban nem okoznak az erdőknek veszteséget, mivel a fűz- és nyárfák természetes módon, tősarjakból gyorsan pótlódnak.", "Ellenőrizd tudásodat!", "1. Mi minden károsítja a vizek életét? 2. Milyen környezeti károkat okoz a vizek tápanyag-feldúsulása? 3. Mi a jelentősége a Natura 2000-es természetvédelmi programnak?", "192", "Vizek, vízpartok életközössége"], ["Cím Megfigyelések, vizsgálatok a vizes élőhelyeken A víz jelentősége. A vizek parányi élőlényei • A víz a természetben állandó körforgást végez. Ebben nagy jelentőségük van a növényeknek is. Például egy hektár bükkerdő naponta 20 000 liter vizet párologtat el, egyetlen kukoricanövény pedig májustól szeptemberig 200 liter vizet. • Ha teheted, gyűjts különböző vízi élőhelyekről vízmintákat, és vizsgáld őket mikroszkóp alatt! Figyeld meg a plankton alakját, mozgását, hasonlítsd össze a különböző helyekről vett minták parányi élőlényeit! Készíts rajzokat a mikroszkópban megfigyelt élőlényekről! • Tanárod segítségével készíts papucsállatka-tenyészetet! Rendszeres vizsgálódás során megfigyelheted nemcsak a mozgásukat, táplálkozásukat, hanem az osztódás folyamatát is.", "Lágyszárúak a vízben és a vízparton • Vízparton (felnőtt felügyelete mellett) gyűjts hínárféléket! Csoportosítsd őket! Melyek úsznak a víz felszínén, melyek lebegnek, melyek gyökereznek, és melyeknek nincs gyökerük? Határozókönyv segítségével ismerd meg a nevüket is! • A hínárfélék oxigéntermeléséről könnyen meggyőződhetsz, ha frissen szedett hínárt vízzel töltött üvegbe teszel. Helyezd az üveget napfényes helyre! A száron, levélen megjelenő kis buborékok az oxigéntermelést jelzik. • Figyeld meg a parti övben a nád, a gyékény és a sás elhelyezkedését! Kimosódott nád- és gyékénytöveken figyeld meg a gyöktörzset! Gyűjts torzsavirágzatokat! Szedd szét és figyeld meg az apró repítőszőrös magvakat! • A hinarasok kiterjedéséből és faji összetételéből következtetni lehet a víz minőségére, ezért ezek jelzőnövények is egyben.", "A ligeterdők és a vízparti fák • Tanulmányi sétán figyeld meg a folyók, tavak partján a fákat is! Határozókönyv segítségével ismerd meg a nevüket! Készíts a fák törzséről kéreglenyomatot, gyűjts leveleket, virágzatokat, terméseket! • Figyeld meg a vízparti fákon élő rovarokat és madarakat! • A téli időszakban gyűjtött fűzfaágak vízbe állítva szobahőmérsékleten kihajtanak. Figyeld meg a barkavirágzat felépítését! Egy idő után a vízbe állított fűzfaágak járulékos gyökereket fejlesztenek.", "Az orvosi pióca. Csigák és kagylók a vízben • Orvosi piócát csalétekkel lehet fogni. Kis darab friss húst tegyél fémdobozba, és zsineggel ereszd a víz aljára! Egy-két óra múlva húzd fel! A csalétken sok húsevő állat mellett pióca is lehet. Vízzel teli üvegben figyeld meg a pióca testfelépítését, mozgását, a tapadó- és szívókorongokat! • A lakóhelyed környéki vizes élőhelyről gyűjts hínárféléket, és a tanteremben telepítsd őket akváriumba! Ezután gyűjts csigákat és kagylókat, és helyezd őket a betelepített akváriumba! Figyeld meg táplálkozásukat, mozgásukat! A kagylók héján szabad szemmel is megfigyelheted a külső meszes váz fokozatos, a héj pereme felé körkörösen haladó, rétegenkénti növekedését.", "Ízeltlábúak a vízben és a vízparton • Figyeld meg a vízparton a szitakötők mozgását, táplálkozását! • Tanárod segítségével gyűjts vízmintákat! Sűrű szövésű hálóval meríts a meder alsó részén a vízinövények között! A begyűjtött állatokat vízzel töltött edénybe téve szabad szemmel és kézinagyítóval vizsgáld! Képes határozókönyvek segítségével ismerd meg minél több állat nevét! A vizsgálat után az állatokat helyezd vissza a vízbe!", "Vizek, vízpartok életközössége", "193"], ["• Szúnyog-, szitakötő-, kérész-, tegzes- és csíkbogárlárvák számára akváriumot is berendezhetsz a tanteremben, így folyamatosan megfigyelheted életüket.", "A hazai vizekben élő halak • Figyeld meg akváriumban tartott halak mozgását, az egyes úszók működését! Figyeld meg légzésüket is, vagyis hogy percenként hányszor nyitják a szájukat! • Nagyobb bevásárlóközpontokban friss tengeri halakat is árulnak. Figyeld meg e sokféle hal (cápa, lepényhal, makréla, szardínia, lazac) testfelépítését!", "Békák a vízben és a vízparton • Kisebb állóvizekben, pocsolyákban a tavaszi hónapokban különböző fejlettségű békalárvákat foghatsz. Tedd őket vízzel töltött üvegedénybe, és figyeld meg testfelépítésüket, mozgásukat! Készíts rajzokat a különböző fejlettségű lárvákról! A vizsgálat után helyezd őket vissza eredeti élőhelyükre! • A vízpartokon kis türelemmel megfigyelheted a kecskebékák zsákmányszerzését és a hím békák hangadását, hanghólyagját. • A békák védelméért te is tehetsz! Ha a tavaszi hónapokban kevés a csapadék, az időszakos vizek, pocsolyák kiszáradnak, és a benne fejlődő békalárvák elpusztulnak. Mielőtt ez bekövetkezne, tanárod segítségével, gyűjtsd össze egy vizesvödörbe a lárvákat, és a közeli, nagyobb vizekben engedd el őket! • Tavasszal a békák a vizes élőhelyek felé vonulnak. Ilyenkor az úttesten áthaladva nagy tömegben gázolják el őket a gépjárművek. A természetvédők egyre több helyen szerveznek békamentő akciókat. Ha teheted, vegyél részt ilyen jellegű munkában!", "A vízisikló és a mocsári teknős • Ha van rá lehetőséged, figyeld meg a vízisikló mozgását a vízben és a szárazföldön! A nyári időszakban élőhelye környékén, például a hajókikötők kövei között a vízisikló levedlett bőrére is rábukkanhatsz.", "A vizek, vízpartok madarai • Ha van a lakóhelyed környékén gólyafészek, figyeld meg, mikor érkeznek vissza a gólyák, hogyan újítják fel fészküket, hány utódot nevelnek, és mennyi idő múlva repülnek ki a kisgólyák! Mely élőhelyeken látod a gólyát táplálkozni? Tapasztalataidat jegyezd fel! • Figyeld meg a vízbe mártott tollon a víz lepergését! • Állatkertben, vadasparkokban figyeld meg a tanult vízimadarak életét! • Vízparti tanulmányi kiránduláson figyeld meg az ott élő madarakat! Képes határozókönyvek segítségével ismerd meg minél több faj nevét!", "A vizek, vízpartok életközössége • Figyeld meg a vizes élőhelyeken a növények elhelyezkedését! A növények fényigényüknek megfelelően helyezkednek el a parti övben és a nyílt vizeken is. A vizek felszínén vagy ahhoz közel a fényigényes hínárfélék élnek, a mélyebb vízben olyan fajok fordulnak elő, amelyek kevesebb fénnyel is beérik.", "A vizek szennyezése. A vizes élőhelyek védelme • Lakóhelyed környéki vizes élőhelyeken figyeld meg, milyen emberi beavatkozások veszélyeztetik az életközösséget! A beavatkozásokból következtess a káros következményekre! • Vizsgáld meg tanárod segítségével a víz színét, szagát, átlátszóságát! Vízminták vizsgálatával szerezz tapasztalatokat az öntisztításban fontos mikroszkopikus élőlényekről!", "194", "Vizek, vízpartok életközössége"], ["Rendszerezzük ismereteinket! A víz jelentősége. A vizek parányi élőlényei", "A víz a természetben állandó körforgást végez. A Föld felszínéről elpárolgó víz csapadék formájában visszahull. A víz alapvető élettelen környezeti tényező. Megléte vagy hiánya határt szab az élőlények elterjedésének, az életközösségek összetételének. A plankton a vízben lebegő, szabad szemmel nem vagy alig látható növényekből és állatokból tevődik össze. Nagy tömegben élnek, gyorsan szaporodnak. Ha kedvezőtlenek a környezeti tényezők, betokozódnak. A plankton tagjai többek között a papucsállatkák, az ostoros moszatok, a vízibolhák, a szúnyog- és a vándorkagyló lárvái. Fontos szerepük van a táplálkozási láncokban és a vizek öntisztulásában.", "Lágyszárúak a vízben és a víz parton", "A vízben és a parti övben élő növények élő szűrőberendezések. Felületükön megkötik a lebegő anyagokat, a víz tápanyagait beépítik szervezetükbe. Oxigént termelnek. A vízparti növényzet táplálékforrást, fészkelő- és búvóhelyet biztosít az állatoknak. A hinarasokat sokféle növény alkotja. Úsznak a víz felszínén vagy lebegnek, többségük az iszapban gyökerezik. A parti öv jellegzetes növénye a közönséges nád és a gyékény. Buga-, illetve torzsavirágzatuk van. Gyökérzetükkel és gyöktörzsükkel erősen rögzülnek az aljzatba.", "A ligeterdők és a vízparti fák", "Ligeterdők az időszakosan vízzel elárasztott folyópartokon alakultak ki. A folyó és a ligeterdő között szoros kapcsolat van. A vízparti fák és a lágy szárú növények védik a partot a víz romboló munkájától, élőhelyet biztosítanak az ártér állatainak. A fák árnyékoló hatása megvédi a vizet a felmelegedéstől. A füzek és nyárfák kétlaki növények, a porzós és a termős virágok külön-külön növényen helyezkednek el. Az enyves éger a láperdők jellegzetes fafaja.", "Az orvosi pióca. Csigák és kagy lók a vízben", "Az orvosi pióca kültakarója, mozgás- és légzőszerve a bőrizom tömlő. Mozgása jellegzetes féregmozgás, de úszni is tud. Élősködő – gerinces állatok vérével táplálkozik. Tapadókorongjával megtapad áldozatán, szívókorongján keresztül vért szív. Hímnős állat, petékkel szaporodik. A csigák és a kagylók közös tulajdonsága, hogy külső meszes vázuk van. Mozgásszervük a hasláb, illetve a tolóláb. A nagy mocsári csiga vízben él, kezdetleges tüdővel lélegzik. A tavi kagyló kopoltyúival veszi fel az oxigént és adja le a szén-dioxidot. A csigáknak, kagylóknak fontos szerepük van a táplálkozási láncokban és a vizek öntisztulásában.", "Vizek, vízpartok életközössége", "195"], ["196", "Ízeltlábúak a vízben és a víz parton", "A szitakötők és a szúnyogok lárvái a vízben fejlődnek. A szúnyoglárvák törmelékeket fogyasztanak, a szitakötő lárvái ragadozók. A szúnyogok teljes átalakulással, a szitakötők átváltozással fejlődnek, vagyis fejlődésükben nincs bábállapot. A kifejlett szitakötők ragadozók, rágó szájszervük van. A nőstény gyötrőszúnyogok vérszívók, szájszervük szúró-szívó. Mindkét állatcsoport fontos a táplálkozási láncokban. A törmelékevő szúnyoglárvák hozzájárulnak a vizek öntisztulásához is.", "A hazai vizekben élő halak", "A különböző halfajok testfelépítésükkel és életmódjukkal alkalmazkodtak a vizes élőhelyek környezeti feltételeihez. A tőponty testrészei: fej, törzs és farok. Páros úszói a mell- és a hasúszó, páratlan a hát, a farok alatti és a farkúszó. Kültakarója nyálkás, pikkelyekkel fedett. Kopoltyúval lélegzik, sajátos szerve az úszóhólyag. Táplálkozása alapján mindenevő. Ikrákkal (petékkel) szaporodik. A kedvezőtlen téli időszakban csapatosan elvermelnek. A lesőharcsa a hazai vizek csúcsragadozója. Bőre csupasz, nyálkás.", "Békák a vízben és a vízparton", "A kecskebéka a vízpartok leggyakoribb békafaja. Kültakarója csupasz, nyálkás, színe egyben rejtőszín is. Tüdeje fejletlen, ezért a bőrén keresztül is lélegzik. Hátsó végtagja hosszú, erős ugróláb. Lábujjai között úszóhártya feszül. Életmódja ragadozó. A legyeket, szúnyogokat kicsapható nyelvével fogja el. Testhőmérséklete a halakéhoz hasonlóan változó, téli álmot alszik. Petékkel szaporodik, a lárvák vízben élnek, fejlődésük átalakulásos fejlődés. A barna varangy csak a szaporodási időszakban keresi fel a vizes élőhelyeket. A kifejlett békák nyirkos erdőkben, zöldséges- és gyümölcsöskertekben élnek.", "A vízisikló és a mocsári teknős", "A vízisikló testét száraz szarupikkelyek fedik. Növekedése során többször vedlik. Hajlékony gerincoszlopa, erős törzsi izomzata van. Életmódja ragadozó, zsákmányát éles fogaival ragadja meg. Tüdővel lélegzik. Lágy héjú tojásait a nap melege költi ki. A mocsári teknős szarupikkelyei szarupáncéllá nőttek össze. Életmódja ragadozó, de dögöket is fogyaszt. Mindkét állat testhőmérséklete változó, téli álmot alszanak.", "Vizek, vízpartok életközössége"], ["A vizek, vízpartok madarai", "A tőkés réce testfelépítése a vízi életmódhoz alkalmazkodott. A táplálékát lemezes csőrével szűri ki. Gyorsan repül, jól úszik, ujjai között úszóhártya feszül. Tollazatáról lepereg a víz. Meszes héjú tojásokkal szaporodik, melyeket a tojó a testmelegével költ ki. Kicsinyei fészekhagyók. A fehér gólyának gázlólába van. Csüdje és lábszára hosszú, csőre hegyes. Csigákkal, békákkal, egerekkel, rovarokkal, férgekkel táplálkozik. Meszes héjú tojásaiból fészeklakó fiókák kelnek ki. Költöző madár, a táplálékban szegény téli időszakot Afrikában tölti. A rétihéjának fogólába és tépőcsőre van, a vizes élőhelyek ragadozó madara. Főleg békákkal, vízimadarakkal, pockokkal, egerekkel táplálkozik.", "A vizek, vízpartok életközössége", "Az életközösségek élőhelyből és az ott megtelepedő élőlényekből állnak. Az élőlények között számos kapcsolat alakult ki. A táplálkozási kapcsolatokban a zöld növények a termelő szervezetek. Velük az elsődleges fogyasztók (növényevők) táplálkoznak, majd a másodlagos, harmadlagos fogyasztók, amelyek húsevők. A lánc végén a csúcsragadozó áll. Az élőlények különböző életműködéseit (táplálkozás, légzés, szívműködés, mozgás, szaporodás) a környezeti tényezők befolyásolják. A tűrőképesség azt fejezi ki, hogy egy élőlény a környezeti tényezők változásait milyen határok között képes elviselni. Optimum a környezeti tényezőknek azon értéke, amely a legkedvezőbb az élőlény számára.", "Vizek, vízpartok életközössége", "197"], [], ["Fogalomtár Az erdő életközössége agancs: A szarvasfélék hímjei fején növő csontképződmény, amelyet évente elhullatnak. agyar: A disznófélék meghosszabbodott szemfoga, amely a csukott szájból kilóg, a táplálék megszerzését segíti, egyben védekezőfegyver is. aljnövényzet: A több szintre tagozódó növénytakaró legalsó szintje. alkalmazkodás: Egy élőlény testfelépítésének, életmódjának és viselkedésének azok a sajátosságai, amelyek biztosítják a túlélést, alkalmassá teszik az élőlényt arra, hogy adott környezetben élhessen és fennmaradjon. Az élőlényeknek ezek a képességei több millió éves fejlődés során alakultak ki, és a természetes kiválasztódás révén maradtak fenn. avar: A talaj felszínére hullott, le nem bomlott növényi eredetű anyag (főleg elszáradt levelek). barkavirágzat: Lefelé csüngő virágzati tengelyen ülnek a virágok. belső megtermékenyítés: Olyan szaporodási forma, amikor a petesejt és a hímivarsejt az anya testén belül egyesül. beporzás: A virágpor szállítása egyik virágról a másikra, ami a szél, a víz és rovarok által történhet. Célja, hogy a virágok megtermékenyüljenek, és termést, magot érleljenek. cserje: Olyan fás szárú növény, amelynek nincs törzse, ágai közvetlenül a talaj felett elágaznak. csírázás: Az a folyamat, amikor a magból kifejlődik a csíranövény. egyensúly (dinamikus) az életközösségben: Olyan állapot, amelyben hosszabb időszakot figyelembe véve nem változik a növények, a növényevők, a ragadozók és a lebontó szervezetek száma. Az egyensúly fennmaradását alapvetően a táplálkozási láncok zavartalan működése biztosítja. egylaki növény: Egy növényen helyezkednek el a porzós és a termős virágok. életközösség: Az élőhelyből és az ott élő élőlényekből áll, amelyek szoros, önfenntartó kapcsolatban állnak egymással. élettelen környezeti tényezők: Azok a fizikai és kémiai sajátosságok (talaj, víz, levegő, fény, hőmérséklet stb.), amelyek az adott élőhelyen az élő szervezetekre hatnak. élőhely: Egy növény- vagy állatcsoport természetes otthona, olyan terület, amely az ott élő élőlények életfeltételeit biztosítja. Más megfogalmazásban: annak a környezetnek az egésze (erdő, szántóföld, tó stb.), amelyben egy élőlény él. Az élőlények alkalmazkodnak az élőhely környezeti feltételeihez, kapcsolatban vannak a környezetükkel, hatnak rá, onnan anyagokat vesznek fel, és anyagokat adnak le. élő környezeti tényezők: Az életközösségen belül az élőlények között kialakult kapcsolatok, kölcsönhatások. Ezek közül a legfontosabbak a táplálkozási kapcsolatok, táplálékhálózatok. emésztés: Olyan folyamat, melynek során az összetett anyagok egyszerűbb vegyületekké bomlanak le, majd ezek az anyagok felszívódnak, és energiaforrásként vagy a test építőanyagaiként szolgálnak. Fogalomtár", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 199", "199", "2025. 02. 14. 10:55:32"], ["erdőpusztulás: Az erdős területek fáinak fokozott mértékű kihalása. Legfőbb oka a fák tömeges betegsége, a fertőzés és a környezetszennyezés is (savas esők). erdőszél: Az erdőnek az a része, amely a szomszédos életközösséggel határos. Ez lehet egy füves terület, szántóföld, egy tó vagy akár egy közút is. erdő szintjei: Az erdő felosztása aszerint, hogy a növényzet a talajtól a lombkorona csúcsáig hogyan helyezkedik el. fenntartható fejlődés: A természeti erőforrásokkal való észszerű gazdálkodás, takarékoskodás a környezet védelme érdekében. Jelenti olyan gazdálkodási módszerek alkalmazását, amelyek nem fordulnak szembe a természetes folyamatokkal. fesztávolság: A kiterpesztett szárnyak két végpontja közötti távolság. fotoszintézis: Az a folyamat, melynek során a zöld növények szén-dioxidból és vízből a napenergia felhasználásával szerves (összetett) anyagot (cukrot) készítenek. gerincesek: Azok az állatok, amelyek testének középvonalában gerincoszlop húzódik. gerinctelenek: Azok az állatok, amelyeknél hiányzik a gerincoszlop. gombák: Olyan élőlények, amelyek elpusztult vagy élő növények és állatok összetett anyagaival táplálkoznak. Lehetnek egysejtűek vagy többsejtű telepes felépítésűek. gyapjúréteg: Az emlősök hosszabb, vastagabb fedőszőrei alatt kialakuló puha, finom szerkezetű szőrzet. gyöktörzs (idegen szóval rizóma): Föld alatti módosult szár. hagyma: A talajban lévő módosult hajtás, a növények áttelelő szerve, sok tápanyagot raktároz. Magvastagodott alsó levelekből (hagymalevelekből) áll. hímnős (kétivarú) virág: Olyan virág, amelyben porzók és termők is vannak, vagy kétivarúak. kérődző: Olyan állat, amelynek összetett gyomra van, és a részben megemésztett táplálékot felöklendezi, és újra megrágja. kihalás, kipusztulás: Egy faj teljes eltűnése akár egy kisebb élőhelyről, akár az egész Földről. A kihalás oka lehet természetes ok (például az alkalmazkodási képesség hiánya) vagy mesterséges ok (például környezetszennyezés, vadászat). korhadékevő (idegen szóval szaprofita): Olyan élőlény, amely elhalt élőlények összetett anyagaival táplálkozik. környezetszennyezés: Az emberi tevékenység nyomán káros anyagok felhalmozódása a környezetben. lárva: Fiatalkori fejlődési állapot valamely állat életciklusában. A lárva testfelépítése és életmódja legtöbbször eltérő a kifejlett állatétól. lebontás folyamata: Az élőlények maradványainak szétesése, amelyet többnyire a baktériumok és gombák életműködése biztosít. A folyamat során ásványi anyagok szabadulnak fel, amelyek újra hasznosulnak a környezetben. lebontó szervezetek: Elhalt élőlények maradványaival táplálkoznak, így jutnak energiához. A lebontó szervezetek az összetett anyagokat egyszerűbb anyagokká bontják le. leples virág: Egynemű takarólevelekből álló virág, nem különül csésze- és sziromlevelekre. 200", "Fogalomtár", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 200", "2025. 02. 14. 10:55:32"], ["levegő: A Földet körülvevő gázok keveréke; legnagyobb mennyiségben nitrogént és oxigént tartalmaz. lombhullató: Olyan fás szárú növény, amely nyugalmi állapotban rendszeresen lehullatja leveleit. A lombhullató fák levelei szélesek, erezetük jól látható, nyéllel kapcsolódnak a vesszőhöz. mag: A nyitvatermő és a zárvatermő növények virágának megtermékenyítése után a magkezdeményből alakul ki. Tartalmazza az embriót (gyököcskét, rügyecskét, sziklevelet) és számos esetben az elterjedést segítő részt is (szárnyas magokat, repítőszőröket). makktermés: Egymagú, száraz, fel nem nyíló termés. mar: A talpszinttől nézve az állat hátának legmagasabb pontja. A marmagasság ennek a távolságnak a mértékegységben kifejezett nagysága. mesterséges életközösség: Az ember hozza létre, benne az anyagforgalmat az emberi tevékenységek szabályozzák. Ilyen például a telepített erdő, a halastó, gyümölcsöskert stb. mindenevő: Olyan állat, amely növényi és állati eredetű táplálékot egyaránt fogyaszt. mirigyek: Olyan szervek, amelyek sajátos anyagokat (mérget, nyálkát stb.) termelnek. növényevő: Olyan állat, amely élő növényi részekkel táplálkozik. ragadozó: Olyan állat, amely más, élő állatokat zsákmányol. sokféleség: Az életközösség összetettsége, fajgazdagsága. Minél változatosabb a környezet (optimum), annál nagyobb lesz az adott élőhelyen a fajok száma. spóra: Olyan ivartalan szaporítósejt, amelyből kedvező környezeti feltételek mellett új, többsejtű növény vagy gomba fejlődik. A spórákkal szaporodó növényeknek (zuzmóknak, moháknak, páfrányoknak) nincs viráguk és magjuk sem. szintezettség: Egy élőhely (például erdő vagy víz) függőleges tagozódása. Minden szintnek jellegzetes növény- és állatvilága van. talajpusztulás (idegen szóval erózió): A talaj legfontosabb, felső rétegének lepusztulása, főleg a szél vagy az eső hatására. Okozhatja a helytelen mezőgazdasági tevékenység, az erdőpusztítás, a nem megfelelő öntözés. tápanyagok: Az élőlények növekedéséhez, fejlődéséhez szükséges egyszerű (szervetlen) és összetett (szerves) anyagok. táplálkozás: Olyan életjelenség, melynek során az élőlények a környezetükből tápanyagokat vesznek fel. Az életközösségen belül az anyagforgalom első mozzanata. A növények táplálkozásukban önellátók, környezetük egyszerű (szervetlen) anyagait veszik fel, és összetett anyagokká alakítják azokat. Az állatok közvetlenül vagy közvetve a növények által készített összetett anyagokkal táplálkoznak, a növények által termelt oxigént lélegzik be. Az állatok szervezetében képződött szén-dioxidot a növények hasznosítják az összetett anyagok képzése (a fotoszintézis) során. táplálkozási hálózat: A táplálékláncok sokféleségének az összekapcsolódása, szövedéke, aminek oka, hogy egy élőlény több táplálkozási láncnak is tagja lehet. Például egy macskabagoly kb. 30 különböző faj egyedeivel táplálkozik. A táplálékhálózatokon keresztül valósul meg az anyagok körforgása.", "Fogalomtár", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 201", "201", "2025. 02. 14. 10:55:32"], ["táplálkozási lánc: A táplálékforrások alapján egymással táplálkozási kapcsolatban lévő élőlények együttese. A termelő szervezetek a zöld növények, a fogyasztó élőlények a növényevők vagy más állatokkal táplálkozó húsevők (ragadozók). A csúcsragadozók azok az állatok, melyekkel más állatok már nem táplálkoznak. táplálkozási piramis: Piramis alakú diagram, amely a táplálkozási lánc egyes szintjein található élőlények egyedszámát és össztömegét mutatja. tobozvirágzat: A nyitvatermő fenyőfélék termős virágait tartalmazó elfásodó virágzat. tövis: Az ág, a levél szúrós, hegyes módosulása. túlélés: Az élőlények életben maradási képessége valamilyen kedvezőtlen környezeti hatással szemben (táplálékhiány, hőmérséklet-változások, versengés stb.). A túlélésre – a környezeti feltételekhez alkalmazkodva – az élőlények különböző szervezeti sajátosságokat fejlesztettek ki (zsír-, vízraktározás, párologtatáscsökkentés, téli álom, költözés stb.). tűlevél: A fenyőfélékre jellemző olyan levél, amelyek többnyire vékonyak, hegyesek, nincs levélnyelük, és nagyobb részük örökzöld. vacok: A virágtengely kiszélesedő része. vándorlás: Az állatoknak különböző élőhelyek közötti, évszakokhoz köthető mozgása, melynek célja a táplálkozás vagy a szaporodás. váz: Támaszt nyújt a testnek. Lehet külső váz, például a csigák, kagylók meszes váza vagy a rovarok kitines váza, és lehet belső váz, ilyenek a csontok és porcok.", "Kölcsönhatások. Az energia belső energia: A testek belső szerkezetével, a részecskék rendezetlen mozgásával összefüggő energia. csillag: A Földhöz viszonyítva hatalmas méretű égitest. A benne lezajló fizikai folyamatok következtében fényt és hőt sugároz. elektromos kölcsönhatás: A különböző elektromos állapotú testek között jelentkező vonzó- vagy taszítóhatás. elektromos mező: Az elektromos állapotú testeket körülvevő, sajátságos környezet. Más testekre kifejtett hatása vonzó- vagy taszítóhatás. energia: A testek változtatóképessége. erőhatás: A testek mozgásállapotát megváltoztató hatás. gravitációs kölcsönhatás: A testek között jelentkező vonzóhatás. gravitációs mező: A testeket körülvevő sajátságos környezet. Más testekre kifejtett hatása mindig vonzóhatás. helyzeti energia: A felemelt testek változtatóképessége. hőenergia (hő): A belsőenergia-változással járó folyamatok során átadott, illetve átvett energia. kémiai változás: Olyan változás, amelyben megváltozik a részt vevő anyagok minősége, és új anyagok keletkeznek. kölcsönhatás: A testek egymásra kifejtett hatása. 202", "Fogalomtár", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 202", "2025. 02. 14. 10:55:32"], ["környezetszennyező anyag: Az embert, illetve a környezetet veszélyeztető vagy károsító anyag. mágneses kölcsönhatás: Mágnes és mágnes, illetve mágnes és mágnesezhető anyag közötti kölcsönhatás. mágneses mező: A mágneseket körülvevő, sajátságos környezet. Mágnesekre vonzó- vagy taszító-, mágnesezhető anyagokra vonzóhatást fejt ki. mechanikai energia: Gyűjtőfogalom; idetartozik a rugalmas, a helyzeti és a mozgási energia. mechanikai kölcsönhatás: Gyűjtőfogalom; idetartozik minden, a mozgásállapot-változással járó kölcsönhatás. megújuló energiaforrás: Olyan energiaforrás, amely a természeti folyamatok révén állandóan rendelkezésünkre áll vagy újratermelődik (például napenergia, szélenergia, vízenergia). mozgásállapot: Gyűjtőfogalom; azt fejezi ki, hogy egy test más testekhez viszonyítva hogyan mozog. mozgási energia: A mozgó testek változtatóképessége. napelem: A napsugárzás hasznosításának egyik eszköze. A napsugárzás energiáját elektromos energiává alakítja át. napenergia: A Nap belsejében lejátszódó folyamatokban termelődő energia. Hétköznapi értelemben a Föld felszínét elérő, általunk hasznosítható napsugárzást értjük alatta. napkollektor: A napsugárzás hasznosításának egyik eszköze. A napsugarak a kollektor csőrendszerében keringő folyadékot melegítik fel. nem megújuló energiaforrás: Olyan energiaforrás, amely nem vagy csak nagyon hosszú idő alatt tud újratermelődni (például a kőszén, a kőolaj és a földgáz). radioaktív anyag: Részecskéi külső beavatkozás nélkül más anyagokká alakulnak át, miközben különböző sugárzásokat bocsát ki. rugalmas energia: Az összenyomott (vagy megnyújtott) rugó változtatóképessége. termikus kölcsönhatás: A testek között különböző hőmérsékletük miatt fellépő hatás.", "A Föld bolygó Baktérítő: Nevezetes szélességi kör az északi szélesség 23,5°-án. bolygó: Saját fénnyel nem rendelkező nagy méretű égitest a Naprendszerben. A Naprendszer bolygói a Naptól távolodó sorrendben: A Merkúr, a Vénusz, a Föld, a Mars, a Jupiter, a Szaturnusz, az Uránusz és a Neptunusz. csillagok: Magas hőmérsékletű égitestek, saját fénnyel rendelkeznek, akárcsak a Nap. déli félgömb: Az Egyenlítőtől délre található félgömb. déli sarkkör: Nevezetes szélességi kör a déli szélesség 66,5°-án. Déli-sark: A déli félgömbön, a déli szélesség 90°-án található legkisebb szélességi kör, a Föld legdélebbi pontja. déli szélesség: A déli félgömbön található szélességi körök jelzőjeként használjuk; rövidítése: d. sz. Fogalomtár", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 203", "203", "2025. 02. 14. 10:55:32"], ["éghajlati övezet: A Föld gömb alakjának következtében alakul ki. A napsugarak beesési szögének megfelelően forró vagy trópusi, mérsékelt és hideg éghajlati övezetről beszélhetünk. Csaknem megszakítás nélkül fogják körbe a Földet. Egyenlítő: Kör alakú vonal, amely a Földet széltében két egyenlő félgömbre osztja. A leghosszabb szélességi kör. északi félgömb: Az Egyenlítőtől északra található félgömb. Északi-sark: Az északi félgömbön, az északi szélesség 90°-án található legkisebb szélességi kör, a Föld legészakibb pontja. északi sarkkör: Nevezetes szélességi kör az északi szélesség 66,5°-án. északi szélesség: Az északi félgömbön található szélességi körök jelzőjeként használjuk; rövidítése: é. sz. év: Az évi időszámítás alapegysége, vagyis az az időszak, ami alatt a Föld egyszer körbejárja a Nap körüli pályáját. Időtartama (kerekítve): 365 és 1/4 nap. forró (trópusi) éghajlati övezet: Az Egyenlítő két oldalán, a térítők között elhelyezkedő éghajlati övezet; a legmelegebb éghajlati övezet változatos éghajlatokkal. Föld forgástengelye: Az Északi- és a Déli-sarkon keresztülfutó képzeletbeli tengely, 66,5°ot zár be a keringés síkjára. földrajzi fokhálózat: A szélességi és a hosszúsági körök által alkotott képzeletbeli háló a földgömbön. földrajzi hosszúság: A kezdő hosszúsági körhöz (Greenwichhez) viszonyított távolság fokokban kifejezve. földrajzi szélesség: A kezdő szélességi körhöz, az Egyenlítőhöz viszonyított távolság fokokban kifejezve. földrész (kontinens): A legnagyobb kiterjedésű szárazföld. GPS: Egy helymeghatározó rendszer. A segítségével bárhol – szárazföldön, vízen és levegőben egyaránt – és bármikor meghatározható egy adott pont helye. hideg éghajlati övezet: A sarkkörökön belül húzódó éghajlati övezet, amelynek jellemzője a nagyon alacsony hőmérséklet. hosszúsági körök: É–D irányú, egyenlő nagyságú, olyan, a földgömbre rajzolt képzeletbeli körök, amelyek a sarkpontokon metszik egymást. keleti hosszúság: A kezdő hosszúsági körtől (Greenwichtől) keletre elhelyezkedő hosszúsági körök jelzője; rövidítése: k. h. kezdő hosszúsági kör: 0°, London külvárosán, Greenwichen húzódik keresztül, innen kapta a nevét is. mérsékelt éghajlati övezet: A térítők és a sarkkörök között elhelyezkedő éghajlati övezet. Általában négy évszak jellemzi. A légmozgás nyugati irányú. Az északi félgömbön az északi, a déli félgömbön pedig a déli mérsékelt övezet található. Nap: 1. A Naprendszer középpontjában található csillag, amely fényt és meleget sugároz a Földre. 2. nap: A Nap két egymást követő delelése között eltelt idő. Minden napot éjféltől a következő éjfélig számítunk, és 24 órára osztjuk be. 204", "Fogalomtár", "OH_TER06TB_Termeszettudomany_6_2025_FJ.indd 204", "2025. 02. 14. 10:55:33"], ["Naprendszer: Részei a Nap, a bolygók és a holdjaik, a kisbolygók, az üstökösök, a meteorok és a bolygók közötti gáz- és porfelhők, valamint mesterséges égitestek. Középpontjában a Nap található. nevezetes szélességi körök: Egyenlítő, Ráktérítő, Baktérítő, északi sarkkör, déli sarkkör, Északi-sark, Déli-sark. Kijelölik az éghajlati övezetek határait. nyári napforduló: Június 22-én délben a napsugarak a Ráktérítőre esnek merőlegesen, ezért az északi félgömbön ezen a napon a leghosszabbak a nappalok. Az északi félgöm bön a csillagászati nyár kezdete. nyugati hosszúság: A kezdő hosszúsági körtől (Greenwichtől) nyugatra elhelyezkedő hosszúsági körök jelzője; rövidítése: ny. h. óceán: A legnagyobb kiterjedésű állóvíz. óceáni hatás: Az óceánok irányából érkező légtömegeknek a szárazföld éghajlatára gyakorolt hatása: állandó páradús légtömegek és az óceánok hűtő-fűtő hatása. őszi nap-éj egyenlőség: A Nap szeptember 23-án egyformán világítja meg az északi és a déli félgömböt. Emiatt a nappal és az éjszaka egyaránt 12-12 óra hosszat tart. Az északi félgömbön a csillagászati ősz kezdete. Ráktérítő: Nevezetes szélességi kör a déli szélesség 23,5°-án. szélességi körök: Ny–K irányú, különböző nagyságú, olyan, a földgömbre rajzolt képzeletbeli körök, amelyek az Egyenlítővel párhuzamosan helyezkednek el. tavaszi nap-éj egyenlőség: Március 21-én délben a napsugarak az Egyenlítőre esnek merőlegesen, ezen a napon a Nap egyformán világítja meg az északi és a déli félgömböt, emiatt a nappal és az éjszaka egyaránt 12-12 óra hosszat tart. Az északi félgömbön a csillagászati tavasz kezdete. téli napforduló: December 21-én délben a napsugarak a Baktérítőre esnek merőlegesen, ezért az északi félgömbön ezen a napon a legrövidebbek a nappalok. Az északi félgöm bön a csillagászati nyár kezdete. tényleges földrajzi helyzet: Azt mutatja, hogy egy adott hely hol helyezkedik el a Földön, vagyis melyik szélességi és hosszúsági körök futnak rajta keresztül, és mi jellemzi a tengerszint feletti magasságát. világegyetem: Része a Naprendszer és minden, amit akkor látunk, ha felnézünk az égboltra. viszonylagos földrajzi helyzet: Más területekhez, például a szomszédos földrajzi helyekhez való viszonyt jelenti.", "A természet erői andezit: A magmás kőzetek csoportjába tartozó, a vulkánkitörések közben a felszínre ömlő láva megszilárdulásával keletkezett finom szemcsés, kemény kőzet. aprózódás: Amikor a külső erők hatására a kőzetek darabjaikra esnek szét. bazalt: A magmás kőzetek csoportjába tartozó, a vulkánkitörések során felszínre került kőzetolvadék megszilárdulása után keletkezett rendkívül kemény kőzet. A színe a szürkétől a feketéig terjedhet. Fogalomtár", "205"], ["belső erők: A Föld belsejéből ható erők, ezeknek köszönhető a gyűrődés, a vetődés, ezek emelik magasra a hegységeket, hozzák létre a vulkánokat. deltatorkolat: A tengerhez közeledő folyó által lerakott hordalékból létrejövő torkolat. erózió: A talaj pusztulása; a legnagyobb kárt a víz és a szél pusztító tevékenysége okozza. futóhomok: A szél által szállított, görgetett homok. gleccser: A hegy lejtőjén lefelé mozgó jégtömeg. gyűrődés: A Föld mélyén a nagyon magas hőmérsékleten képlékennyé váló kőzetrétegek tartós oldalirányú erők hatására meggyűrődnek. humusz (televény): A talajban felhalmozódó növényi és állati maradványok. karsztformák: A karsztosodás során a csapadékvíz oldó hatására kialakult formák (például víznyelő, dolina, barlang, cseppkő). karsztosodás: A csapadékvíz oldó hatására a mészkőhegységekben bekövetkező változások. kialudt vulkán: Olyan vulkán, amely többé már nem tör ki, múltbeli kitöréseiről csak a felépítő kőzetük és a formájuk árulkodik. komposztálás: A komposzt előállításának a folyamata. A komposzt egy olyan, tápanyagban gazdag anyag, ami a növényi hulladékok oxigén jelenlétében végbement bomlása során keletkezik. A talaj tápanyag-utánpótlására használják. kőzet: A földfelszín szilárd alkotói, melyek lehetnek magmás, üledékes és átalakult kőzetek. kráter: A vulkán része, ezen keresztül ömlik a felszínre a láva. külső erők: A hőingás, a szél, a víz, a jég, az élővilág. Nagy szerepük van a felszínformálásban. lánchegység: Gyűrődés során kialakult hegység, melynek a vonulatai láncszerűen kapcsolódnak egymáshoz. Párhuzamos hegyvonulatok és hosszanti völgyek jellemzik. Magasságukból következik, hogy felszínüket a jég által kialakított hegyes, sziklás csúcsok, éles, csipkézett gerincek és meredek, szakadékos lejtőjű hegyoldalak jellemzik. láva: A felszínre került izzó kőzetolvadék. lepusztulás: Amikor a földfelszín anyagai a külső erők (hőingás, fagy, szél, folyóvizek, jég) hatására lepusztulnak. lösz: Nagyon puha, a szél által felhalmozott finom porból kialakult üledékes kőzet. magma: Nagy mélységben található izzó kőzetolvadék. magmakamra: Nagy mélységben található üreg, amelyben az izzó kőzetolvadék, a magma helyezkedik el. magmás kőzetek: Az olvadt kőzetanyag kihűlésével keletkeztek nagy mélységben vagy a felszínen (például gránit, andezit, bazalt). mészkő: A leggyakoribb üledékes kőzet; a tengerek és a tavak medencéjében alakult ki, ahol az üledékek az elpusztult élőlények mészvázaival cementálódnak össze. ökológiai kertművelés: Olyan gazdálkodási forma, mely tiltja vagy nagymértékben korlátozza a növényvédő szerek, műtrágyák és bizonyos talajjavító szerek alkalmazását.", "206", "Fogalomtár"], ["rétegvulkán: A vulkánkitörés többszöri megismétlődése következményeként az egymást váltó lávaömlések és törmelékszórások anyagából alakul ki. Vulkáni és vulkáni törmelékes kőzet váltakozva építi fel. röghegység: Vetődéssel kialakult, rögökből álló, lesüllyedt árkokkal és medencékkel tagolt hegység. sivatagok: Ott alakulnak ki, ahol az időjárás miatt a felszínen nem képes megtelepedni a növényzet. Ennek oka lehet a csapadék hiánya, de a nagy hideg is kialakíthatja. talaj: A földfelszín legfelső, laza, termékeny takarója. talajpusztulás: Amikor a víz a talaj felső rétegeiből kimossa és elszállítja a kisebb részecskéket, fokozatosan elvékonyodik a termőréteg. A szél a száraz területeken a talajpusztító tevékenysége során kifújja a talajszemcséket. sziget: Vízzel körülvett szárazföld álló- és folyóvizekben. törésvonal: Akkor alakul ki, amikor az egymásra rakódott kőzetrétegek a belső erők hatására megpattannak; ezek mentén emelkednek ki vagy süllyednek le a kőzetrétegek egyes részei. üledékes kőzetek: Lepusztuló kőzetek törmelékeiből, valamint élőlények maradványaiból épülnek fel, legtöbbször a tengerek és a tavak fenekén ülepednek le, ahol összecementálódnak, de kialakulhatnak a szárazföldek felszínén is. V alakú völgy: Nagy esésű folyók által kialakított völgy. vetődés: A törésvonalak mentén a belső erők hatására az egyes rétegek kiemelkednek, míg mások lesüllyednek. vízjárás: A folyók vízszintjének az ingadozása. vízhozam: A folyómeder keresztmetszetén egységnyi idő (másodperc, perc) alatt átfolyó víz térfogata. víznyelő: Tölcsér alakú, felszíni karsztjelenség. vulkáni tufa: A vulkáni működés során a törmelékekből kialakuló puha kőzet. zátony: A folyó által lerakott hordalékból álló, a víz felszíne alatt található képződmény a folyómederben; tengerekben is jellemző, ott a hullámzás hordja össze. U alakú völgy: A gleccserjég csiszoló munkája által kialakított völgy.", "Az őshonos füves területek és a mezők életközössége áttelelés: Téli nyugalmi állapot, melynek célja a kedvezőtlen időszak átvészelése. A növényeknél ilyenek például az áttelelő szervek (rügy, hagyma, gyöktörzs stb.), az állatoknál a téli álom (sün) vagy a részleges téli álom (denevérek). cellulóz: Összetett anyag (szénhidrát), amely a növények sejtfalát alkotja. A növényevők számára nehezen emészthető, rostos tápanyag. Az emésztését (lebontását) a növényevő állatok bélcsatornájában élő baktériumok segítik.", "Fogalomtár", "207"], ["egynyári növény: Olyan lágy szárú növény, amelynek élete tavasztól őszig tart, ilyen például a paprika, a paradicsom, az uborka, a bab vagy a borsó. együttélés (szimbiózis): Két élőlény közötti szoros kapcsolat, amely mindkét faj számára hasznos. élőlények sokfélesége: Az élővilág teljes változatossága, amely az evolúció során alakult ki. globális felmelegedés (éghajlatváltozás): A Földön az átlagos hőmérséklet mérhető növekedése a korábbi adatokhoz képest. hüvelytermés: Száraz, felnyíló termés, például a borsó vagy a bab. ivaros szaporodás: A szaporodás egyik módja, ivarilag különböző egyedektől származó hím- és női ivarsejtek egyesülésével (megtermékenyítés) kezdődik az új egyed kifejlődése. kaszattermés: A fészekvirágzatúak egymagvú, zárt, száraz termése. kloáka: A tápcsatorna, a kiválasztó szerv és az ivarszervek közös kivezető nyílása. műtrágya: Kémiai anyag, melyet a termesztett növények növekedésének serkentésére használnak. zárt termések: Olyan termések, amelyek nem nyílnak fel, a mag csak a termésfal felnyitása, lebomlása után válik szabaddá.", "Vizek, vízpartok életközössége álcázás: Egy állat kültakarójának olyan színezete, mintázata, viselkedése, amelynek segítségével jól beleolvad a környezetébe. bőrlégzés: A testfelszínen keresztül történő gázcsere. dögevő: Olyan állat, amely elpusztult állatok maradványaival táplálkozik, vagy más állatok által otthagyott tetemek maradványait fogyasztja el. élősködő (parazita): Olyan élőlény, amely egy másik élőlényben vagy annak testfelszínén él, és annak anyagaival táplálkozik. gazdaszervezet: Állat vagy növény, amelyből az élősködők táplálkoznak. gyökérsarj: Gyökerekből kifejlődő hajtás (leveles szár). ivartalan szaporodás: A szaporodás nem ivarsejtek egyesülésével kezdődik, ilyen például az osztódás, sarjadzás. kétlaki növény: Az egyivarú porzós és termős virágok külön-külön növényen helyezkednek el. kopoltyú: A vízben élő állatok légzőszerve, amelyen keresztül felveszik az oxigént, és leadják a szén-dioxidot. külső megtermékenyítés: Az ivarsejtek (petesejtek, hímivarsejtek) a nőstény testén kívül egyesülnek. moszatok: Egyszerű testfelépítésű, egysejtű vagy többsejtű növények, melyeknek nincs gyökerük, száruk, levelük és viráguk.", "208", "Fogalomtár"], ["oldalvonal: A halak testén hosszirányban húzódó érzékszerv, mellyel érzékelik a vízben az áramlásokat, rezgéseket. önszabályozás: Egy életközösségben az élőlények olyan működése, amellyel a kedvezőtlen, zavaró hatásokat életműködéseikkel szabályozzák, kiküszöbölik vagy kiegyensúlyozzák. Ilyen például a vizek öntisztuló képessége. öntisztuló képesség: A természetes vizek olyan tulajdonsága, melynek köszönhetően a bennük élő parányi élőlények képesek lebontani, hatástalanítani a szennyeződéseket. plankton: Növények és állatok tömege, melyek a vízben lebegnek, szabad szemmel nem vagy alig láthatók. Gyorsan szaporodnak. tápanyag-feldúsulás (idegen szóval eutrofizáció): A vizekben bizonyos tápanyagok (nitrogén, foszfor) felhalmozódása, mely a növényzet túlzott elszaporodását váltja ki. torzsa: Megvastagodott virágzati tengely. tűrőképesség: Az a mérték (a minimum és a maximum közötti távolság), amelyen belül az élőlények a környezet hatásait elviselik. vízszennyezés: Olyan oldott és oldhatatlan anyagok jelenléte a vízben, amelyek a vízi életfeltételeket kedvezőtlenül b
