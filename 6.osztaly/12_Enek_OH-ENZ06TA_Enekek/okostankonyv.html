<style>
:root{
  --fo:#1a5f7a; --kiemelo:#159895; --hatter:#f8fafc; --kartya:#ffffff;
  --keret:#e2e8f0; --szoveg:#1e293b; --halvany:#64748b; --doboz:#fef9c3;
  --sugar:12px;
}
@media(prefers-color-scheme:dark){
  :root{--fo:#38bdf8;--kiemelo:#2dd4bf;--hatter:#0f172a;--kartya:#1e293b;
  --keret:#334155;--szoveg:#e2e8f0;--halvany:#94a3b8;--doboz:#422006}
}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 system-ui,sans-serif;background:var(--hatter);color:var(--szoveg)}
img{max-width:100%;height:auto;border-radius:8px;margin:8px 0;display:block}
/* ---------- FEJLÉC ÉS KERESŐ ---------- */
.fejlec{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;padding:8px 16px;background:var(--kartya);border-bottom:1px solid var(--keret)}
.fejlec b{color:var(--fo)}
.fejlec input[type=search]{flex:1;min-width:180px;max-width:380px;margin-left:auto;padding:8px 14px;border:1px solid var(--keret);border-radius:999px;background:var(--hatter);color:var(--szoveg);font:inherit}

/* ---------- ELRENDEZÉS: tartalomjegyzék + tartalom ---------- */
.elrendezes{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px;max-width:1150px;margin:16px auto;padding:0 16px}
@media(max-width:860px){.elrendezes{grid-template-columns:1fr}.tartalomjegyzek{position:static!important;max-height:none!important}}
.tartalomjegyzek{position:sticky;top:60px;align-self:start;max-height:calc(100vh - 80px);overflow:auto;padding:14px;background:var(--kartya);border:1px solid var(--keret);border-radius:var(--sugar)}
.tartalomjegyzek h4{margin:12px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--halvany)}
.tartalomjegyzek a{display:block;padding:3px 0;text-decoration:none;color:inherit;font-size:15px}
.tartalomjegyzek a:hover{color:var(--fo)}

/* ---------- LECKÉK ÉS DOBOZOK ---------- */
.kartya{background:var(--kartya);border:1px solid var(--keret);border-radius:var(--sugar);padding:6px 20px 16px;margin-bottom:16px}
.lecke[hidden]{display:none}
.fontos{background:var(--doboz);border-left:5px solid #f0b400;border-radius:8px;padding:10px 14px;margin:14px 0}
.kiserlet{border:2px dashed var(--kiemelo);border-radius:10px;padding:10px 14px;margin:14px 0}
table.adat{border-collapse:collapse;margin:12px 0}
table.adat th,table.adat td{border:1px solid var(--keret);padding:6px 12px;text-align:left}
mark{background:#ffe58a;color:#000;border-radius:3px}
.jegyzet textarea{width:100%;min-height:140px;padding:10px;border:1px solid var(--keret);border-radius:10px;background:var(--hatter);color:var(--szoveg);font:inherit}
.gomb{padding:8px 16px;border:0;border-radius:999px;background:var(--kiemelo);color:#fff;font:600 15px system-ui,sans-serif;cursor:pointer}
.demo-jelzo{display:inline-block;margin-left:8px;padding:2px 10px;border-radius:999px;background:#f0b400;color:#000;font-size:13px;font-weight:700;vertical-align:middle}
</style>
</head>

  d: f.feladat,
}));
const panel = (typeof MOTFeladat !== "undefined") ? MOTFeladat.panel($("#feladatok"), FELADATOK) : null;

/* ---- leckék kirajzolása ---- */
let animok = [];
function leckekKirajzol(szuro) {
  animok.forEach((a) => a.torol && a.torol()); animok = [];
  const cel = $("#leckek"); cel.innerHTML = "";
  KONYV.fejezetek.forEach((fej) => {
    fej.leckek.forEach((l, i) => {
      const szoveg = (l.cim + " " + l.html.replace(/<[^>]+>/g, " ")).toLowerCase();
      if (szuro && !szoveg.includes(szuro)) return;
      const d = document.createElement("section"); d.className = "kartya lecke"; d.id = "lecke-" + l.id;
      let html = `<h2>${l.cim}</h2>` + l.html;
      if (szuro) html = html.replace(new RegExp("(" + szuro.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")(?![^<]*>)", "gi"), "<mark>$1</mark>");
      d.innerHTML = html; cel.appendChild(d);
      if (szuro) return;
      let utolso = d;
      if (typeof animBeszur === "function") (l.anim || []).forEach((k) => { const h = animBeszur(k, utolso, "utan"); animok.push(h); utolso = h.elem; });
      if (i === fej.leckek.length - 1 && fej.feladat && panel) {
        const g = MOTFeladat.vegeGomb(FELADATOK.find((x) => x.id === fej.id), panel); utolso.insertAdjacentElement("afterend", g);
      }
    });
  });
  if (!cel.children.length) cel.innerHTML = `<div class="kartya">Nincs találat.</div>`;
}
leckekKirajzol("");
$("#kereso").addEventListener("input", (e) => leckekKirajzol(e.target.value.trim().toLowerCase()));

/* ---- saját jegyzet ---- */
const JEGYZET_KULCS = "mot_jegyzet_" + KONYV.azonosito;
try { $("#jegyzet").value = localStorage.getItem(JEGYZET_KULCS) || ""; } catch (e) {}
$("#jegyzet").addEventListener("input", (e) => { try { localStorage.setItem(JEGYZET_KULCS, e.target.value); } catch (x) {} });
$("#jegyzet-mentes").onclick = () => {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([$("#jegyzet").value], { type: "text/plain;charset=utf-8" }));
  a.download = KONYV.azonosito + "-jegyzet.txt"; a.click(); URL.revokeObjectURL(a.href);
};
</script>

<script>document.write('<script src="../assets/js/hatter.js" data-tema="' + (KONYV.tema || "") + '"><\/script>');</script>
</body>
