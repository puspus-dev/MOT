<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Irodalom 6. – Egri csillagok</title>
<style>:root{--bg:#fff;--fg:#1a1a1a;--ok:#1b7a3a;--no:#b3261e;--bd:#ccc;--ac:#2a5db0}@media(prefers-color-scheme:dark){:root{--bg:#161616;--fg:#eee;--ok:#5fd38a;--no:#ff8a80;--bd:#444;--ac:#8ab4f8}}
body{background:var(--bg);color:var(--fg);font:16px system-ui,sans-serif;max-width:680px;margin:0 auto;padding:16px}
.q{border:1px solid var(--bd);border-radius:8px;padding:12px;margin:12px 0}.o,.b{display:block;width:100%;text-align:left;margin:6px 0;padding:10px;border:1px solid var(--bd);border-radius:6px;background:none;color:inherit;font:inherit;cursor:pointer}
input,select{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:6px;background:var(--bg);color:var(--fg);max-width:100%}.r{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.ok{border-color:var(--ok)!important;color:var(--ok)}.no{border-color:var(--no)!important;color:var(--no)}.bar{height:8px;background:var(--bd);border-radius:4px}.bar i{display:block;height:8px;background:var(--ac);border-radius:4px;width:0}
a{color:var(--ac)}.b{width:auto;display:inline-block;background:var(--ac);color:#fff;border:0}</style></head><body>
<p><a href="../">&larr; Vissza</a></p><h1>Irodalom 6. – Egri csillagok</h1><div class="bar"><i id="p"></i></div><div id="c"></div><h2 id="s"></h2><button class="b" onclick="location.reload()">Újra</button>
<script>const D=[{"t": "f", "q": "Ki írta az Egri csillagokat? (vezetéknév)", "a": ["Gárdonyi", "Gárdonyi Géza"]}, {"t": "f", "q": "Melyik évben volt Eger ostroma?", "a": ["1552"]}, {"t": "c", "q": "Ki volt Eger kapitánya?", "o": ["Dobó István", "Bornemissza Gergely", "Mátyás király"], "a": 0}];let n=0,k=0;const c=document.getElementById('c');const N=s=>s.toLowerCase().replace(/\s+/g,'').replace(',','.').replace(/\.$/,'');
function fin(ok,box){box.dataset.d=1;k++;if(ok)n++;document.getElementById('p').style.width=100*k/D.length+'%';if(k==D.length)document.getElementById('s').textContent='Eredmény: '+n+' / '+D.length}
D.forEach((x,i)=>{const d=document.createElement('div');d.className='q';d.innerHTML='<b>'+(i+1)+'. '+x.q+'</b>';
if(x.t=='c'){const m=x.o.map((o,j)=>[o,j]).sort(()=>Math.random()-.5);m.forEach(([o,j])=>{const b=document.createElement('button');b.className='o';b.textContent=o;b.onclick=()=>{if(d.dataset.d)return;const ok=j==x.a;b.classList.add(ok?'ok':'no');if(!ok)[...d.querySelectorAll('.o')].find(e=>e.textContent==x.o[x.a]).classList.add('ok');fin(ok,d)};d.appendChild(b)})}
else if(x.t=='f'){const r=document.createElement('div');r.className='r';r.innerHTML='<input placeholder="Válasz"><button class="b">Ellenőriz</button><span></span>';const[i1,bt,sp]=r.children;bt.onclick=()=>{if(d.dataset.d)return;const ok=x.a.map(N).includes(N(i1.value));sp.textContent=ok?'✔ Helyes!':'✘ Helyes válasz: '+x.a[0];sp.className=ok?'ok':'no';fin(ok,d)};d.appendChild(r)}
else{const L=x.p.map(e=>e[1]).sort(()=>Math.random()-.5);const sel=[];x.p.forEach(e=>{const r=document.createElement('div');r.className='r';const s=document.createElement('select');s.innerHTML='<option value="">–</option>'+L.map(l=>'<option>'+l+'</option>').join('');r.append(e[0]+' → ',s);sel.push(s);d.appendChild(r)});
const bt=document.createElement('button');bt.className='b';bt.textContent='Ellenőriz';bt.onclick=()=>{if(d.dataset.d)return;let ok=true;sel.forEach((s,j)=>{const g=s.value==x.p[j][1];if(!g)ok=false;s.className=g?'ok':'no'});fin(ok,d)};d.appendChild(bt)}
c.appendChild(d)});</script></body></html>
